[project]
name = "bandit-browser"
version = "0.1.0"
description = "A machine-readable atlas of theoretical results, piloted on bandits"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sympy>=1.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
