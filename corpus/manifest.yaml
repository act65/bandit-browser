# bandit-browser Phase 1 pilot corpus manifest
# Created: 2026-10-19
#
# Pilot slice: stochastic K-armed, adversarial K-armed / best-of-both-worlds (incl. corrupted
# stochastic), stochastic linear, adversarial linear, linear contextual (finite arms).
#
# Selection criteria:
#   - Classic upper AND lower bound results that define the slice (Lai-Robbins, UCB1, EXP3,
#     MOSS, KL-UCB, Thompson Sampling, OFUL, Dani et al., Exp2/John, ...).
#   - Papers that closed known gaps: minimax log-factor gaps (MOSS, Li-Wang-Zhou 2019),
#     simultaneous minimax + asymptotic optimality (KL-UCB++, KL-UCB-switch, MOTS, ExpTS+),
#     asymptotic optimality in linear bandits (end of optimism, OSSB, IDS, SOLID),
#     best-of-both-worlds optimality (Tsallis-INF and successors).
#   - Recent papers (2018-2026) with "comparison with prior work" tables, for cross-checking
#     extracted bounds.
#   - Strong preference for arXiv (LaTeX source is parsed); 6 essential non-arXiv classics
#     are included with arxiv_id: null and a DOI or publisher/proceedings URL.
#
# Field notes:
#   - verified: true means the arXiv id was checked against arxiv.org/abs/<id> (title, authors
#     and year below are copied from the arXiv metadata), or, for arxiv_id: null, the DOI was
#     checked against Crossref / the URL against the landing page.
#   - title is the arXiv title, which can differ from the venue title (e.g. abbasi2011oful).
#   - year is the year of the first arXiv version (publication year for non-arXiv entries);
#     the id slug may use the venue year instead.
#   - has_comparison_table was set by scanning the arXiv LaTeX source for table/tabular
#     environments that compare against prior work, then spot-checking ambiguous cases by hand;
#     "unknown" for non-arXiv entries (not scanned).
#     "false" means no such table was found in the source (a comparison may still be in prose).
#   - venue is from memory or arXiv comments; null where not confirmed.
#   - slice is the primary slice; several papers span more (e.g. bubeck2012survey covers all,
#     lee2021instanceminimax and kong2023bestofthree are best-of-both-worlds for *linear* bandits).
