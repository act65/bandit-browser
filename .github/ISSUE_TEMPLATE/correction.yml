name: Correction
description: Report a wrong or missing result, setting or attribution in the atlas
title: "Correction: "
labels: [correction]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Every result in the atlas was extracted by an LLM and most are not human-verified, so reports
        like this are how it gets better. A short pointer is enough: we check the paper and record the fix in
        `data/corrections.yaml` (extractions themselves are never edited by hand).
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the setting, paper or Explore view (filled in automatically from the site's "Report a problem" links)
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Result or setting id
      description: e.g. auer2002ucb1:r1 or S-4a7d7ef8 (optional)
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - The bound (expression, rate, constants)
        - Upper vs lower bound, or the regret notion
        - The setting (assumptions, feedback, environment, ...)
        - Attribution (wrong paper or theorem)
        - A result is missing
        - A gap or "tight" verdict is wrong
        - Something else
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should it say?
      description: The correct statement, as precisely as you can
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paper, theorem number or page, and a quote if possible
  - type: checkboxes
    id: author
    attributes:
      label: About you
      options:
        - label: I am an author of the paper concerned
