# COLT open problems placed in the atlas (pipeline/link_open_problems.py). LLM judgement, not human-verified.
links:
  Guzman15:
    title: 'Open Problem: The Oracle Complexity of Smooth Convex Optimization in Nonstandard Settings'
    year: 2015
    status: partially_resolved
    links: []
    none_reason: The problem asks for the deterministic first-order oracle complexity (optimization error after
      T gradient queries) of smooth convex minimization when the smoothness norm (ℓq or Schatten-q) differs from
      the norm of the domain ball (ℓp or Schatten-p). None of the candidate settings track this. The candidates
      cover bandit, zeroth-order, dueling and online-regret settings over generic convex bodies, and none has norm-mismatched
      smoothness geometry. The first-order online settings measure regret, and none of them records optimization-error
      rates for the offline smooth problem in non-Euclidean geometry.
    resolving_in_corpus: []
    models:
    - claude-opus-5-5
