        setting (sleeping/sabotaged shortest path). But the open problem is about whether the sleeping-experts regret
        can be achieved in polynomial time. It was resolved by computational hardness (Kale-Lee-Pál 2016), not by
        statistical regret rates, so the atlas status is not comparable.
