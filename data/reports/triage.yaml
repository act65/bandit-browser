      lower) for adversarial bandit linear optimization over the permutahedron. In this setting the learner plays
      permutahedron vertices (permutations of {1,…,n}, d = n). Ailon–Hatano–Takimoto (ALT 2014) give O(n^{3/2}√T)
      for losses in the dual polytope (efficient, O(n³) per step) and O(n√T) for losses in the hypercube, but only
