  S-a8b8c64b|regret|worst_case:
    verdict: closed
    summary: 'For fixed, undirected, strongly observable feedback graphs, two published results together give a
      worst-case regret of Θ(√(αT(1+ln(K/α)))) for each pair (K, α). This closes the gap between the database''s
      bounds (upper √(KT) and √(T log T); lower √(αT)). Two things are left open: directed graphs, and a proof written
      out specifically for Gaussian noise.


      **Upper bound.** Eldowa, Esposito, Cesari and Cesa-Bianchi (NeurIPS 2023, arXiv:2305.15383) prove O(√(αT(1+ln(K/α)))).
      They use FTRL with q-Tsallis entropy and tune q to α. The bound holds against an adaptive adversary, so it
      also holds for stochastic i.i.d. losses. It is proved for undirected graphs, with or without self-loops, including
      time-varying sequences. Their own lower bound, Ω(√(αT ln K / ln α)), uses a graph drawn at random each round,
      so it does not cover the fixed-graph case on its own.


      **Matching lower bound.** Chen, He and Zhang (ICML 2024, arXiv:2307.07264) prove Θ(√(T Σ_k log(m_k+1))) for
      "m-MAB". This is a fixed feedback graph made of disjoint cliques of sizes m_k, which is undirected and strongly
      observable. The lower bound uses stochastic Bernoulli arms and a reduction to best-arm identification. Take
      α cliques, each of size K/α. The bound becomes Ω(√(αT log(K/α+1))), which matches the Eldowa et al. upper
      bound. Eldowa et al. state this themselves: Chen et al.''s fixed disjoint-clique lower bound "would imply"
      their algorithm is worst-case optimal up to constants for every pair (K, α).


      **Consequences for the database:**

      - The lower bound √(αT) is loose by a factor of √(log(K/α)) when α < K.

      - The upper bound √(KT) is loose when α ≪ K.

      - When α = K, both results reduce to the standard bandit rate Θ(√(KT)).


      **Caveats:**

      1. Both results are for bounded or Bernoulli losses. The Gaussian, known-σ version follows by the usual arguments,
      but I did not see it stated explicitly.

      2. For directed strongly observable graphs, Eldowa et al. say extending the result is "considerably harder"
      and leave it open. The best directed bound they cite is O(√(αT(ln K)³)). So if this database entry covers
      directed graphs, the log gap there is still open.'
    papers:
