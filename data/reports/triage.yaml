  S-7e9d4915|regret|worst_case:
    verdict: closed
    summary: 'For a fixed finite action set with K arms (K arbitrary, not tracked), the minimax regret is known
      to be Θ̃(√(dT·min{d, log K})). The upper bound O(√(dT log K)) comes from phased elimination with G-optimal
      design (Lattimore–Szepesvári book; Lattimore et al. 2020) and from SupLinRel/SupLinUCB (Auer 2002; Chu et
      al. 2011; Li et al. 2019). The lower bound Ω̃(√(dT·min{d, log K})) uses the 2^d hypercube corners scaled into
      the unit ball; Lau et al. (2026) call it well-known and cite Zhou (2019) and Tajdini et al. (2025). With K
      = 2^d this gives Ω(d√T), matching the d-dependence of the Dani et al. upper bound (≈ d√T·polylog T). Since
      K is unrestricted here, the worst case is Θ̃(d√T) and the polynomial gap in d is closed; only log-T factors
      remain. Li, Wang and Zhou (COLT 2019) also settle the log factors (Ω(√(dT·log T·log n)) for n ≤ 2^{d/2}, matched
      up to iterated logs), but I believe their result is for action sets that can change each round and did not
      check whether it covers a fixed action set. The database''s Ω(√(dT)) lower bounds are only tight in the small-K
      regime. Caveat: I could not read the book PDF or Zhou''s lecture-note PDF (both came back as binary), so the
      hypercube lower bound rests on secondary citations from search snippets and the fetched Lau et al. page.'
