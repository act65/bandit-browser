    verdict: closed
    summary: 'The polynomial gap in d is already closed by known results. The database''s best lower bound, sqrt(dT),
      is a multi-armed bandit (MAB) style bound, and it is too weak once the size of the finite action set K is
      left unrestricted, which is the case here because K is not a tracked parameter.


      **Lower bound:** Theorem 24.1 in Lattimore & Szepesvári (2020) gives an Ω(d√T) lower bound on the hypercube
      under Gaussian noise. I saw this result cited in secondary sources but could not open the book itself: its
      PDF did not parse. Shamir (2014, arXiv:1408.2368) also states an Ω(d√T) hypercube bound, matching the O(d√T)
      of an algorithm that only plays the cube''s corners. That algorithm can be restricted to the 2^d vertices,
      which is a finite set. With the rescaling a ∈ {±1}^d/√d and θ_i = ±√d·c/√T (so ‖θ‖ ≤ 1 once T ≥ d²), the bound
      becomes Ω(d√T) in this exact setting: a finite, fixed action set with ‖a‖ ≤ 1, ‖θ‖ ≤ 1 and bounded means.
      A recent dynamic-regret paper (arXiv:2607.02891) uses exactly this construction, the finite set {v/√r : v
      ∈ {±1}^r}, and cites the standard Ω(r√H) bound for it.


      **Upper bound:** Dani et al. (2008) and OFUL give O(d√T·polylog T). Phased elimination with a G-optimal design
      (Lattimore–Szepesvári Theorem 22.1, seen only as a secondary citation) gives O(√(dT log(KT))), which is O(d√T
      + √(dT log T)) when K = 2^d.


      So in the worst case over K, the minimax rate is Θ(d√T) up to log T factors. The d-exponent gap (upper 1 vs
      lower 0.5) is resolved at 1. What remains open is the polylog(T) factor in the regime where K is unrestricted.


      For the version with explicit K and time-varying (contextual) finite action sets, Li, Wang & Zhou (COLT 2019)
      give a lower bound of Ω(√(dT·log T·log n)) for n ≤ 2^{d/2}. A Variable-Confidence-Level SupLinUCB matches
      it up to iterated-log factors, so that setting is also essentially closed.


      **Caveats:**

      - I could not open the Lattimore–Szepesvári book PDF, so its theorem numbers come from secondary citations.

      - The hypercube rescaling argument is my own reasoning on top of the cited results, not a quoted statement.'
