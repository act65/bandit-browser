  S-b3b12332|regret|worst_case:
    verdict: closed
    summary: 'This setting comes from Dai, Xu, Qi and Jordan, "Incentive-Aware Recommender Systems in Two-Sided
      Markets" (arXiv:2211.15381). The log T gap in the database is caused by setting δ=1/T. It is not a real open
      problem.


      What the paper states (read from the arXiv HTML version):

      - **Upper bound (Theorem 5.2).** With η=√(8 ln m/T), the MARP policy satisfies R_T ≤ √((T/2) ln m) + √((T/2)
      ln(1/δ)) with probability at least 1−δ.

      - **Lower bound (Theorem 5.3).** The minimax regret satisfies lim_{m→∞} lim_{T→∞} R†_T / ((1−ε_T)√(T ln m/2))
      = 1.

      - **Optimality claim.** The authors say MARP is minimax optimal.


      Why the gap disappears:

      - **Fixed δ.** For any constant confidence level, the upper bound is Θ(√(T log m)), which matches the lower
      bound''s rate in both T and m. The leading constants also match asymptotically: √(T ln m/2) on both sides.

      - **Expected regret.** I did this calculation myself; the paper does not state it. The high-probability bound
      has a sub-Gaussian tail, so integrating it gives E[R_T] ≤ √((T/2) ln m) + √(πT/8). That is O(√(T log m)) with
      no log T factor, so it matches the lower bound in T. The extra term is order √T and does not grow with m,
      so the leading constant still matches as m→∞.

      - **Where the log T comes from.** Only plugging in δ=1/T adds a √(T log T) term, which is where the database''s
      log_gap comes from.


      Caveats:

      - The lower bound is asymptotic (m→∞ after T→∞), so the paper does not show the constants match for a fixed
      m.

      - The Hedge-type √(T log m) rate is unusual for bandit feedback, where the standard lower bound is √(KT).
      It must rely on the specific incentive/opportunity-cost structure of this model. I did not check that part
      of the paper; my fetch covered only the first ~100k of ~170k characters.

      - I found no other paper on this exact setting.


      Bottom line: for fixed δ, and for expected regret, the rates in T and K match, and the paper itself claims
      minimax optimality.'
