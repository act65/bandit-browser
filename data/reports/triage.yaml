  S-a8bd0c78|regret|instance_dependent:
    verdict: closed
    summary: 'For K-armed stochastic bandits with a fixed, known, strongly observable feedback graph, the literature
      already pins down the instance-dependent rate. It is c*(θ, G)·log T, where c* is the value of a linear program
      built from the graph and the instance (roughly, a minimum-cost exploration budget over the arms). Neither
      of your database''s bounds reflects this. The upper bounds come from plain bandit algorithms that ignore the
      graph (UCB1, KL-UCB). The lower bound is just Ω(log T). So the polynomial gaps you see in Δ and K are an artefact
      of the incomplete database, not an open problem.


      - **Lower bound.** Buccapatnam, Eryilmaz and Shroff proved an asymptotic Lai–Robbins-style lower bound that
      depends on the network structure. Their UCB-type and randomized policies match it up to a factor that does
      not depend on the network.

      - **Matching upper bounds.** Wu, György and Szepesvári (NeurIPS 2015) proved problem-dependent lower bounds
      that do not need T → ∞. Their algorithms match those bounds up to a universal constant. A slide deck (ICML
      2022) says their result is exactly asymptotically optimal in the {σ, ∞} case, which is the graph-feedback
      case. Marinov, Mohri and Zimmert (NeurIPS 2022) give an algorithm that is quasi-optimal both in finite time
      and asymptotically. They also show that no algorithm can reach the asymptotic constant c* in finite time on
      some instances.

      - **Still open (refinements, not the main gap).** Marinov et al. leave open which graphs allow the finite-time
      rate to match the asymptotic rate up to constants. They also leave open graphs that change over time and the
      case where the learner does not know the graph.


      Caveat: these results are stated for Gaussian or sub-Gaussian-type rewards. I did not check whether anyone
      has proved an exactly matching asymptotic constant for general [0,1] rewards (a KL- or Kinf-based constant).
      The order c*(G, Δ)·log T is settled up to constant factors.'
