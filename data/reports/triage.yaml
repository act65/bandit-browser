    verdict: closed
    summary: 'This gap is already closed by classical results. The minimax regret for the K-expert full-information
      problem with rewards in [0,1] is Θ(√(T log K)), and asymptotically it is exactly √((T/2) ln K).


      **Upper bound.** Hedge (exponential weights) with learning rate η = √(8 ln K / T) gets regret at most √((T/2)
      ln K). This is the classical analysis by Freund–Schapire and Cesa-Bianchi et al. I did not fetch those original
      papers this session. Arxiv:2410.05124 states the order-√(T ln K) bound, and Gravin–Peres–Sivan (arXiv:1607.02834)
      state the exact constant.


      **Lower bound.** Cesa-Bianchi & Lugosi (2006), Theorem 7.4, uses i.i.d. Bernoulli(1/2) losses. As T and K
      go to infinity, any algorithm''s regret is at least about √((T/2) ln K). I saw this through a summary in arXiv:2509.21547,
      not in the book itself. Arxiv:1910.13521 restates it, up to a constant, as min{√(2T log K), 2T}/L for a universal
      constant L.


      **Why the database shows a gap.** Its upper bounds come from bandit algorithms (Tsallis-INF, √(KT)), which
      have a polynomial dependence on K. Its lower bound already has the √(T log K) form. Plugging in Hedge''s √((T/2)
      ln K) upper bound removes the polynomial gap in both K and T. So the worst-case status should be "tight" at
      Θ(√(T log K)).


      **The Δ entry.** The Δ-dependent lower bound (Ito 2021) is about the stochastically constrained / best-of-both-worlds
      regime, not the worst case. For that regime, the full-information literature also gives O(log K / Δ)-type
      upper bounds, for example decreasing-rate Hedge (Mourtada & Gaillard 2019). This session did not search for
      or verify that claim, so it is not in the paper list.


      **Caveat on the exact constant.** The 1/2 constant is matched only asymptotically. I found no source with
      a non-asymptotic proof of the exact constant for every K and T.'
