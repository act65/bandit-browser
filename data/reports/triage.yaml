  S-aeb8f3fe|regret|worst_case:
    verdict: closed
    summary: 'This gap is already closed by classical results. For the two-armed subgaussian bandit where the learner
      knows σ, the worst-case regret is Θ(σ√T).


      **Lower bound.** Lattimore & Szepesvári, *Bandit Algorithms*, Chapter 15 (Theorem 15.1 and Exercise 15.2)
      show that for unit-variance Gaussian bandits with means in [0,1], every policy suffers regret at least (1/27)·√((K−1)T)
      on some instance. With K=2 that is Ω(√T). Gaussian noise with variance σ² is σ-subgaussian, so rescaling gives
      Ω(σ√T) here, and this holds even when σ is known. I did not open the book itself: the statement and the 1/27
      constant come from surveys that restate it (arXiv 2412.02251 Theorem 6, and arXiv 2608.17841).


      **Upper bound.** MOSS (Audibert & Bubeck, COLT 2009) gets regret O(√(KT)) with no log factor. Rescaling its
      confidence width by the known σ gives O(σ√T) for K=2. The database entry from bian2022maillard Corollary 5,
      √(2T·log 2)·σ, is already of this order.


      **Why the database shows a gap.** Its only lower bound is the weaker √T/log T from Pacchiano et al. 2020,
      a model-selection paper. The standard Ω(√T) minimax lower bound is missing. Adding it gives matching orders,
      Θ(σ√T), and only constant factors differ.'
