      year: 2014
      arxiv_id: '1312.1530'
      claim: 'With losses satisfying |π·s_t| ≤ 1: BanditRank has regret O(n^{3/2}√T) at O(n³) time per step, and
        the paper reports that CombBand (Cesa-Bianchi et al., 2009) achieves O(n√(T log n)) using permanent approximations.
        Under ‖s_t‖₁ ≤ 1, OSMDRank has regret O(n√T). The open question posed is about efficiency (O(n√T) regret
