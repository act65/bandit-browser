      the arXiv abstract page.


      **Why this closes the gap**

      - The new bound''s dependence is linear in K, linear in 1/Δ, and a single log T. That matches the lower bound
      in your database, liminf Σ_i (1/Δ_i)·log T/2 (Zimmert–Seldin, Appendix A). So the per-variable gaps (K: exponent
      2 vs 1; T: log² vs log) disappear.

      - By AM–GM, the √(C·Σ log T/Δ_i) term is at most C + Σ log T/Δ_i. An Ω(C) lower bound for corruption is standard.
      I only saw it stated second-hand (Hu & Chen 2025, arXiv 2502.07514, quoting it for comparison with Gupta et
      al.), not in the original paper.


      **What remains open**

      A finer gap is left, and only in the C-interaction term. Ito (NeurIPS 2021, arXiv 2109.10963) shows the √C
      rate is exactly tight for the experts problem. For bandits, his lower bound is Ω(K/Δ + √(CK/Δ)), with no log
      T. That leaves a gap of about a √(log T) factor in the corruption term against the O(K log T/Δ + √(CK log
      T/Δ)) upper bound. This is from a search snippet quoting the paper''s Table 1 / Theorem 6; I couldn''t read
      Theorem 6 itself because the PDF wouldn''t extract.


      For the per-variable rates you''re tracking (Δ, K, T), the leading term is resolved up to constants.'
