  S-21ce1603|regret|worst_case:
    verdict: open_known
    summary: 'Not closed for a fixed, arbitrary compact action set, but the gap is narrower than the database shows.
      Upper bound: Zimmert & Lattimore (COLT 2022) prove O(d√(T log T)) for adversarial linear bandits on general
      action sets. That beats the database''s Dani et al. bound, which grows like d·√T·log^1.5 T. It should carry
      over to the stochastic setting with bounded rewards; with sub-Gaussian noise it needs a truncation step that
      I did not check. Lower bound: Ω(d√T) is still the best for a fixed set. Li, Wang & Zhou state Ω(d√(T log T))
      for infinite action sets with a matching upper bound up to log log T. The arXiv abstract covers only finite
      sets; the infinite-set claim comes from a seminar page, which calls it a corollary of the finite-set bound
      with n ≤ 2^(d/2) candidate actions per round. Their setting is contextual, and my assumption (not confirmed)
      is that the construction needs the action set to change each round, so it would not apply here. For ellipsoids,
      including the unit ball, Zhang, Hadiji & Combes (2025) show Θ(dσ√T) up to a universal constant, so no log
      factor is needed there. The remaining question is whether a √(log T) factor is needed in the worst case over
      fixed compact sets. Banerjee & Gopalan (2023) cite Lattimore & Szepesvári as calling the characterisation
      of minimax regret across action spaces an open problem. I found no source naming this specific log factor
      as open and did not check the book itself, so ''open_known'' is somewhat hedged.'
