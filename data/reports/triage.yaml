    verdict: closed
    summary: 'The setting doesn''t name a function class (function_class is empty and the reward model is marked
      "misspecified"), so this verdict depends on how I read it. The two upper bounds in the database come from
      linear contextual bandit results applied with dimension d = K: SupLinUCB (Chu et al. 2011) and jin2026nearly.
      The jin2026 paper I found is probably "Nearly Minimax-Optimal Regret for Linear Contextual Bandits with Arbitrary
      Adaptive Action Sets" (arXiv 2609.15170). I only saw its abstract in a search summary and did not confirm
      its author list or Corollary 18. Under the d = K reading, the gap is closed up to iterated-log factors by
      Li, Wang & Zhou (COLT 2019, arXiv 1904.00242). The search result summarising their abstract says:

      - Lower bound: any algorithm suffers Ω(√(dT log T log n)) regret when there are n ≤ 2^{d/2} actions per round.

      - Upper bound: their Variable-Confidence-Level SupLinUCB matches that lower bound up to iterated-log factors.
      This removes two √log T factors from the SupLinUCB analysis, which is exactly the source of the log^{3/2}
      T term in the database''s upper bound.


      With d = n = K (so the condition K ≤ 2^{K/2} holds for K ≥ 2), the minimax rate is about √(KT log T log K),
      up to log log factors. Two consequences: the database''s √(KT) lower bound is loose by a √(log T log K) factor,
      and the T-exponent gap (log^{0.75}) is closed except for iterated logs. The K exponent is 1/2 on both sides,
      which matches.


      Caveat: this only holds if the intended setting is K-armed linear contextual bandits with dimension about
      K. Under an unspecified general or misspecified function class, the right rate would depend on the class.
      For example, a finite class of size N gives √(KT log N) via Exp4-type algorithms, which I did not check against
      a source in this session, and the answer could change.'
