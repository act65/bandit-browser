      Shinji Ito, "On Optimal Robustness to Adversarial Corruption in Online Decision Problems" (NeurIPS 2021, arXiv
      2109.10963), has a matching upper bound for the expert problem. Its Theorem 3 covers Hedge with the decreasing
      learning rate η_t = sqrt(8 log N / t). In the adversarial regime with a self-bounding constraint, it shows
      pseudo-regret ≤ 33 + 100 log N/Δ + 10 sqrt(C log N/Δ). Hedge also has the standard worst-case bound sqrt(2T
      log N) + log N/8. The paper combines the two into O(min{log N/Δ + sqrt(C log N/Δ), sqrt(T log N)}). Here N
      is the number of experts, i.e. K.


      The paper''s Theorem 5 lower bound has exactly the same form, and the paper says it is tight up to a constant
      factor. So the order is known in every variable:

      - K: log K, not sqrt(K).

      - T: sqrt(T log K) in the worst case.

      - Δ and C: log K/Δ + sqrt(C log K/Δ).


      The database''s upper-bound entries should be replaced by Ito''s Theorem 3 plus the standard Hedge bound.
      Note that the worst-case sqrt(T log N) term is not stated in Theorem 3 itself. It comes from combining Theorem
      3 with Theorem 1 (the standard Hedge bound); I read this in the ar5iv full text. Also relevant is earlier
      work by Amir et al. (2020), which showed decreasing Hedge has a linear dependence on C; I saw this only in
