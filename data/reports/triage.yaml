  S-1f3f8126|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed, up to constant factors, by a known adversarial semi-bandit result. The worst-case
      minimax regret is Θ(√(dmT)), where d is the number of base arms (ground items) and m is the maximum action
      size.


      **Upper bound.** "Regret in Online Combinatorial Optimization" (Audibert, Bubeck, Lugosi, Math. of OR 2014,
      arXiv 1204.4710), Theorem 4, gives R_n ≤ 2√(2mdn). This uses OSMD/INF with the potential ψ(x) = (−x)^(−2)
      against an adversary choosing losses z_t ∈ [0,1]^d. The paper does not discuss stochastic losses. Still, i.i.d.
      losses are a special case of an oblivious adversary, and since that adversary can be any i.i.d. distribution,
      the bound covers our stochastic setting. The paper describes this bound as optimal for semi-bandits, and its
      Table 1 lists a matching √(mdn) lower bound.


      **Lower bound.** The stochastic lower bound Ω(√(dmT)) comes from Kveton et al. 2015 (arXiv 1410.0949), the
      result already in your database.


      **Why the database shows a d-gap.** The database''s upper bound d√T only matches √(dmT) when m = d. Using
      2√(2mdT) instead makes the d-exponent 1/2 in both bounds when m is held fixed, which closes the gap.


      **Other upper bound.** In the stochastic-specific literature, CombUCB1 (Kveton et al. 2015) gets O(√(dmT log
      T)), which matches up to a √log T factor.'
    papers:
    - title: Regret in Online Combinatorial Optimization
      year: 2014
      arxiv_id: '1204.4710'
      claim: 'Theorem 4: OSMD/INF with potential (-x)^(-2) gives semi-bandit regret R_n <= 2*sqrt(2mdn) for losses
        in [0,1]^d against any adversary (so also i.i.d. stochastic). Called optimal, matching the sqrt(mdn) lower
        bound in Table 1.'
    - title: Tight Regret Bounds for Stochastic Combinatorial Semi-Bandits
      year: 2015
      arxiv_id: '1410.0949'
      claim: CombUCB1 has gap-free regret O(sqrt(KLn log n)). The paper proves a lower bound of Omega(sqrt(KLn))
        for stochastic combinatorial semi-bandits (L = number of ground items, K = maximum action size).
