  S-b4959e4a|regret|worst_case:
    verdict: closed
    summary: 'I''m treating this as closed, but only up to iterated-log factors and only under one reading of the
      setting. The database entry is internally inconsistent. Its upper bounds come from linear contextual bandit
      papers (SupLinUCB; Jin 2026). These seem to have been instantiated with the dimension d set equal to K. The
      Jin-derived formula then scales as K^{3/4}·√T, not the K^{1/2} listed in per_var.


      **If the setting is the standard finite-arm linear contextual bandit with arbitrary (oblivious) adversarial
      contexts:** Li, Wang and Zhou (COLT 2019, arXiv 1904.00242) settle the T-dependence. They prove a lower bound
      of Ω(√(dT·log T·log n)) for n ≤ 2^{d/2} actions, needing T ≥ d(log n)^{1+ε}. They also give an algorithm,
      Variable-Confidence-Level SupLinUCB, whose regret matches this up to iterated-log factors. This lower bound
      is a √log T factor stronger than the database''s √(KT). The upper bound is also better than SupLinUCB''s log^{3/2}
      factor. With d = n = K the minimax rate is Θ̃(√(KT·log K·log T)), up to loglog factors. So the T log-gap is
      closed up to iterated logs: the true rate has an extra √log T over the database''s lower bound. One caveat:
      I only saw the abstract-level claim that the upper bound matches up to iterated-log factors, not the exact
      theorem. I also did not confirm the paper''s exact assumption on how contexts are chosen.


      **If action sets may adapt to the unknown parameter and history (Jin 2026, arXiv 2609.15170):** the K- and
      d-dependence changes. For K ≥ d the minimax rate is Θ̃(√(dT)·min{√d, (d log K)^{1/4}}). For 2 ≤ K ≤ d it is
      Θ̃(K^{1/4}√(dT)), with the lower bound needing T ≥ d². Here the bounds match only up to unspecified log factors,
      so the exact log-T power for this variant is not pinned down.


      **If the rewards don''t depend on the context at all (just an i.i.d. K-armed bandit):** the problem reduces
      to a standard multi-armed bandit, where the minimax rate is the √(KT) order. I did not check a source for
      this reading.


      The database should fix the d = K substitution and the K exponent in per_var.'
