  S-9bb2af03|regret|worst_case:
    verdict: closed
    summary: 'The database''s upper bound is the wrong theorem for this setting, and the right one closes the T
      and d gap up to log factors (treating C as a constant). The C-dependence is still open.


      **Why the database bound is wrong here.** The listed upper bound, Õ(d^{1/2}(C+1)T^{3/4} + d^{3/2}CT^{1/4}),
      comes from Remark 1 of Ding, Hsieh & Sharpnack (AISTATS 2022, arXiv 2106.02978). That remark covers their
      two-layer algorithm for the case where the attack budget C is unknown. Our setting says the learner knows
      C. For that case, Theorem 1 of the same paper (I read it in the arXiv HTML v3) gives, with high probability,
      R_c(T) ≤ (2β_T + γ_T(C+C′))γ_{T+1}√T + C for context attacks, where C′ ≥ C is the known upper bound. The paper
      summarises this as R(T) ≤ Õ(d√T) + Õ(d(C+C′)√T). Taking C′ = C, the regret is Õ(d(C+1)√T).


      **Effect on the gap.**

      - **T:** the exponent drops from 0.75 to 0.5. This matches the lower bound d√(T log T) from Li et al. 2019
      up to logs.

      - **d:** the exponent is 1, which matches the d lower bound. The database recorded upper 0.5 against lower
      1, which is not a consistent pair. With the right theorem the d-dependence is linear and tight up to logs.

      - **K:** the upper bound has no K-dependence, so the K^{1/4}√(dT) lower bound (jin2026) presumably comes with
      a condition such as K ≤ exp(d). I could not check that paper''s conditions; it looks like a parametrisation
      issue rather than a real gap.


      **What is still open: the dependence on C.** The upper bound grows like dC√T (multiplicative in C). The paper
      proves no lower bound in C. Its Future Work section explicitly lists as open "the optimal balance between
      C and T in regret lower bounds" for attacked linear contextual bandits, and an algorithm that matches it.
      The only lower-bound statement it cites is from Garcelon et al. 2020: an algorithm whose regret without corruption
      is f(T) must suffer linear regret once C = Ω(f(T)).


      **Other work checked.** None of the work I found addresses context corruption, and none improves the C-dependence
      for it:

      - Reward-corruption results: He et al. 2022, CW-OFUL, Õ(d√T + dC); Bogunovic et al. 2021; Liu et al. 2024
      (arXiv 2410.07533).

      - Strategic Linear Contextual Bandits (arXiv 2406.00551) only reports earlier context-corruption bounds of
      the form Õ(d·C̃·√T).

      - A 2026 fairness paper (arXiv 2602.04125) proves a lower bound for a different corrupted-observation model.


      **Verdict.** "Closed" applies to the per-variable T and d rates the database tracks, up to logs. If C is treated
      as a scaling variable, the C-dependence (C√T upper vs. no matching lower bound) is a known open question.'
    papers:
    - title: Robust Stochastic Linear Contextual Bandits Under Adversarial Attacks (Qin Ding, Cho-Jui Hsieh, James
        Sharpnack), AISTATS 2022
      year: 2022
      arxiv_id: '2106.02978'
      claim: For context attacks with a known budget C, Theorem 1 gives R_c(T) <= (2β_T + γ_T(C+C'))γ_{T+1}√T +
        C, which is Õ(d√T) + Õ(d(C+C')√T); for constant C this matches d√T up to logs. Remark 1 (the T^{3/4} bound)
        is only for unknown C. Future Work lists the optimal C-versus-T lower bound and a matching algorithm as
