  S-00c2dc7b|regret|worst_case:
    verdict: closed
    summary: 'The gap appears to be closed at Θ(√(KT)), with no logarithmic factors.


      **Upper bound.** Saha & Gaillard (ICML 2022, arXiv:2202.06694) present Versatile-DB, a reduction from dueling
      bandits to multi-armed bandits that runs Tsallis-INF-style online mirror descent. Two sources state its adversarial
      guarantee as 4√(KT)+1 pseudo-regret against any sequence of preference matrices, the benchmark being the Condorcet
      winner. Those sources are a search-result summary of the paper and the 2026 follow-up arXiv:2603.18972, which
      restates the bound. I could not read the theorem myself because the PDFs were unreadable compressed text,
      so the constant and exact conditions should be checked against Theorem 3.


      **Why it applies to this setting.** In the stochastic utility-based model the preference matrix is fixed over
      time, so it is a special case of "any sequence". The utility-best arm is the Condorcet winner. Under the linear
      link P(i≻j) = (1+u_i−u_j)/2, the dueling regret Saha & Gaillard use coincides, up to a constant, with Ailon
      et al.''s utility regret. In a stochastic environment, pseudo-regret equals expected regret. Together these
      give O(√(KT)), which removes the log^{1.5} T factor in the Corollary 3.2 bound from Ailon et al. (2014).


      **Lower bound.** Gajane et al. (2015, Theorem 2) give Ω(√(KT)), so the bound is tight in both K and T.


      **Caveats.** If the utility_link class allows non-linear links, the equivalence between the two regret notions
      holds only up to link-dependent constants. Separately, the same rate may follow from "Sparring" (Ailon et
      al.''s scheme of pitting two copies of a bandit algorithm against each other) using a minimax-optimal adversarial
      MAB algorithm such as Tsallis-INF instead of EXP3. I did not find a source that states this, so it is only
      a likely route.'
    papers:
    - title: 'Versatile Dueling Bandits: Best-of-both World Analyses for Learning from Relative Preferences (Saha,
        Gaillard)'
      year: 2022
      arxiv_id: '2202.06694'
      claim: 'Theorem 3 as reported in sources (exact statement not read): Versatile-DB (MAB reduction with Tsallis-INF-type
        OMD) gets pseudo-regret ≤ 4√(KT)+1 against any sequence of preference matrices (Condorcet benchmark), and
        also gap-dependent O(Σ log T/Δ_i) in stochastic Condorcet instances. For a fixed utility-based preference
        matrix this gives O(√(KT)), matching the Ω(√(KT)) lower bound.'
    - title: 'Best-of-Both-Worlds Multi-Dueling Bandits: Unified Algorithms for Stochastic and Adversarial Preferences
