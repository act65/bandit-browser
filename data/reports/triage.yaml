  S-92b27f3b|regret|worst_case:
    verdict: closed
    summary: 'Li, Wang and Zhou (COLT 2019, arXiv 1904.00242) close the log gap up to poly(log log) factors. I read
      their setting on the ar5iv page. It is a finite-action linear contextual bandit with at most n=K actions per
      round. An oblivious adversary fixes θ and all the action sets in advance, with ‖θ‖₂ ≤ 1 and ‖x‖₂ ≤ 1. This
      matches the queried setting.


      - **Upper bound (Theorem 1):** VCL-SupLinUCB gets regret O(√(dT log T log n)) · poly(log log(nT)). The noise
      only needs to be 1-sub-Gaussian, so the bound covers rewards in [0,1]. It removes two √log T factors from
      the SupLinUCB bound of Chu et al. 2011, and in T it beats the database upper bound of order √T·log^0.75 T.

      - **Lower bound (Theorem 2):** Regret is Ω(√(dT log n · log(T/d))) whenever n ≤ 2^{d/2} and T ≥ d(log₂ n)^{1+ε}.
      So in T, d and log n the bounds match up to iterated-log factors.


      **Caveat:** the lower bound is built with unit-variance Gaussian noise, not rewards bounded in [0,1]. Moving
      it to bounded rewards, for example Bernoulli rewards with means near 1/2, is the usual adaptation, but I did
      not see it stated in the paper. Under a strict reading of the bounded-noise setting, the √log T lower-bound
      factor is therefore not explicitly proved. The bounds also hold only up to poly(log log) factors.


      **Related recent work:** Jin (2026, arXiv 2609.15170), "Nearly Minimax-Optimal Regret for Linear Contextual
      Bandits with Arbitrary Adaptive Action Sets", is the source of the database''s K^{1/4} bound. It covers adaptive
      menus and pins down how regret depends on K. When K ≤ d and T ≥ d², it gives matching Θ̃(K^{1/4}√(dT)) bounds.'
    papers:
    - title: Nearly Minimax-Optimal Regret for Linearly Parameterized Bandits (Li, Wang, Zhou)
      year: 2019
      arxiv_id: '1904.00242'
      claim: 'Oblivious adversarial finite action sets of size n, ||x||,||θ||≤1, sub-Gaussian noise. Upper bound:
        regret O(√(dT log T log n))·poly(log log(nT)) via VCL-SupLinUCB. Lower bound (Gaussian noise): Ω(√(dT log
        n log(T/d))) for n ≤ 2^{d/2}, T ≥ d(log n)^{1+ε}. Together these close the gap up to iterated logs.'
    - title: Nearly Minimax-Optimal Regret for Linear Contextual Bandits with Arbitrary Adaptive Action Sets (Tianyuan
        Jin)
      year: 2026
      arxiv_id: '2609.15170'
      claim: 'For adaptive menus: Õ(K^{1/4}√(dT)) when K ≤ d, which matches the lower bound Ω(K^{1/4}√(dT)) when
        T ≥ d². For K ≥ d: Õ(√(dT)·min{√d,(d log K)^{1/4}}) with a nearly matching lower bound.'
