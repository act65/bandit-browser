  S-700023b9|regret|worst_case:
    verdict: closed
    summary: 'I count the √(log K) gap as closed, by a direct consequence of a published result rather than a theorem
      stated for this setting. The database''s upper bound √(2 K M T log K) comes from running EXP3 separately in
      each context. Audibert & Bubeck (COLT 2009 / JMLR 2010) give INF, which removes the log K factor and gets
      O(√(nK)) minimax regret in the adversarial K-armed bandit. Tsallis-INF (Zimmert & Seldin, JMLR 2021) also
      matches the minimax bound within constants. Running INF or Tsallis-INF per context and applying Cauchy–Schwarz
      (∑_c √T_c ≤ √(M T)) gives O(√(K M T)), which matches the Ω(√(KT)) lower bound in K and T. A standard block
      construction would also give Ω(√(K M T)) in M, but that is my own derivation: I didn''t find it stated in
      a paper or in the sources I read. Caveats: INF''s guarantee is for pseudo-regret / expected regret against
      an oblivious adversary, so check that this matches the database''s regret notion. I took the Audibert–Bubeck
      claim from search-result summaries and did not fetch the full text, so the theorem number and constant are
      unchecked. I also didn''t look for an explicit statement of the contextual √(KMT) bound, for example in Lattimore–Szepesvári''s
      contextual-bandits chapter.'
    papers:
    - title: Minimax Policies for Adversarial and Stochastic Bandits
      year: 2009
      arxiv_id: null
      claim: Audibert & Bubeck (COLT 2009; JMLR 2010 version 'Regret Bounds and Minimax Policies under Partial Monitoring').
        INF (Implicitly Normalized Forecaster) gets O(√(nK)) regret in adversarial K-armed bandits, removing EXP3's
        log K factor. Applied per context, this gives O(√(K M T)) for finitely many adversarial contexts.
    - title: 'Tsallis-INF: An Optimal Algorithm for Stochastic and Adversarial Bandits'
      year: 2021
      arxiv_id: '1807.07623'
      claim: Zimmert & Seldin. Online mirror descent with 1/2-Tsallis entropy gets pseudo-regret in the adversarial
        regime that is optimal within constants (order √(KT), no log K). Running it per context gives O(√(K M T)).
    searches:
    - Audibert Bubeck Minimax policies for adversarial and stochastic bandits sqrt(nK) INF
    - Tsallis-INF optimal algorithm stochastic and adversarial bandits Zimmert Seldin arXiv
