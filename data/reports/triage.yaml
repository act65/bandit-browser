  S-87d5d366|regret|worst_case:
    verdict: closed
    summary: 'Up to log factors, the gap is already closed. It shows up only because the database''s upper bounds
      are stated in terms of K (Tsallis-INF / Masoudian et al., which are plain bandit bounds), while its lower
      bounds are stated in terms of the independence number α. For strongly observable feedback graphs, published
      upper bounds scale as √(αT) up to logs. Alon, Cesa-Bianchi, Dekel & Koren (2015, which the database already
      cites for its lower bound) and Alon et al.''s SIAM J. Comput. 2017 paper give Õ(√(αT)), and per my recollection
      also Õ(√(Σ_t α_t)) for time-varying graphs; I did not check this against the text this session. Eldowa, Esposito,
      Cesari & Cesa-Bianchi (NeurIPS 2023) give O(√(αT(1+ln(K/α)))). The search snippet says their result extends
      to time-varying graphs without knowing the independence numbers in advance, which covers this database key
      (oblivious sequence of graphs, known in advance). The same paper proves a lower bound of Ω(√(αT ln K / ln
      α)) for every α > 1. This matches the upper bound for the T-dependence and for α-polynomial dependence, so
      in that sense the minimax rate is Θ̃(√(αT)). Only a sub-logarithmic factor of order ln(K/α) versus ln K/ln
      α in general remains. So in terms of α, the polynomial gap the database reports for K is not real: the regret
      depends polynomially on α rather than K, and K enters only through a log factor. I saw the claims from Eldowa
      et al. in a search-result abstract summary. I did not open the full theorem statements.'
