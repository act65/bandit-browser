  S-fb1b31ee|sample_complexity|worst_case:
    verdict: open_known
    summary: 'The gap is not closed, and it is known to be open. The authors of the source paper say so themselves.
      Under strong stochastic transitivity (SST) plus the stochastic triangle inequality (STI), PAC ranking was
      studied in Falahatgar, Orlitsky, Pichapati and Suresh, "Maximum Selection and Ranking under Noisy Comparisons"
      (ICML 2017, arXiv:1705.05366). The upper bound in our database, O(K log^3 K log(K/δ)/ε²), is the Merge-Rank
      result (Lemma 4 on the ar5iv version). The same paper has a sharper result. It uses a noisy binary-search
      framework (Theorem 12 and Corollary 13) to get O(K log K (log log K)^3/ε²) comparisons, but only for δ = 1/K,
      i.e. constant-to-polynomial confidence. Its lower bound is Ω(K log(K/δ)/ε²) (Theorem 15 on ar5iv; there is
      no "Theorem 16"). At δ = 1/K that lower bound is Ω(K log K/ε²). So the true gap at δ = 1/K is only (log log
      K)^3, not log^3 K, and our database should record this tighter upper bound. In their conclusion the authors
      explicitly call closing the (log log n)^3 gap an open question. For arbitrary δ, the paper''s best stated
      bound is still the log^3 K log(K/δ) one. Searches for later work that removes the (log log K)^3 factor under
      SST+STI found nothing. Related work exists but is in other settings: Ren–Liu–Shroff (arXiv:1806.02970) gives
      tight PAC total-ranking bounds, but under the MNL/Plackett-Luce model; Ren et al. 2020 (arXiv:2007.03133)
      treats best-k selection, not full ranking. One caveat: the setting is tagged SST only, but these bounds need
      STI as well. Falahatgar et al., NeurIPS 2017 ("Maxing and Ranking with Few Assumptions"), show that under
      SST alone, PAC ranking needs quadratically many comparisons. If the tag really means SST without STI, the
      database''s upper bound would not apply.'
    papers:
    - title: Maximum Selection and Ranking under Noisy Comparisons
      year: 2017
      arxiv_id: '1705.05366'
      claim: 'Under SST+STI: Merge-Rank uses O(n log^3 n log(n/δ)/ε²) comparisons. Binary-Search-Ranking uses O(n
        log n (log log n)^3/ε²) comparisons for δ=1/n. Lower bound is Ω(n log(n/δ)/ε²). The conclusion explicitly
        says closing the (log log n)^3 gap is open.'
    - title: Maxing and Ranking with Few Assumptions
      year: 2017
      arxiv_id: null
      claim: Under SST alone (no STI), maxing needs linearly many comparisons but PAC ranking needs quadratically
        many. Under the Borda metric with no assumptions, ranking takes O(n log n) comparisons.
    - title: 'PAC Ranking from Pairwise and Listwise Queries: Lower Bounds and Upper Bounds'
      year: 2018
      arxiv_id: '1806.02970'
      claim: Tight lower and upper bounds for PAC total ranking, but under the MNL (Plackett-Luce for pairs) model,
        not general SST+STI.
