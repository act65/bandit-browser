  S-fe3c6e35|regret|worst_case:
    verdict: closed
    summary: '**Verdict: closed.** The gap your database flags comes mainly from a lower bound that is too weak.
      The published literature already gives a matching lower bound for this setting, and in the main case (ellipsoid
      action sets, including the unit ball) the log factor is also gone.


      **The d gap.** The √(dT) lower bounds in your database are the generic ones for finite-armed or simplex-type
      problems. Rusmevichientong & Tsitsiklis (2010), Theorem 2.1, prove a stronger bound for arms on the unit sphere
      with Gaussian noise. Under a N(0, I/d) prior on θ, any policy has Bayes risk at least 0.006·d·√T when T ≥
      d². So some fixed θ has regret Ω(d√T). The Lattimore–Szepesvári book also gives an Ω(d√T) bound for the unit
      ball, as reported in a search-result summary of arXiv 2502.17175; I did not read the book. The Dani et al.
      (2008) upper bound is about d√T·polylog(T), so the dependence on d is matched.


      **The log factor in T.** Zhang, Hadiji & Combes (2025, arXiv 2502.17175) handle ellipsoidal action sets {x
      : xᵀA⁻¹x ≤ 1}, which are strongly convex and include the unit ball. They prove a lower bound of Ω(min(dσ√T
      + d‖θ‖_A, ‖θ‖_A·T)). Their algorithm estimates ‖θ‖ and then explores and commits, and it matches this bound
      up to a universal constant. That gives minimax Θ(d√T) with no logarithms.


      Rusmevichientong & Tsitsiklis''s PEGE algorithm also achieves a log-free d√T on any strongly convex set, but
      its bound carries a factor (‖θ‖ + 1/‖θ‖). It is therefore not a uniform worst-case bound when θ may be near
      zero, as it is here.


      **Caveat.** I found no log-free uniform worst-case upper bound for arbitrary strongly convex sets beyond ellipsoids.
      For that wider class the confirmed rate is Ω(d√T) against O(d√T·polylog T). So the polynomial gap in d is
      closed outright, and the remaining log gap in T is closed for ellipsoids and balls. I am fairly confident
      in these claims; my searches were not exhaustive. Two papers I saw in results but did not read are Kerdreux
      et al. (arXiv 2103.05907) on uniformly convex sets and a Thompson-sampling result on the ball (arXiv 2410.16013).


      **Sources**

      - [Linearly Parameterized Bandits – arXiv 0812.3465](https://arxiv.org/abs/0812.3465) (ar5iv version used
      for theorem details)

      - [Linearly Parameterized Bandits – MIT PDF](https://www.mit.edu/~jnt/Papers/J129-10-linearBandit.pdf)

      - [Linearly Parameterized Bandits – INFORMS (Math. of OR)](https://pubsonline.informs.org/doi/10.1287/moor.1100.0446)

      - [Linear Bandits on Ellipsoids: Minimax Optimal Algorithms – arXiv 2502.17175](https://arxiv.org/abs/2502.17175)

      - [Linear Bandits on Uniformly Convex Sets – arXiv 2103.05907](https://arxiv.org/pdf/2103.05907)

      - [Information-Theoretic Minimax Regret Bounds for RL based on Duality – arXiv 2410.16013](https://arxiv.org/pdf/2410.16013)'
    papers:
    - title: Linearly Parameterized Bandits (Rusmevichientong, Tsitsiklis), Mathematics of Operations Research
      year: 2010
      arxiv_id: '0812.3465'
      claim: 'Theorem 2.1: with arms on the unit sphere, Gaussian noise and Z ~ N(0, I/r), every policy has Bayes
        risk ≥ 0.006·r·√T for T ≥ r², so some fixed z has regret Ω(d√T). Theorem 3.1: on SBAR(J) action sets (equivalent
