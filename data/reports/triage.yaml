  S-90576d74|regret|worst_case:
    verdict: closed
    summary: 'Up to log factors, the gap is closed by a paper missing from your database: He, Zhou, Zhang & Gu,
      "Nearly Optimal Algorithms for Linear Contextual Bandits with Adversarial Corruptions" (NeurIPS 2022, arXiv:2205.06811).
      Their CW-OFUL algorithm assumes the learner knows the corruption budget C (the sum of corruption magnitudes).
      In that case it gets regret Õ(d√T + dC). I saw this bound in search snippets of the NeurIPS proceedings paper,
      where it is written as Õ(d√K + dC) with K standing for the number of rounds. That paper says the d√T term
      matches the uncorrupted lower bound Ω(d√T), and the dC term matches the Ω(dC) corruption lower bound, which
      it credits to Bogunovic et al. 2021. A 2026 paper (arXiv:2603.15596) also cites He et al. as achieving Õ(d√T
      + dC).


      This bound is far better than the Õ(C·T^{1/4}d^{3/2} + T^{3/4}√d(C+1)) from Ding et al. in your database.
      Per variable:

      - T: the upper exponent drops from 0.75 to 0.5 plus log factors, which matches the d√(T log T) lower bound
      of Li, Wang & Zhou 2019 up to logs.

      - d: the upper exponent becomes 1, which matches that same d√(T log T) lower bound.

      - K: the upper bound has no K dependence. The K^{1/4}√(dT) lower bound from your database''s jin2026nearly
      entry must apply only in a limited range of K (presumably small K relative to d), or it would contradict the
      d√T upper bound. So it doesn''t open a real polynomial gap. I didn''t check this entry myself.


      Caveats:

      - I couldn''t read the full PDF of He et al. (the fetched text was unreadable). So I haven''t confirmed directly
      that their model allows time-varying decision sets chosen adaptively by an adversary and an adaptive reward-corrupting
      adversary. Arbitrary per-round decision sets are the standard linear contextual bandit model, which they appear
      to use. Their bound is stated for general (possibly infinite) decision sets, so it also covers finite ones.

      - A separate open question is noted in arXiv:2410.07533: the tight bound in terms of a weaker corruption measure
      C∞ when an adaptive adversary picks the action sets. That uses a different corruption measure from this setting''s
      budget C, so it doesn''t affect the verdict here.'
