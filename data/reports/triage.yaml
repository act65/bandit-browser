      in the paper, not verified here). The best expected-regret m-set lower bounds (Cohen-Hazan-Koren 2017; Ito
      et al. 2019, rescaled) give sqrt(kdT), about sqrt(log(d/k)) short of sqrt(dT log K). So the gap is closed
      at K=2^d and in high probability for m-sets. I found no explicit expected-regret lower bound sqrt(dT log K)
