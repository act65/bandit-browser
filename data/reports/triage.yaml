    summary: 'I count the √(log K) gap as closed, by a direct consequence of a published result rather than a theorem
      stated for this setting. The database''s upper bound √(2 K M T log K) comes from running EXP3 separately in
      each context. Audibert & Bubeck (COLT 2009 / JMLR 2010) give INF, which removes the log K factor and gets
