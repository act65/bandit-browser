  S-f51983ee|hp_regret|worst_case:
    verdict: blank
    summary: 'Short answer: I found no published result that closes the √log K gap for bounded-memory adversaries.
      The closest result settles it only for general adaptive adversaries.


      **The closest result.** Bacchiocchi, Cesari and Colomboni, arXiv:2608.12231 (Aug 2026). Their Theorem 2 (with
      m=1) gives a high-probability regret lower bound of Ω(√(KT(log K + log(1/δ)))). It holds for small enough
      δ and large enough T, against "deterministic adaptive non-anticipating" adversaries with losses in [0,1].
      The abstract says this shows the log K factor is unavoidable for K-armed bandits against such adversaries
      and "clos[es] the remaining √log K gap" left by Gerchinovitz and Lattimore. It matches the database''s upper
      bound, Exp3.P''s O(√(KT log(K/δ))), and EXP3-KW from Zimmert and Lattimore.


      **Why it doesn''t transfer to this setting.**

      - The paper body says the adversary''s round-t losses depend on how many times each arm was chosen earlier
      in the current block. The counts reset at block boundaries.

      - So the adversary remembers a whole block, not a fixed number of past rounds. That is not bounded memory
      unless the block length is constant, which I could not confirm.

      - The proof is only sketched in the parts I read.

      - The paper does not claim a matching log K lower bound for oblivious adversaries. For those, the best lower
      bound I saw is still Gerchinovitz and Lattimore''s √(KT log(1/δ)).

      - So for bounded-memory (and oblivious) adversaries the gap stays unresolved in what I found, but no source
      explicitly calls it an open problem. That is why the verdict is "blank" rather than "closed" or "open_known".


      **Other sources checked.**

      - Gerchinovitz and Lattimore (NeurIPS 2016, arXiv:1605.07416) say there is "little room for improvement" in
      high-probability bounds. Their stated open problem is about second-order bounds, not this log K gap.

      - Neu''s Exp3-IX (arXiv:1506.03271) gives 2√(2KT log K) + (√(2KT/log K)+1)·log(2/δ), which still has the log
      K.

      - Zimmert and Lattimore (COLT 2022) get O(√(dT log(kT))) for k actions, still with a log term.


      **Tool failures.** PDF fetches of the Zimmert–Lattimore and Gerchinovitz–Lattimore papers came back as unreadable
      binary. I read a plain-text copy of the latter instead.'
