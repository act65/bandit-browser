  S-ca7e2d63|regret|worst_case:
    verdict: closed
    summary: 'The gap is already closed in the literature: the minimax regret is Θ(d√T). The database''s lower bound
      of order √(dT) is too weak, and its upper bound of order d√(T log T) has an extra log factor that isn''t needed.


      Upper bound: Bubeck, Cesa-Bianchi and Kakade (COLT 2012, arXiv:1202.3079) study exactly this setting: the
      hypercube [-1,1]^d with losses in the L1 ball (cross-polytope), the polar of the hypercube. Their computationally
      efficient mirror-descent algorithm with the entropic regularizer has regret about 2d√(3n log 2) = O(d√n),
      with no log n factor. Here n is the horizon, i.e. T in your notation.


      Lower bound: the same paper says the d√n regret "is minimax optimal" and attributes the matching Ω(d√n) lower
      bound to Dani, Hayes and Kakade (2008). It also says there are action sets "(such as the hypercube) where
      the minimax rate is of order" d√n. The Dani–Hayes–Kakade NeurIPS 2007 paper establishes that bandit feedback
      costs at least a √d factor more than full information, whose regret is of order √(dT); that is the source
      of the Ω(d√T) lower bound.


      So for both T and d the order is Θ(d√T). I read the 2012 statements in the ar5iv HTML version of arXiv:1202.3079.
      For the 2007 paper I only saw the abstract and proceedings records; I did not check the exact theorem statement
      in its PDF.'
