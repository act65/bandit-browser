  S-df6e3798|regret|worst_case:
    verdict: blank
    summary: 'The setting is ambiguous as encoded. With finitely many stochastic contexts (M_ctx, distribution known),
      K arms, no function class and no structural extras, the minimax lower bound is Omega(sqrt(M_ctx K T)) when
      rewards depend arbitrarily on the context; that is the standard no-cross-learning bound restated by Balseiro
      et al. Then the stored lower bound sqrt(KT) is too weak and the stored upper bounds (which have no M_ctx term)
      don''t apply. The bounds only make sense under hidden structure. (a) Cross-learning, the most likely reading
      because known M_ctx and known context distribution is the Balseiro et al. 2019 setup. There the search summary
      gives O(sqrt(KT log K)) for UCB1.CL with stochastic rewards; the abstract claims only Õ(sqrt(KT)) for a known
      context distribution. Follow-ups (Schneider-Zimmert 2023, arXiv 2401.01857; Huang-Huang, arXiv 2410.04080)
      also prove only Õ(sqrt(KT)), for adversarial losses with an unknown context distribution. I found no log-free
      bound and no explicit statement that the gap is open. (b) Contexts don''t affect rewards (e.g. linear with
      fixed one-hot features, which is how SupLinUCB with d=K applies). Then MOSS (Audibert-Bubeck 2009) gets O(sqrt(KT)),
      matching Auer et al. 2002, and the gap is closed. One search summary credits MOSS to Lai (1987); most sources
      credit Audibert and Bubeck. Recommended fixes: add a cross-learning flag to ''extras'' if that is intended.
      The per-variable K exponent of 0.5 doesn''t match the stored jin2026nearly bound, which grows like K^{3/4}
      up to logs. I couldn''t find the jin2026nearly paper.'
