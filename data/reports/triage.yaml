  S-2cd8f408|regret|worst_case:
    verdict: closed
    summary: 'I read "worst_case" in the usual way: the minimax regret, taken over all allowed structure classes
      and all instances in them. Under that reading the gap is already closed at Θ(√T), using standard results.


      **Why it is closed:**

      - **Lower bound.** One valid structure is the trivial one: every pair of means is allowed. That is the ordinary
      two-armed Gaussian bandit with known σ. The standard minimax lower bound for that problem (Auer et al. 2002;
      Lattimore–Szepesvári Ch. 15) is Ω(√((K−1)T)). A survey quotes it as √((K−1)T)/27 for unit-variance Gaussian
      bandits with means in [0,1]^K; with K=2 this is Ω(√T). The database''s best lower bound, log(T/139)/2 from
      Bubeck–Perchet–Rigollet 2013, is far weaker in the worst case. It is really a lower bound for a specific class,
      which explains the apparent poly gap.

      - **Upper bound.** Any algorithm for unstructured bandits works whatever the structure is. MOSS (Audibert
      & Bubeck 2009) gets O(√(KT)) minimax regret, which is O(√T) for K=2. This drops the √(log T) factor from the
      8√2·√(T log T) bound inherited from Brukhim et al. 2025.


      Together these give Θ(√T).


      **Caveat.** If the database means the minimax rate for one fixed structure class, then the answer depends
      on the class. It can be anywhere from O(1) (e.g., Bubeck et al. 2013, where the learner knows extra information
      such as the gap or the optimal mean, giving bounded regret) up to Θ(√T). In that case, comparing a log T lower
      bound for one class with a √(T log T) upper bound for every class is not a meaningful gap.


      **Gaps in what I checked.** I did not fetch the book''s chapter or the Brukhim et al. theorem itself; the
      claims above come from search-result snippets. The book''s theorem number is not confirmed: sources call the
      Gaussian result Theorem 15.1, Theorem 15.2 or Exercise 15.2, and the published edition would settle this.
      The Auer et al. (2002) attribution for the lower bound also comes from a later paper quoted in a snippet;
      I did not see that paper directly.'
    papers:
    - title: Minimax Policies for Adversarial and Stochastic Bandits
      year: 2009
      arxiv_id: null
      claim: Audibert & Bubeck (COLT 2009). MOSS, a modified UCB, gets distribution-free regret O(√(nK)), removing
        the log factor. With K=2 this gives an O(√T) upper bound that holds for any structure.
