  S-d77c34f8|regret|worst_case:
    verdict: closed
    summary: He, Zhou, Zhang & Gu (NeurIPS 2022, arXiv:2205.06811) close the polynomial gap in T and d up to log
      factors. I read their arXiv HTML v2 (first 100k of 121k characters). Their setting matches ours on the main
      points. The adversary is adaptive and corrupts after seeing the decision set, the chosen action and the stochastic
      reward. The budget C = Σ|c_k| is per-path. A new, arbitrary decision set arrives each round and may be infinite,
      with ‖x‖₂ ≤ L. Noise is conditionally R-sub-Gaussian. I did not confirm from the text that regret is measured
      against uncorrupted rewards; that is the standard convention. CW-OFUL achieves Õ(d√T + dC) when C is known
      (Theorem 4.2). When C is unknown, it gets Õ(d√T + dC̄) for C ≤ C̄ (Theorem 4.9). The paper proves matching
      lower bounds Ω(max{d√T, dC}) (Propositions 4.7 and 4.8). This improves our upper bound (ding2021robust, which
      scales as T^{3/4}√d(C+1)) to the rate T^{1/2} and d^1, matching our Ω(d√(T log T)) lower bound up to log factors.
      Only log-factor gaps remain. The bound has no K dependence, so it is consistent with the K^{1/4} lower bound.
      I did not search for a corruption-robust SupLinUCB-type √(dT log K) bound, so the exact dependence on K for
      small K is not settled by this search. I ran one search; the PDF fetch returned unreadable binary, and the
      HTML fetch worked.
