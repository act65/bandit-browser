  S-aedf65f5|regret|worst_case:
    verdict: closed
    summary: 'The √log K gap is closed, but only by combining two published results. I did not find a paper that
      states the contextual bound itself.


      Setting: M_ctx finite contexts chosen by an oblivious adversary, K arms, rewards in [0,1]. The database upper
      bound, √(2·K·M·T·log K), comes from running a separate Exp3 for each context.


      **Upper bound without the log factor.** Replace Exp3 with Tsallis-INF (Zimmert & Seldin, arXiv 1807.07623).
      Its Theorem 1 bounds adversarial pseudo-regret by 4√(KT)+1 with importance-weighted estimators. The bound
      is anytime: the learning rate is η_t = 2/√t, so it needs neither T nor a doubling scheme. That matters here
      because each context''s round count T_c is unknown in advance. Running one copy per context gives regret at
      most Σ_c(4√(K·T_c)+1). By Cauchy–Schwarz this is at most 4√(K·M·T)+M, which is O(√(KMT)) when T ≥ M. Against
      an oblivious adversary, pseudo-regret and expected regret coincide. Audibert & Bubeck''s INF (COLT 2009 /
      JMLR 2010) already removed the √log K factor for the non-contextual problem.


      **Matching lower bound.** Split the rounds into M blocks of T/M, one block per context, and apply the existing
      √((K−1)T)/504 bound to each block. This gives Ω(√(MKT)). Note that the lower bounds in the database omit the
      M factor.


      So the minimax rate is Θ(√(KMT)): it is tight in K, M and T up to constants.


      **Caveats.**

      - I found no paper that explicitly states the composed O(√(KMT)) bound for this setting.

      - I could not read the text of Lattimore & Szepesvári Chapter 18 ("One bandit per context"). The fetched PDF
      came back as unreadable binary, so I could not check whether the book makes this remark or poses it as an
      exercise.

      - Neither of the two composition steps is spelled out in a paper I found. The anytime per-context argument
      and the block-splitting lower bound are my own reasoning. They are standard arguments, but I have not seen
      them written down this session.'
