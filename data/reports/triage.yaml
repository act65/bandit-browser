  S-b45210c0|regret|worst_case:
    verdict: closed
    summary: 'The log gap appears to be closed for finite realizable function classes. Foster & Rakhlin (ICML 2020,
      arXiv 2002.04926) prove that SquareCB has high-probability regret at most 4√(KT·Reg_Sq(T)) + O(√(KT log(2/δ))),
      with adversarial contexts allowed. For a finite class, Vovk''s aggregating forecaster gives Reg_Sq(T) ≤ 2
      log|F|. Section 1.2 of the paper says SquareCB then "enjoys the optimal rate" of order √(KT log|F|).


      Expected regret is my own derivation, not a stated theorem. Integrating the √(log(1/δ)) tail gives an expected
      regret of O(√(KT log|F|) + √(KT)). If log|F| is held constant, that is O(√(KT)) with no polylog(T) factor.
      This matches the database''s Ω(√(KT)) lower bound in both K and T. The database''s upper bounds (√(KT)·log^{3/4}-type,
      and the √(KT log³) SupLinUCB bound) are therefore loose for this setting.


      Caveat: the database''s function_class field is empty. If the intended class is infinite or nonparametric,
      rates instead depend on the class''s complexity. That case is covered by the paper''s Theorem 2 lower bound,
      of order T^((1+p)/(2+p)) up to log factors when the class''s entropy grows as ε^(-p).


      Tool note: I couldn''t parse the PDF, so I read the arXiv HTML version. I did not check the Agarwal et al.
      2012 lower bound in log|F| during this session.'
