    verdict: blank
    summary: 'No published result found that closes the √(log K) gap for expected regret in adversarial linear bandits
      with a fixed set of K actions; no paper found states it is open either. Upper bound: O(√(dT log K)) from exponential
      weights (Exp2 / John''s exploration). Best general lower bound seen: Ω(√(dT)), from embedding a d-armed bandit;
      a 2026 quantum linear bandits paper (arXiv 2608.14319) lists exactly these two bounds for K actions. The √(log
      K) factor is not needed when K=d (multi-armed bandits, Tsallis-INF gives √(dT)). It is needed when K≈2^d (hypercube
      lower bound d√T = √(dT log K)), assuming the action set is unrestricted. Partial result: Ito et al. (NeurIPS
      2019) prove Ω(√(d k³ T)) for bandit combinatorial optimization with item losses in [0,1]. My own rescaling
      to action losses in [−1,1] gives Ω(√(dkT)) ≈ Ω(√(dT log K / log(d/k))) for K=C(d,k), so the gap is at most
      √(log(d/k)) for those action sets. Bacchiocchi–Cesari–Colomboni (arXiv 2608.12231, 2026 preprint) prove a
      matching Ω(√(dT log(K/δ))) lower bound for m-set bandits against adaptive adversaries. It holds only with
      probability at least δ (high-probability regret, small δ), and the authors say it closes the √(log K) gap
      only at fixed confidence, not in expectation. The exact minimax dependence on K for expected regret appears
      unresolved in what I found. I could not read the Lattimore–Szepesvári book (its PDF came back as compressed
      binary). One table cites a ''Zhou (2019)'' Ω(√(dT log K)) lower bound that I could not confirm. Li et al.
      (2019) prove a lower bound with a log K factor, but for contextual bandits with changing action sets, so it
      does not apply.'
