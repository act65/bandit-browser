      That is the standard K-armed linear contextual bandit, and SupLinUCB (Chu, Li, Reyzin, Schapire, AISTATS 2011)
      already gives O(sqrt(T·d·ln³(KT ln T/δ))) regret there, even for arbitrary contexts. Li, Wang and Zhou (COLT
      2019) remove two sqrt(log T) factors and prove a lower bound that nearly matches. With d ≤ K, including the
      d = K case your database seems to use, this upper bound is Õ(sqrt(KT)). That matches the Ω(sqrt(KT)) multi-armed-bandit
      lower bound already in your database (Auer et al. 2002; Bubeck–Cesa-Bianchi 2012) up to polylog factors.


      So the K-exponent gap (3/4 vs 1/2) closes once you count SupLinUCB, which predates the stored upper bound.
      The only gap left is in the log factors on the T side, and as far as I found, no one has pinned those down
      exactly.


      Caveat: if the setting is meant to have a free dimension d much larger than K, or a policy or function class
      that isn''t linear, this reduction may not apply. In that case the stored entries are probably mis-specified
      rather than reflecting a genuine open problem.'
