  S-6afa3894|regret|worst_case:
    verdict: closed
    summary: 'The polynomial gap is closed, but only because the database is missing two known results. The database
      pairs a gap-free upper bound, O(√(KT)), with the weaker lower bound min(K/Δ, ΔT).


      (1) Upper bound. MOSS (Audibert & Bubeck) achieves O(min{√(KT), (K/Δ)·log(TΔ²/K)}), where Δ is the smallest
      gap. I saw this bound credited to MOSS in the survey by Bubeck & Cesa-Bianchi (arXiv 1204.5721). It does not
      even need to know Δ. In the regime Δ ≥ √(K/T) this gives K/Δ up to a log factor, so the exponents become Δ:
      −1, K: 1, T: 0 (polylog only).


      (2) Lower bound. Theorem 11 of Lattimore''s ''Regret Analysis of the Anytime Optimally Confident UCB Algorithm''
      (arXiv 1603.08661) is a finite-time bound that holds for any strategy. For every instance μ, either the regret
      on μ is at least (1/4)Σ_i (1/Δ_i) log(nΔ_i²/(k_i log n)), or there is a perturbed instance μ'' where one arm''s
      mean is raised by 2Δ_i that suffers at least half the analogous sum. Here k_i = Σ_j min{1, Δ_i/Δ_j}, which
      equals K when all gaps are equal. If every gap is Δ, both μ and μ'' have gaps of at least Δ. Because the theorem
      covers every strategy, including ones that know Δ, it gives a worst-case lower bound over this class of Ω((K/Δ)·log(TΔ²/(K
      log T))). Specialising the theorem to equal gaps is my own step; the paper states only the instance-dependent
      form. Separately, gaps of about √(K/T) are allowed whenever Δ ≤ √(K/T), which gives the standard Ω(√(KT)).


      So the worst-case regret is Θ(min{√(KT), (K/Δ)·log(TΔ²/K)}), up to at most a log-log factor inside the log
      term. In particular, the ΔT branch of the database''s lower bound is not the binding term at the minimax level.


      Caveats:

      - Lattimore''s lower bound is proved for unit-variance Gaussian noise, not rewards in [0,1]. The usual Bernoulli
      adaptation (means in [1/4, 3/4]) should give the same rate, but I did not see that version stated.

      - I could not read the PDF of Lattimore''s JMLR 2018 paper ''Refining the Confidence Level for Optimistic
      Bandit Strategies''. Its abstract says it contains a nearly matching finite-time lower bound.

      - I did not fetch the original MOSS paper, so the MOSS bound comes from the survey''s attribution.

      - Bubeck, Perchet & Rigollet (COLT 2013, arXiv 1302.1611) say in their abstract that bounded regret is impossible
      when only Δ is known, which agrees with a T-dependent (log) lower bound. A Microsoft Research page flags their
      Theorem 8 as having an incorrect proof; I did not check which result that theorem is.'
