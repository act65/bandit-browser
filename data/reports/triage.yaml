  S-576993df|regret|worst_case:
    verdict: blank
    summary: 'I found no paper that closes this gap, and none that explicitly says it is open, so the verdict is
      "blank".


      In this setting the adversary corrupts the observed contexts (arm features), not the rewards. Ding, Hsieh
      & Sharpnack''s RobustBandit (arXiv 2106.02978, AISTATS 2022) still has the best upper bound I could find for
      this setting. Without knowing the budget C, its regret is Õ(√d(C+1)T^{3/4} + d^{3/2}C T^{1/4}). If C is known,
      it is Õ(d(C+1)√T). That known-C bound is better in T than the bound in our database, but it is multiplicative
      in C, and our setting key does not say the learner knows C.


      "Strategic Linear Contextual Bandits" (arXiv 2406.00551) is described in search snippets as saying that only
      one prior paper has studied adversarial context corruption; I could not open the PDF to check this myself.
      That prior paper is presumably Ding et al., with an Õ(d·C̃·√T) bound where C̃ is the total context perturbation.
      The paper does not state the gap as an open problem.


      I searched for 2024–2026 work, including 2603.15596 and 2609.37189. The relevant recent papers are about reward
      corruption, and that line of work is essentially resolved. He et al. (2205.06811) get Õ(d√T+dC) with matching
      lower bounds. Liu et al. (2410.07533) mention an open problem, but it is about the C∞ dependence when rewards
      are corrupted (best known Õ(d√T+dC∞) upper vs Ω(d√T+√d C∞) lower). It says nothing about corrupted contexts.


      I found no lower bound that depends on C for context corruption, and no algorithm that reaches d√T plus an
      additive term in C under context attacks. The remaining gap, especially in T and C, looks unresolved, but
      I can''t cite anyone who explicitly calls it open.'
