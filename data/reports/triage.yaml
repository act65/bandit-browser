  S-d3f10459|regret|worst_case:
    verdict: blank
    summary: 'The gap is closed only for the Euclidean ball (p = 2). For a general ℓp ball I found neither a log-free
      d√T upper bound nor any source saying the question is open, so the verdict is "blank."


      For p = 2: Zhang, Hadiji & Combes (arXiv 2502.17175, 2025) study ellipsoidal action sets, which include the
      ℓ2 ball. They assume sub-Gaussian noise and known σ, and need no bound on ‖θ‖. Their algorithm (E2TC) gets
      R_T(θ) = O(min(σd√T + d‖θ‖_A, T‖θ‖_A)) with universal constants and a matching lower bound (Theorem 3.1, Corollary
      3.1). For ‖θ‖ ≤ 1 the worst-case regret is therefore Θ(d√T) with no log T. This removes the log^1.5 T gap
      left by the Dani et al. (2008) upper bound.


      The lower bound already matches the database. Ω(d√T) for the unit ball is due to Rusmevichientong & Tsitsiklis
      (2010) and Lattimore & Szepesvári (2020); I saw these only as restated in other papers, not in the originals.
      Banerjee et al. (2301.03597) extend it to ℓp balls for p in (1, ∞), under a condition on the dimension.


      For p ≠ 2, the ellipsoid paper covers ellipsoids only and lists other structured action sets as future work.
      Every other result I found is either adversarial (Bubeck, Cohen & Li 2018), for heavy-tailed noise (2506.04775),
      or carries polylog factors.'
