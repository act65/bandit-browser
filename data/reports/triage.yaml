  S-121abc62|regret|instance_dependent:
    verdict: closed
    summary: 'I''m calling this gap closed, with caveats. The gap is a missing log T factor: the database lower
      bound is min(K/Δ_min, Δ_min·T), while UCB-type upper bounds are O(Σ log T/Δ_i). Knowing Δ does not remove
      the log T factor.


      Bubeck, Perchet and Rigollet (COLT 2013, arXiv:1302.1611) prove that bounded regret is impossible when the
      learner knows only Δ. I read their Theorem 6 in the arXiv HTML v2. It uses ν = δ_0 ⊗ N(−Δ,1) and ν′ = δ_0
      ⊗ N(Δ,1). For any policy and any n ≥ 1, max(R_n(ν), R_n(ν′)) ≥ log(nΔ²/2)/(4Δ). This gives Ω(log(TΔ²)/Δ) when
      T ≳ 1/Δ², which matches the UCB upper bound in T and Δ.


      Caveats:

      1. **Gaussian rewards.** The theorem uses Gaussian rewards (and a Dirac arm), not rewards in [0,1]. A Bernoulli
      adaptation would follow from the same change-of-measure argument, but I did not see it stated for [0,1] rewards.

      2. **Two arms only.** The theorem covers two arms. A K-armed version of order K·log(TΔ²/K)/Δ is the natural
      extension, but I did not find it stated during this session.

      3. **Erratum.** The paper''s Microsoft Research page says the proof of Theorem 8 is incorrect. That theorem
      is the "only μ* known" result, not the "only Δ known" result used here. Theorem 6 is unaffected.


      The Lai–Robbins asymptotic lower bound for consistent policies also implies log T growth on Bernoulli instances
      with gaps ≥ Δ_min. I did not re-verify it this session, so it is not cited. In the database''s per-variable
      terms: T is closed (log T is necessary), Δ is closed, and K is closed only up to the multi-arm extension.


      Sources: [arXiv abstract](https://arxiv.org/abs/1302.1611), [arXiv HTML v2](https://arxiv.org/html/1302.1611v2),
      [PMLR page](https://proceedings.mlr.press/v30/Bubeck13.html), [Microsoft Research page with the Theorem 8
      note](https://www.microsoft.com/en-us/research/?p=354779).'
    papers:
    - title: Bounded regret in stochastic multi-armed bandits (Bubeck, Perchet, Rigollet, COLT 2013)
      year: 2013
      arxiv_id: '1302.1611'
      claim: 'Theorem 6 (only Δ known): with ν = δ_0⊗N(−Δ,1) and ν′ = δ_0⊗N(Δ,1), every policy has max(R_n(ν), R_n(ν′))
        ≥ log(nΔ²/2)/(4Δ), so regret must grow logarithmically even when Δ is known. Theorem 5 (both μ* and Δ known)
        gives Ω(1/Δ), and the authors also give a policy with bounded regret when both are known. The erratum on
        the Microsoft Research page concerns Theorem 8 (only μ* known), not Theorem 6.'
