  S-2b309865|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed in the worst-case regime: the minimax regret is Θ(√(KT)).


      **Why the lower bound applies.** The adversarial regime with a self-bounding constraint includes the fully
      adversarial case: take the corruption level C_sb to be of order T. So any adversarial lower bound for decoupled
      bandits carries over, and the database''s lower bound, √(T log K), is too weak.


      **Where the √(KT) lower bound comes from.** Avner, Shamir & Mannor (ICML 2012, arXiv 1205.2874) state it,
      but not as a fully proved general theorem. Footnote 1 in their Section 3 says the standard Ω(√(kT)) bandit
      lower-bound construction "can be shown to apply to a ''decoupled'' algorithm as well". There is no numbered
      theorem or proof for this. Their Theorem 6 does prove a c√(kT) bound, but only for algorithms with a fixed
      querying distribution. The argument is plausible because the learner still observes only one arm per round.


      **Later papers that treat this as settled.** Both describe the bound as Ω(√(KT)) and call √(KT) minimax optimal:

      - Rouyer & Seldin (COLT 2020) give Decoupled-Tsallis-INF, with O(√(KT)) adversarial regret.

      - Kim, Lee & Oh (NeurIPS 2025, arXiv 2510.12152) say Avner et al. "established a lower bound of Ω(√KT), matching
      that of the standard MAB", and give a minimax-optimal O(√(KT)) FTPL policy. They cite the bound rather than
      proving it.


      **Matching upper bound.** O(√(KT)) is achieved, consistent with the database''s jin2023improved bound.


      **What the verdict covers.** Only the worst-case exponents: T^{1/2} and K^{1/2}. The finer instance-dependent
      bound in terms of Δ and C_sb for decoupled feedback was not checked. Kim, Lee & Oh only analyse the stochastically
      constrained adversarial regime, not the self-bounding regime with corruption.'
    papers:
