      Exp3''s O(√(T log 2)) upper bound up to constants, and the database''s √T/log T lower bound (pacchiano2020model)
      is weaker than this textbook bound. Caveats: the joint dependence on C (presumably of the form √T + C) was
      not searched. I also could not read the theorem statements themselves: fetching the Slivkins book PDF returned
