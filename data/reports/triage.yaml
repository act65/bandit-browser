  S-701202cb|regret|worst_case:
    verdict: closed
    summary: 'The polynomial gap in d is closed by published work, but a √log T gap in T remains, and I found no
      paper that resolves it.


      **The gap in d is closed.** The database''s best lower bound, √(dT), is too weak. The standard minimax lower
      bound for stochastic linear bandits with a fixed infinite action set is Ω(d√T). Sources:

      - Rusmevichientong & Tsitsiklis (2010), for the unit ball.

      - Lattimore & Szepesvári, *Bandit Algorithms* (2020), Theorem 24.2: unit ball, 1-sub-Gaussian noise, valid
      when T ≥ d²/48. The hypercube Theorem 24.1 is from memory; I did not check it this session.

      - Dani, Hayes & Kakade (COLT 2008), cited as the original source.

      - Zhang, Hadiji & Combes (2025): for ellipsoid action sets, a lower bound of order min(dσ√T + d‖θ‖_A, ‖θ‖_A
      T) and an algorithm matching it up to a universal constant. So for ellipsoids, including the unit ball, the
      minimax rate is Θ(d√T) with no log factor.

      - Cesa-Bianchi & Kakade (2011) also note that d√T cannot be improved in general.


      The worst case over arbitrary compact sets includes the unit ball, so the lower bound is Ω(d√T). That matches
      the upper bound''s linear dependence on d. The upper bound in the database (Dani et al. 2008 with δ=1/T) is
      d√T times polylog(T). Known methods reduce it to about d√(T log T), for example phased elimination over a
      cover or Cesa-Bianchi & Kakade''s d√T up to logs.


      **Caveats.**

      - The lower-bound proofs I saw use sub-Gaussian (Gaussian) noise. The problem specifies rewards in [0,1].
      Rescaled constructions with Bernoulli rewards are standard, and the database''s own Ω(√(dT)) lower bound is
      already inherited across this difference, but I did not see a [0,1]-specific statement this session.

      - The lower bound needs T ≳ d².


      **What remains open: a √log T gap.** It sits between d√(T log T) and d√T for general (non-ellipsoidal) fixed
      compact action sets in the frequentist worst case. No paper I found closes it.

      - Li, Wang & Zhou (COLT 2019) prove √(dT log T log n) bounds for finite, contextual (time-varying) action
      sets. Per a search-result summary, their infinite-set bound is d√(T log T)·poly(log log T), and their abstract
      says tight bounds for infinite action sets remain open. I only confirmed that wording for the finite-set version,
      and that setting has time-varying sets, not this fixed-set one.

      - Gouverneur et al. (2024) get O(d√T) via chaining, but only as Bayesian regret and under a reward-continuity
      assumption.


      Because the poly(d) gap is resolved, the verdict is "closed", with this residual log(T) gap noted.'
