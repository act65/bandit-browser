  S-a0debe14|sample_complexity|worst_case:
    verdict: closed
    summary: 'The gap seems to come from how the database recorded the upper bound, not from an open problem. Upper
      bound: in Bai, Jin, Wang & Xiong (arXiv 2102.11494, NeurIPS 2021), Theorem 5 is for *linear* bandit games
      and gives O~(d^2/ε^2). Setting d=K (one-hot features) gives the K^2/ε^2 bound in the database. The same paper
      also handles the finite-action bandit game directly. I read these statements on the ar5iv page. Theorem 2
      gives O~(AB/ε^2) samples to reach a (gap_ε + ε)-approximate Stackelberg value. Theorem 3 is a matching lower
      bound: with about AB/ε^2 or fewer samples (times an absolute constant, with A, B ≥ 3), any algorithm has error
      g+ε with probability ≥ 1/3 on some instance. If K is the number of arms, meaning leader–follower action pairs
      (K = AB), the bound is Θ~(K/ε^2) and tight. That matches the Ω(K/ε^2) lower bound credited to li2023tight.
      Caveats: (1) The database setting is only labelled ''other_pure_exploration, K-armed, Bernoulli''. I assume
      it is the Stackelberg/bandit-game problem from bai2021sample, so the verdict depends on that reading and on
      K = AB. (2) The paper''s model has noisy rewards, possibly sub-Gaussian/bounded. I didn''t check that Theorem
      3''s hard instances are Bernoulli, though bounded-reward lower bounds of this kind usually are. (3) I could
      not find or confirm the li2023tight paper. (4) If K instead means each player''s action count (A = B = K),
      the bound is Θ~(K^2/ε^2) by Theorems 2 and 3, which is also tight. Either way, the gap is closed by Theorems
      2 and 3 of the same paper.'
    papers:
    - title: Sample-Efficient Learning of Stackelberg Equilibria in General-Sum Games
      year: 2021
      arxiv_id: '2102.11494'
      claim: 'Theorem 2: bandit games with A leader and B follower actions; O~(AB/ε^2) samples are enough for a
        (gap_ε+ε)-approximate Stackelberg value. Theorem 3: matching lower bound, Ω(AB/ε^2) samples are needed (A,
