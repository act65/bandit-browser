  S-f89b1b82|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed by classical results. For stochastic K-armed bandits, worst-case regret is Θ(√(KT)),
      so with K=2 it is Θ(√T) with no log factor either way. The database bounds (Õ(√T) upper, Ω(√T/log T) lower)
      are loose versions of this.


      Upper bound: MOSS (Audibert & Bubeck, 2009/2010) has distribution-free regret of order √(KT) with no log factor.
      The 2012 survey by Bubeck & Cesa-Bianchi states this in Section 4.3 ("up to a numerical constant"). I saw
      that statement on the survey page. Other papers in the search results quote MOSS constants of 39√(KT)+ΣΔ and
      49√(KT), but I didn''t confirm those in the original paper. I didn''t open the original MOSS paper.


      Lower bound: the same survey (Theorem 7.9, minimax lower bound) gives inf sup R_n ≥ (1/20)√(nK). The supremum
      is over i.i.d. {0,1}-valued (Bernoulli) reward distributions, and the setup only needs K ≥ 2. Bernoulli rewards
      are (1/2)-subgaussian, so this applies to the subgaussian K=2 setting and gives Ω(√T). It sits in the chapter
      on adversarial bandits, but the rewards in the hard instance are stochastic i.i.d. Lattimore & Szepesvári''s
      Bandit Algorithms covers the same result in Chapter 15, §15.2 "Minimax Lower Bounds" (I only saw the table
      of contents, not the theorem text).


      So the minimax regret for K=2 is Θ(√T). Pinning down the exact constant is a separate, finer question that
      isn''t settled.'
    papers:
    - title: Regret Analysis of Stochastic and Nonstochastic Multi-armed Bandit Problems (Bubeck, Cesa-Bianchi)
