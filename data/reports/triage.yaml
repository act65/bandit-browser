  S-f33b6db2|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed. In this setting (K arms, stochastic rewards, subgaussian noise, worst-case cumulative
      regret), the minimax rate is Θ(√(KT)). The database''s best upper bound, K^{3/4}·√T·polylog (from jin2026nearly),
      is much weaker than results already known.


      Audibert & Bubeck (2009) introduced MOSS (Minimax Optimal Strategy in the Stochastic case), which achieves
      O(√(KT)) worst-case regret with no log factor. It was the first algorithm proved minimax optimal. A 2024 survey
      (arXiv 2412.02251) cites the bound as 39√(KT) + Σ_k Δ_k for sub-Gaussian rewards, proved via Doob''s submartingale
      inequality. This matches the √(KT)/20 lower bound already in the database up to a constant. That closes the
      polynomial gap in K and the log gap in T.


      Later algorithms also reach √(KT) minimax regret:

      - MOSS-anytime (Degenne & Perchet 2016) removes the need to know T.

      - KL-UCB++ (Ménard & Garivier 2017, arXiv 1702.07211) is minimax and asymptotically optimal, but is not anytime.

      - ADA-UCB (Lattimore 2018) is minimax and asymptotically optimal.

      - KL-UCB-switch (arXiv 1805.05071) is optimal from both the distribution-free and distribution-dependent viewpoints.

      - MOTS (arXiv 2003.01803) is a minimax-optimal Thompson Sampling variant.


      Caveat: one source notes that the asymptotic-optimality claims for KL-UCB++, AdaUCB and MOTS are stated for
      Gaussian or other specific families. This does not affect the minimax √(KT) rate, which MOSS achieves under
      subgaussian noise.


      Two gaps in what I checked:

      - The Lattimore–Szepesvári book''s Chapter 9, "The Upper Confidence Bound Algorithm: Minimax Optimality",
      covers MOSS in Section 9.1; I saw this in the table of contents. I did not see its theorem text, so the constant
      (~39) and the 1-subgaussian assumption there come from secondary sources and memory.

      - I did not fetch the original Audibert & Bubeck paper.'
