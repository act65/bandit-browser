  S-1e301c6f|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed. Huang, Dai and Huang (ICML 2022, arXiv 2201.11921) study rewards whose α-th moment
      is bounded by σ^α. In this database''s notation, α = 1+eps_m and σ is the moment bound. Their algorithm HTINF
      assumes α and σ are known. I read their Theorem A.1 on ar5iv: it gives worst-case regret R_T ≤ 30·σ·K^{1−1/α}·(T+1)^{1/α},
      with no log factor, in both stochastic and adversarial environments. That equals O(K^{eps/(1+eps)} T^{1/(1+eps)}).
      It matches the Ω(K^{eps/(1+eps)} T^{1/(1+eps)}) lower bound of Bubeck, Cesa-Bianchi and Lugosi (2013, Theorem
      2) up to constants in both K and T, and the paper says so itself. The same paper''s AdaTINF reaches the same
      order without knowing α or σ, but I only saw that in the abstract. So the extra sqrt-log(K) factor in the
      database''s upper bound (from tajdini2025improved) is not needed. Separately, the database''s upper-bound
      expression, sqrt(K)·T^{1/(1+eps)}·log(K)^{eps/(1+eps)}, has a K exponent of 1/2 rather than eps/(1+eps). The
      two agree only at eps=1, so that entry is worth checking. Lee, Yang, Lim and Oh (NeurIPS 2020, APE2) and Lee
      and Lim (minimax-optimal heavy-tailed bandits, IEEE TNNLS 2024) also claim minimax optimality. I could not
      check their exact bounds (fetching the NeurIPS PDF failed), so the verdict rests on Huang et al. 2022.'
