      graphs gives O(√(ᾱT)·ln(KT)), where ᾱ is the average of the per-round α_t. Since Exp3.G uses the graph only
      after the action is chosen, revealing it after the action is fine. This matches the Ω(√(αT)) lower bound up
      to log factors.

      - **Adaptive adversary:** Alon et al. assume a loss sequence fixed in advance. For the adaptive case, Luo,
      Tong, Zhang & Zhang (ALT 2023, arXiv 2210.01376) give a high-probability bound of about Õ(√(Σ_t α_t) + max_t
      α_t) for time-varying strongly observable graphs, with no poly(K) dependence. High-probability bounds of this
      kind usually carry over to adaptive adversaries, but I did not check this paper''s adversary assumptions.

      - **Log factors (undirected graphs):** Eldowa, Esposito, Cesari & Cesa-Bianchi (NeurIPS 2023, arXiv 2305.15383)
      give an upper bound of O(√(αT(1+ln(K/α)))) using q-Tsallis FTRL. They also prove a lower bound of Ω(√(αT·ln
      K/ln α)) for α>1, which shows some log factor is needed whenever α<K. I did not confirm that this bound covers
      directed or time-varying graphs.


      Caveat: the polynomial dependence is settled. What remains open is the exact log factor for directed and time-varying
      graphs, which is a minor log-level question.'
