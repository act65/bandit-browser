      stochastic-plus-corruption algorithm on a fixed finite action set that spans R^d is in Lee, Luo, Wei, Zhang
      & Zhang (ICML 2021, arXiv 2102.05858). Fetching its arXiv/ar5iv page showed instance-independent regret O(d√T
      log(T|X|/δ) + C) (their Theorem 2) and instance-dependent regret O(c(X,θ) log²T + C). That paper also restates
      that the minimax adversarial regret is Θ(d√T).


      Lower bound: corruption alone forces Ω(C) (Gupta et al. 2019; the database already has this). The uncorrupted
      case C=0 is a special case of the setting, so the standard stochastic linear-bandit minimax lower bound applies.
      This is Ω(d√T) using the hypercube construction with K = 2^d arms (Lattimore & Szepesvári 2020, Ch. 24; Dani
      et al. 2008). For K = 2^d we have sqrt(dT log K) = d√T, so the worst-case exponents match: T^{1/2}, d^{1/2}
      (times log^{1/2} K), and linear in C.


      Bogunovic et al. (AISTATS 2021) and He et al. (NeurIPS 2022) also give algorithm-independent lower bounds
      on the corruption term, which they show are near-optimal. A NeurIPS 2022 paper describes the Bogunovic bound
      as Ω(dC), but the setting it applies to is not visible in the snippet. I could not read the PDFs of either
      paper, so I have not checked their exact lower-bound statements.


      What remains open: whether the dependence on K is tight for every K separately, i.e. a sqrt(dT log K) lower
      bound for non-contextual finite-armed linear bandits with arbitrary K. Ito (NeurIPS 2024) gives a matching
      sqrt(dT log(K·min{1,S/d}))-type bound with a lower bound for the contextual problem (S is the context-space
      size), but that is a different setting. So the verdict is "closed" in the worst-case sense of polynomial exponents,
      up to log factors.


      Tool notes: the arXiv PDFs came back as unreadable compressed binary. I relied on the abstract pages, the
      ar5iv HTML page of 2102.05858 (only the first ~100k characters were read), and search snippets.'
