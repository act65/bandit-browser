  S-59ffe186|regret|worst_case:
    verdict: closed
    summary: 'The √log T gap is closed, apart from iterated-logarithm (log log) factors, by the same paper the database
      already cites for its lower bound. That paper is Li, Wang & Zhou, "Nearly Minimax-Optimal Regret for Linearly
      Parameterized Bandits" (COLT 2019, arXiv:1904.00242).


      **Setting:** linear contextual bandits with finite action sets of n ≤ 2^{d/2} actions per round, chosen adversarially
      and changing each round.


      **What the paper shows:**

      - **Lower bound:** minimax regret is Ω(√(dT log T log n)).

      - **Upper bound:** their Variable-Confidence-Level SupLinUCB algorithm matches this lower bound up to iterated-logarithm
      factors, removing two √log T factors from earlier SupLinUCB analyses.

      - **Infinite or very large action sets:** a talk abstract by co-author Yuan Zhou says the paper also gives
      O(d√(T log T))·poly(log log T), matching Ω(d√(T log T)) up to log log factors.


      **Why the database shows a gap:** the stored upper bound is the weaker Thompson-sampling bound (Agrawal &
      Goyal 2013). The tight upper bound from Theorem-level results in Li–Wang–Zhou is missing from the database.


      **Caveats:**

      - The rates hold only up to poly(log log T) factors, so the gap is closed in T and d except for log log terms.

      - I only read the arXiv abstract and search summaries, not the theorem statements. In particular, the abstract
      does not state the upper bound explicitly; it only says the algorithm matches the lower bound up to iterated
      logarithms.'
