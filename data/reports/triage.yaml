  S-bf88dbef|regret|worst_case:
    verdict: open_known
    summary: "The gap has two parts, and only the log T part closes.\n\n1. **T-direction (closes).** The extra log\
      \ T in the database's upper bounds comes from setting delta=1/T in high-probability bounds. Exp4 (Auer et\
      \ al. 2002) gets expected regret O(sqrt(KT log N)) even against adversaries, so it also holds for stochastic\
      \ contexts. Kale's bound O(sqrt(KT log(N/K))) is better still. With this, the T-dependence is Theta(sqrt(T)).\
      \ Caveat: I saw these two bounds only as summarised in the Chase et al. and Ito papers. I did not fetch the\
      \ Exp4 or Kale papers themselves.\n\n2. **K-direction (still open for this setting).** What remains is a factor\
      \ of about log K between the upper bound sqrt(KT log(N/K)) and the lower bound sqrt(KT log N / log K) (Agarwal\
      \ et al. 2012; Seldin & Lugosi 2016). Ito (NeurIPS 2024) states this exact gap. He proves a matching Omega(sqrt(KT\
      \ log(N/K))) lower bound only for a modified protocol where the learner picks an expert before seeing the\
      \ advice, which is not the standard setting.\n\n   Chase, Ito & Mehalel (arXiv 2511.00257; COLT 2026) do close\
      \ the gap, giving Theta(sqrt(TK log(N/K))). However, their hard instance uses an adaptive adversary: the advice\
      \ is redrawn based on the learner's pulls. So it does not apply to i.i.d. stochastic contexts with Bernoulli\
      \ rewards. The authors themselves only conjecture that the bound holds for oblivious adversaries.\n\nBecause\
      \ a stochastic i.i.d. instance is a special case of an oblivious one, the tight bound for stochastic contexts\
      \ with Bernoulli rewards is unproven. That makes it a known open (conjectured) problem rather than a closed\
      \ one.\n\nSources: https://arxiv.org/abs/2511.00257 , https://proceedings.mlr.press/v336/chase26a.html , https://proceedings.neurips.cc/paper_files/paper/2024/hash/7169e48889a07662f4168e3911c4a69e-Abstract.html"
