  S-0128563c|simple_regret|worst_case:
    verdict: closed
    summary: 'The √(log K) gap is closed: the worst-case simple regret is Θ(√(K/T)) for T ≥ K. A known reduction
      gives the matching upper bound. Recommend arm i with probability T_i(n)/n, where T_i(n) is the number of times
      arm i was played. Then expected simple regret equals expected cumulative regret divided by n. I saw this reduction
      stated in a search snippet attributed to Bubeck, Munos & Stoltz (arXiv 0802.2655, later versions). MOSS (Audibert
      & Bubeck, COLT 2009) has cumulative regret O(√(KT)) with no log factor. Combining the two gives simple regret
      O(√(K/T)), which matches the Ω(√(K/T)) lower bound up to constants. An explicit statement of this result appears
      in Oki & Sakaue (arXiv 2405.12439), which I read in its HTML version. Their Prop. 4.1 and Appendix B (with
      M arms and T′ rounds) run MOSS and return an arm uniformly at random from those played. They bound the cumulative
      regret by 39√(MT′)+M, citing Lattimore–Szepesvári Thm 9.1, and get simple regret ≤ 40√(M/T′). They call this
      a known result. The Lattimore–Szepesvári result assumes 1-subgaussian noise, and rewards in [0,1] are 1/2-subgaussian,
      so it applies here. Limitations: I could not extract text from the PDFs of Bubeck et al., the Lattimore–Szepesvári
      book or Bubeck''s thesis. My evidence for the reduction in 0802.2655 is a search snippet, not the paper text.
      The closing citation is the Oki–Sakaue appendix together with the MOSS paper, whose abstract I saw saying
      it removes the extra log factor.'
