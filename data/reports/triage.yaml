  S-ae45b4a7|regret|instance_dependent:
    verdict: closed
    summary: 'For the worst case over graph sequences, the gap is closed by a classical result. The class allows
      any oblivious sequence of strongly observable, never-revealed graphs, including one where every arm has only
      a self-loop. That sequence is exactly the plain K-armed bandit, so the Lai-Robbins (1985) lower bound applies:
      liminf R(T)/log T >= sum_{i suboptimal} Delta_i/KL_i (Burnetas-Katehakis for general [0,1] rewards). This
      matches the existing KL-UCB / K_inf upper bounds sum Delta_i/kl_i * log T, with Theta(1/Delta) per arm summed
      over about K arms. The poly gap in Delta and K is therefore an artifact of the database''s weak log(T) lower-bound
      entry (caron2012leveraging). I saw the Lai-Robbins statement only in secondary sources (arXiv 2001.11201,
      Wikipedia), not the original theorem text, so constants and the KL convention should be checked against the
      DOI. Caveat: if the target is a graph-adaptive bound (in terms of the independence numbers alpha_t), that
      is a different question. Lykouris-Tardos-Wali (ALT 2020) give gap- and graph-dependent UCB/TS bounds that
      don''t use the graph to choose arms; I couldn''t parse the PDF, so their exact form is unconfirmed. Cohen-Hazan-Koren
      (ICML 2016) give sqrt(alpha T) for stochastic losses with hidden graphs. I found no matching alpha-dependent
      instance-dependent lower bound for time-varying, never-revealed graphs, so that refinement appears open.'
    papers:
