  S-3062cad4|regret|instance_dependent:
    verdict: closed
    summary: 'The gap looks closed, up to constants and in the usual asymptotic sense. The database''s best upper
      bound (pacchiano2020model) is loose, and its lower bound min(K/Δ_min, Δ_min·T) is missing the log T factor.


      Upper bound: UCB (Auer, Cesa-Bianchi & Fischer 2002) gets regret O(Σ_i log T/Δ_i + Σ_i Δ_i) without knowing
      Δ_min. That is at most O(K log T/Δ_min). It is linear in K and in 1/Δ_min with a single log T, which removes
      the polynomial gaps in K (2/3 vs 1) and Δ (-1/3 vs 1) and the log² T. The paper I saw states this for UCB1
      with rewards in [0,1]. The sub-Gaussian version is the standard textbook variant, but I did not confirm it
      from a source this session.


      Lower bound: Garivier, Kaufmann & Lattimore (NeurIPS 2016) prove a Lai–Robbins-type bound for two-armed Gaussian
      bandits that holds even when the gap Δ is known (their Theorem 6): liminf R_T/log T ≥ 1/(2Δ). Their fully
      sequential Δ-UCB matches it, and its leading term is about log(TΔ²)/(2Δ). So knowing Δ only saves a constant
      factor and the regret is still logarithmic in T. Extending to K arms uses the same change-of-measure argument:
      K−1 arms each at gap Δ_min, and an alternative that raises one arm by 2Δ_min keeps the minimum gap at Δ_min.
      This gives Ω(K log T/Δ_min). That K-arm extension is my own inference; I did not see it stated in a paper.
      Together these give Θ(K log T/Δ_min) when all gaps equal Δ_min.


      Caveats:

      - The matching lower bound is asymptotic and for consistent strategies. A finite-T minimax bound over instances
      with gap Δ would have the form K/Δ·log(TΔ²/K).

      - Bubeck, Perchet & Rigollet (COLT 2013) claim that knowing only Δ cannot give bounded regret (log growth
      is unavoidable). But the authors'' Microsoft Research page says the proof of their Theorem 8, their main lower
      bound, is incorrect and that they do not know whether the theorem holds. So I don''t rely on it.

      - I could not extract text from the arXiv, PMLR or Microsoft PDFs, so I don''t have the exact non-asymptotic
      statements.'
