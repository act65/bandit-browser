  S-87eb7f98|regret|worst_case:
    verdict: closed
    summary: 'The gap in d is closed by a known result. The remaining gap in T is only logarithmic.


      **The d gap.** The database''s lower bounds are √(Td). These come from multi-armed or adversarial bandit constructions,
      so they are weak in d. Lattimore & Szepesvári (Bandit Algorithms, 2020, Ch. 24, hypercube theorem) prove an
      Ω(d√T) minimax lower bound for stochastic linear bandits with Gaussian noise. The construction uses actions
      in [-1,1]^d and parameters in {±1/√T}^d. In that construction the optimal arms are the 2^d corners. I believe
      the same argument goes through when the action set is just the finite set {-1,1}^d. Zhou, Gu & Szepesvári
      (2012.08507) use exactly that finite hypercube {-1,1}^{d-1} as a linear-bandit lower bound. A finite action
      set with a fixed bound on action norms is allowed, and the parameter set is unbounded, so rescaling to norm
      L costs nothing. This makes the lower bound Ω(d√T) in the finite-action setting. That matches the d-exponent
      1 of the upper bound (Dani et al. 2008 give O(d√T·polylog T); OFUL and finite-arm phase elimination give the
      same rate). So the poly gap in d is closed at d√T.


      **The T gap.** A gap of polylog(T) remains between d√T and d√T·polylog T. This is a log factor only, and I
      did not find a paper that closes it for finite action sets of unbounded size.


      **Caveats.**

      - The secondary sources I found describe the theorem as stated for [-1,1]^d. Applying it to the finite corner
      set is my own argument from the proof structure, not something I saw stated.

      - I could not read the book text: fetching the PDF returned only binary. The theorem statement is confirmed
      only through citing papers (2105.10590 and 2603.03843 in search snippets).

      - I also could not read the PDF of 2012.08507, so its {-1,1}^{d-1} claim comes from a search-result snippet
      only.'
