  S-df737978|bayesian_regret|worst_case:
    verdict: blank
    summary: 'The gap between d√(T log T) (Russo-Van Roy, Dong-Van Roy) and d√T (Dani et al.) is closed only under
      a stronger noise assumption. Gouverneur et al. (arXiv:2403.03361) prove Bayesian regret ≤ 7d√T for Two-Step
      Thompson Sampling (2-TS) on any compact action set inside the unit ball, convex or not. However, they need
      a ''smooth rewards'' condition: R_a − R_b must be ρ(a,b)-sub-Gaussian, plus separability. Generic bounded
      ±1 noise that is independent across actions does not satisfy this, so the result does not cover this setting
      as stated. The follow-up arXiv:2502.02140 still has d√(T log T). On the lower-bound side, Li-Wang-Zhou (COLT
      2019) prove Ω(√(dT log T log n)) only for action sets that change every round (contextual), which does not
      transfer to a fixed action set. No source I saw states the fixed-action-set, bounded-noise case as an explicit
      open problem, hence ''blank''. The gap looks closed in spirit, but only under an extra assumption.'
    papers:
    - title: Chained Information-Theoretic Bounds and Tight Regret Rate for Linear Bandit Problems
      year: 2024
      arxiv_id: '2403.03361'
      claim: Two-Step Thompson Sampling (2-TS) achieves Bayesian regret ≤ 7 d sqrt(T) for compact action sets in
        the unit ball, under a smooth-rewards assumption (sub-Gaussian increments w.r.t. Euclidean metric, plus
        separability); removes the log T factor under that assumption.
    - title: An Information-Theoretic Analysis for Thompson Sampling with Many Actions
      year: 2018
      arxiv_id: '1805.11845'
      claim: Rate-distortion analysis gives O(d sqrt(T log T)) Bayesian regret for TS in d-dim linear bandits with
        infinite action sets.
    - title: An Information-Theoretic Analysis of Thompson Sampling with Infinite Action Spaces
      year: 2025
      arxiv_id: '2502.02140'
      claim: Recovers the O(d sqrt(T log T)) rate with improved constants for infinite/continuous action spaces.
    - title: Nearly Minimax-Optimal Regret for Linearly Parameterized Bandits
