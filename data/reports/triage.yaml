  S-2beeb9f3|regret|instance_dependent:
    verdict: closed
    summary: 'Verdict: closed, with one caveat below.


      **Why it is closed.** The database''s best lower bound is a bare Ω(log T) with no dependence on the gaps Δ
      or on K. That is too weak, and it is the only reason a gap shows up. The setting allows any strongly observable
      graph sequence. That includes a fixed graph, and it includes the graph with only self-loops, which is the
      ordinary bandit. So the classical Lai–Robbins bound applies, at least in the worst case over the class: Ω(Σ_i
      log T/Δ_i) in the Gaussian/Bernoulli kl form. This matches UCB1 / KL-UCB in both Δ and K up to constants.


      **Fixed graphs.** Here the asymptotic instance-dependent rate is fully characterised by the optimal value
      of a graph-dependent linear program (LP):

      - Buccapatnam, Eryilmaz & Shroff (arXiv 1704.07943) derive this LP lower bound for uniformly good policies.
      Their UCB-type and randomized policies match it up to a constant factor.

      - Wu, György & Szepesvári (NeurIPS 2015, arXiv 1510.08108) give non-asymptotic problem-dependent lower bounds
      that recover the asymptotic ones, plus algorithms that match them up to a universal constant.

      - Marinov, Mohri & Zimmert (NeurIPS 2022, arXiv 2206.10022) show that "optimal finite-time regret" is not
      uniquely defined for feedback graphs. For their notion, they give an algorithm that is quasi-optimal both
      in finite time and asymptotically.


      Together, the Δ and K exponents (upper 1 vs. lower 0) are pinned down: the right order is a graph-dependent
      sum of terms log T/Δ_i, between the independence-number and domination-number scales. The database simply
      lacks these lower bounds.


      **Caveat.** I found no paper that exactly characterises the instance-dependent rate for arbitrary time-varying
      oblivious graph sequences known in advance. Lykouris, Tardos & Wali (ALT 2020, arXiv 1905.09898) give graph-and-gap-dependent
      UCB/Thompson-sampling upper bounds. Their abstract does not say whether time-varying graphs are covered, and
      I did not read the full paper. Mehta (arXiv 2305.04093) sharpens the UCB-N/TS-N analysis for undirected graphs.
      Read per instance, the exact constant for time-varying sequences may still be open. The polynomial gap in
      Δ and K as recorded, however, is closed by the known lower bounds.'
