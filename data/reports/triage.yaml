    verdict: closed
    summary: 'Closed up to log factors; the database''s upper bound (T^{3/4}, Ding et al. 2021) is loose and its
      lower bounds omit the corruption term. For stochastic linear bandits with finite actions and known C, Bogunovic
      et al. (AISTATS 2021) get Õ(√(dT log k) + C d^{3/2} log T). He et al. (NeurIPS 2022) get Õ(d√T + dC) and prove
      Ω(dC). Liu, Tajdini, Wagenmaker & Wei (NeurIPS 2024) get Õ(d√T + Z) and, for a finite action set, Õ(√(dT log|A|)
      + Z log T), where Z = dC for corruption on played actions and Z = √d·C∞ for the weaker measure. They give
      matching lower bounds Ω(d√T + dC) and Ω(d√T + √d·C∞), and state the stochastic known-C case is fully characterised;
      only the adversarial and contextual versions remain open. So the T-exponent gap (0.75 vs 0.5) is closed: the
      upper bound is √T plus a term linear in C. The d-exponent matches up to the log|A| factor (lower bounds aren''t
      stated with explicit |A| dependence). The C term matches up to logs. Caveat: I couldn''t tell which corruption
      measure "per_path" means; either way only the coefficient on C changes (dC or √d·C). Bounds were read from
      arXiv HTML versions through a summarising fetch tool; direct PDF extraction failed.'
