  S-d4798f10|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed, and the result is in the journal version of the same work your database cites.
      Audibert, Bubeck & Lugosi, "Regret in Online Combinatorial Optimization" (MOR 2014; arXiv:1204.4710), studies
      adversarial semi-bandits over an arbitrary set S ⊂ {0,1}^d of actions with ||v||_1 = m, with each loss coordinate
      in [0,1] (bounded loss per coordinate). Its Theorem 4, run on the ar5iv HTML version, uses OSMD/INF with the
      polynomial potential ψ(x) = (−x)^{−q}. This gives R_n ≤ q·sqrt(2/(q−1)·mdn), so 2·sqrt(2mdn) at q = 2, with
      no log factor. That bound assumes the horizon n is known, since the learning rate depends on it.


      The paper notes that the negative-entropy OSMD bound sqrt(2mdn·log(d/m)) — essentially the cited upper bound,
      assuming E is the cited version''s name for the action size m — has "an extraneous logarithmic factor compared
      to the lower bound." Its results table gives matching semi-bandit lower and upper bounds of order sqrt(mdn).
      The minimax regret is therefore Θ(sqrt(mdT)), and the sqrt(log) gap in d (and m) is closed.


      I did not confirm the exact lower-bound constant: the journal paper reaches sqrt(mdn) by reduction to the
      d-armed bandit lower bound and gives no explicit constant. A search snippet for the COLT 2011 version (arXiv:1105.4871)
      says its upper and lower bounds are tight up to a constant factor outside the bandit game, so the cited paper
      may already have the log-free bound. I couldn''t check this because I didn''t open that paper.'
    papers:
    - title: Regret in Online Combinatorial Optimization
      year: 2014
      arxiv_id: '1204.4710'
      claim: 'Theorem 4: for semi-bandit feedback with losses in [0,1]^d and arbitrary S ⊂ {0,1}^d with ||v||_1
        = m, OSMD/INF with potential (−x)^{−q} gives R_n ≤ q·sqrt(2/(q−1)·mdn), i.e. 2·sqrt(2mdn) at q = 2. Matching
        lower bound of order sqrt(mdn), so semi-bandit minimax regret is Θ(sqrt(mdn)). The negative-entropy bound
        sqrt(2mdn·log(d/m)) is called suboptimal by a log factor.'
