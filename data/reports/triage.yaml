  S-65c1bf79|regret|worst_case:
    verdict: closed
    summary: 'Li, Wang and Zhou (COLT 2019) close this gap up to iterated-logarithm factors. The setting is finite-armed
      linear contextual bandits with K arms per round and adversarially chosen (oblivious) action sets. Their lower
      bound is Ω(√(dT log T log K)), proved for K ≤ 2^{d/2} under a horizon condition. Their VCL-SupLinUCB algorithm
      has an upper bound of O(√(dT log T log K))·poly(log log(KT)). This is two √log T factors better than SupLinUCB''s
      bound of √(dT log^3(KT)), the upper bound in our database. The lower bound is also stronger than the database''s
      √(dT) lower bound. The only remaining gap is a poly(log log) factor. The database''s per-variable T-exponent
      gap (log^1.5 against 0.5) should be updated to: upper √(T log T)·polyloglog, lower √(T log T). One caveat:
      the lower bound needs K ≤ 2^{d/2}. A related recent paper, Jin (arXiv 2609.15170), studies action sets chosen
      adaptively, which is a different setting from the oblivious sequence here. Its bounds include a K^{1/4} factor,
      so it does not apply.'
    papers:
    - title: Nearly Minimax-Optimal Regret for Linearly Parameterized Bandits (Yingkai Li, Yining Wang, Yuan Zhou)
      year: 2019
      arxiv_id: '1904.00242'
      claim: 'For finite-armed linear contextual bandits with adversarial action sets and n ≤ 2^{d/2} arms: lower
        bound Ω(√(dT log T log n)); VCL-SupLinUCB upper bound poly(log log(nT))·O(√(dT log T log n)). This matches
        up to iterated-log factors and saves two √log T factors over SupLinUCB.'
    - title: Nearly Minimax-Optimal Regret for Linear Contextual Bandits with Arbitrary Adaptive Action Sets (Tianyuan
        Jin)
      year: 2026
      arxiv_id: '2609.15170'
      claim: 'In a setting where action sets are chosen adaptively, with K ≤ d: matching bounds of order K^{1/4}√(dT)
        up to logs. With K ≥ d: bounds of order √(dT)·min{√d, (d log K)^{1/4}}. This is a different setting from
        the oblivious action sets here.'
