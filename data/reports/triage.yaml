  S-3edc9f31|hp_regret|worst_case:
    verdict: closed
    summary: 'The polynomial gap in d is closed, up to logarithmic factors. The database''s upper bound, inherited
      from Lee et al. 2020, scales as d^2·ϑ·√(dT). The database''s lower bound scales as √(dT). Both are stale.


      **Upper bound:** Zimmert and Lattimore (COLT 2022, "Return of the bias") give an agent for adversarial linear
      bandits against an adaptive adversary on general action sets. According to the PMLR page and full text, its
      regret is O(d√(T log(T/δ))) with probability at least 1−δ. Their minimax bound is O(d√(T log T)), and they
      state that for general action sets the minimax regret is the same against adaptive and oblivious adversaries.
      That algorithm is not computationally efficient. Their efficient version (FTRL with the entropic barrier)
      has regret O(d²√T log T) against an adaptive adversary.


      **Lower bound:** The hypercube is a convex body, and it already forces Ω(d√T) expected regret. One search
      result I saw (arXiv 1408.2368, "On the Complexity of Bandit Linear Optimization") states this for T ≥ d⁴/4.
      Cesa-Bianchi and Kakade (arXiv 1110.4322) also say the order-d√T rate cannot be improved in general. An expected-regret
      lower bound of this order also rules out a better high-probability bound for constant δ.


      **Result:** For worst-case regret over convex bodies, the rate in d is Θ(d), and the rate in T is √T (√(log
      T) in the upper bound). The δ-dependence is also close: the upper bound grows with √(log(1/δ)), which the
      √(log(1/δ)) term in Bacchiocchi et al. 2026 matches. A gap of more than log factors remains only for computationally
      efficient algorithms (d² versus d). Separately, for convex bodies with self-concordance parameter ϑ, the gap
      stays open if you need bounds that adapt to ϑ.


      I did not see the original Dani–Hayes–Kakade hypercube construction in this session. The hypercube lower bound
      rests on the 1408.2368 snippet and the Cesa-Bianchi–Kakade statement.'
    papers:
    - title: 'Return of the bias: Almost minimax optimal high probability bounds for adversarial linear bandits
        (Zimmert, Lattimore; COLT 2022, PMLR 178:3285-3312)'
      year: 2022
