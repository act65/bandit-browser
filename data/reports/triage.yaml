  S-1a96c540|hp_regret|worst_case:
    verdict: closed
    summary: 'This verdict comes with an important caveat about which adversary model is meant. The gap is a √log
      K factor: Exp3.P / Exp3-IX give an upper bound of O(√(KT log(K/δ))), and Gerchinovitz & Lattimore (2016) give
      a lower bound of Ω(√(KT log(1/δ))) that holds even for oblivious loss sequences. Bacchiocchi, Cesari & Colomboni,
      "An Efficient Minimax-Optimal Algorithm for Adversarial m-Set Bandits" (arXiv:2608.12231, Aug 2026), prove
      a new lower bound. For small enough δ, every randomized policy faces some deterministic adaptive non-anticipating
      adversary with losses in [0,1] under which, with probability at least δ, regret is Ω(√(KT log(K/δ))). For
      m=1 this is the K-armed bandit, and the authors say explicitly that this "closes the remaining √log K gap"
      left by Gerchinovitz–Lattimore when the adversary is adaptive and non-anticipating. They also give a matching
      O(√(KT log(K/δ))) upper bound. So against adaptive adversaries, with regret measured against the best fixed
      arm (the setting where Exp3.P''s bound holds), the rate √(KT log(K/δ)) is tight up to constants. Caveats:
      (1) The paper''s adversary depends on history through per-block selection counters that reset at block boundaries.
      It is not a short fixed-window bounded-memory adversary in the policy-regret sense. If this database''s ''adversarial_bounded_memory''
      means a strictly bounded memory m that does not grow with T, or oblivious losses, the new result does not
