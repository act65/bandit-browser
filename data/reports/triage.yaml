      these bounds apply to the bounded_pm1 setting. The upper bound sqrt(KT log(K/δ)) matches the lower bound sqrt(T(K−1)
      log(1/(4δ)))/27 from Gerchinovitz & Lattimore 2016 up to a sqrt(log K) factor, and possibly constants. The
      K exponent is therefore tight at 1/2, and so is the T exponent. Only logarithmic factors in K remain open.


