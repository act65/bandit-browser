    verdict: closed
    summary: 'The gap is closed, and it was closed before the paper your database uses for the upper bound. In this
      setting (oblivious adversary, semi-bandit feedback, losses in [0,1]^d, every action a binary vector with exactly
      m ones), the minimax regret is Θ(√(mdT)), with no log factor.


      - **Upper bound:** Audibert, Bubeck & Lugosi, "Regret in Online Combinatorial Optimization" (arXiv 1204.4710;
      Math. of OR 2014; COLT 2011 precursor "Minimax Policies for Combinatorial Prediction Games", arXiv 1105.4871).
      Their Theorem 4 runs mirror descent with the INF potential ψ(x) = (−x)^(−q), q = 2, and gets R_n ≤ 2√(2mdn).
      I read this in the ar5iv HTML version of the paper.

      - **Lower bound:** the same paper gives Ω(√(mdn)), built from the √(dn) bound for the standard d-armed bandit.
      Your database''s Kveton et al. 2014 bound, min(Tm, √(Tdm))/20, already matches this order.

      - **Your database''s upper bound** (Neu 2015, FPL-TrIX, 13·m·√(Td(log(d/m)+1))) is loose in two ways. It has
      the extra log(d/m) factor, and it scales as m·√d rather than √(md), so it is off by an extra √m too. The same
      ABL paper''s negative-entropy version (Theorem 3) gives √(2mdn·log(d/m)), which still carries the log.


      Zimmert, Luo & Wei (ICML 2019, arXiv 1901.08779) also give a semi-bandit algorithm that works in both stochastic
      and adversarial settings. Their abstract says its leading constants are optimal in the previously studied
      worst-case sense, but I didn''t check the exact form of their adversarial bound.


      So in this regime the d-exponent is tight at 1/2 with no log gap, and the m-dependence is √m on both sides.'
