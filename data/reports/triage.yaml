  S-fb0ba473|regret|worst_case:
    verdict: closed
    summary: 'Under the usual stochastic linear bandit model (reward ⟨a,θ⟩ plus independent noise, unit-ball actions,
      θ in the unit l2 ball), the minimax rate is Θ(d√T) with no log T factor. This means the database entry has
      two problems.


      1. **The lower bound is too weak.** Rusmevichientong & Tsitsiklis (2010) and Lattimore & Szepesvári (Bandit
      Algorithms, Thm 24.2) prove Ω(d√T) on the unit ball. The second-hand search excerpts and the Zhang et al.
      paper both report this; I did not open those two sources myself. This is stronger than the √(dT) bounds recorded.


      2. **The upper bound is probably wrongly inherited.** The 3√(dT log T) bound comes from the adversarial bandit
      linear optimisation results (Bubeck–Cesa-Bianchi–Kakade 2012; Bubeck & Cesa-Bianchi 2012 survey). Those assume
      the observed loss is exactly ⟨a, z_t⟩. With additive noise the observation is not linear in a, so the reduction
      fails. If it held, it would contradict the Ω(d√T) lower bound.


      **Matching bounds.** Zhang, Hadiji & Combes (arXiv:2502.17175, 2025), which I fetched, gives both sides on
      ellipsoids, which include the unit ball:

      - **Lower bound (Thm 2.1):** regret ≥ min(σd√T/16, BT/4) for any parameter norm B.

      - **Upper bound (Thm 3.1, E2TC algorithm):** regret ≤ 6dσ√T + lower-order terms, giving O(min(σd√T + d‖θ‖,
      T‖θ‖)) (Cor. 3.1).

      - **Applied here:** with ‖θ‖ ≤ 1, bounded ±1 noise is 1-sub-Gaussian, so the upper bound is O(d√T). Their
      lower bound uses Gaussian noise. I expect the same construction to give Ω(d√T) for bounded noise (e.g. Rademacher/Bernoulli
      rewards), but I have not checked that.


      **Caveat.** If the database instead means the iid-loss-vector model (observe ⟨a, z_t⟩ with z_t iid in the
      unit ball, a special case of the adversarial model), then the √(dT log T) vs √(dT) gap is a different question,
      and I found no source closing it in this session. The ''bounded_pm1'' noise label points to the additive-noise
      model, so the verdict is closed at Θ(d√T). The database should fix both the upper bound (drop the adversarial
      inheritance) and the lower bound (raise it to d√T).'
    papers:
