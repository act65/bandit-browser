  S-6123da72|hp_regret|worst_case:
    verdict: closed
    summary: 'A recent preprint appears to close this gap by proving a stronger lower bound, rather than by improving
      the upper bound. The paper is arXiv:2608.12231 ("An Efficient Minimax-Optimal Algorithm for Adversarial m-Set
      Bandits", Bacchiocchi, Cesari & Colomboni; v2 dated 25 Aug 2026). Its Corollary 1 sets m=1 and d=K. It says
      there are universal constants c>0 and δ0∈(0,1) such that, for all δ≤δ0 and all T above a threshold polynomial
      in K and log(1/δ), every randomized policy faces some loss process that makes P(R_T ≥ c·sqrt(KT(log K + log(1/δ))))
      ≥ δ. The loss process is deterministic, adaptive and non-anticipating: ℓ_t may depend on the history through
      round t−1, which includes the learner''s current distribution p_t, but not on the draw X_t. This is the standard
      adaptive-adversary model, and our setting is the adaptive case. The bound matches the upper bound O(sqrt(KT
      log(K/δ))) from the database''s best_upper (bubeck2012survey Thm 3.2) and from Neu''s EXP3-IX, up to constants.
      The paper says explicitly that this closes the remaining sqrt(log K) gap left by Gerchinovitz & Lattimore,
      but only against adaptive adversaries. For oblivious adversaries the gap may still be open. Caveats: (i) the
      paper is an unreviewed 2026 preprint; (ii) δ0, c and the T threshold are not given numerically, so the bound
      covers only small enough δ and large enough T; (iii) I read only the abstract and the first ~100k characters
      of the HTML, not the proof.'
    papers:
    - title: An Efficient Minimax-Optimal Algorithm for Adversarial m-Set Bandits
      year: 2026
      arxiv_id: '2608.12231'
      claim: 'Theorem 2 / Corollary 1 (m=1, d=K): for δ≤δ0 and T≥poly(K, log 1/δ), every policy faces a deterministic
        adaptive non-anticipating loss process with P(R_T ≥ c·sqrt(KT(log K + log(1/δ)))) ≥ δ. This matches the
        O(sqrt(KT log(K/δ))) high-probability upper bound and, per the authors, closes the sqrt(log K) gap left
        by Gerchinovitz–Lattimore for adaptive adversaries.'
