      adversarial values. For adversarial values under GBB with one-bit or two-bit feedback, it gives Ω(T^{3/4})
      instead; its Θ̃(T^{2/3}) result is for independent values. So the semi-feedback lower bound is presumably
      in the body of CJLZ25 or follows from it, but I did not check this in the full text. I only have Jin''s abstract
      for the match.


