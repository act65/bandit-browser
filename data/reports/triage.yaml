      regret is Θ(√(KT) + √(dT log K)), and the extra √(log K) in the stated upper bound is removed. Caveats: the
      lower-bound form was taken from the arXiv HTML introduction of Zimmert and Seldin, not checked in the 2016
      paper itself (the arXiv PDF could not be read), and the tightness claim covers d ≤ T/log K.'
