  S-fea93b33|regret|worst_case:
    verdict: closed
    summary: 'The log K gap closes by combining published results. The database''s upper bound √(2KMT log K) comes
      from running Exp3 separately for each context (Bubeck & Cesa-Bianchi 2012, Theorem 4.1). Running a log-free
      bandit algorithm separately for each context instead gives O(√(K·T_s)) per context, and by Cauchy–Schwarz
      the sum is O(√(KMT)). Two such algorithms: INF (Audibert & Bubeck, COLT 2009 / JMLR 2010), which is minimax-optimal
      at O(√(KT)), and Tsallis-INF (Zimmert & Seldin), which also gets O(√(KT)) without needing T in advance; that
      matters because the number of rounds per context, T_s, is unknown. This matches the Ω(√(KT)) lower bound in
      K and T. A matching Ω(√(KMT)) lower bound should follow by splitting the rounds into M blocks, one per context,
      but I did not check a source for it. Caveat: I found no paper stating the contextual Θ(√(KMT)) bound directly;
      this is a reduction from per-context results, and the searches confirmed the O(√(KT)) order but not the exact
      constants.'
    papers:
    - title: Minimax Policies for Adversarial and Stochastic Bandits
      year: 2009
      arxiv_id: null
      claim: The INF algorithm (Audibert & Bubeck) achieves O(√(nK)) pseudo-regret for adversarial bandits, removing
        the extra log factor in Exp3's bound; a JMLR 2010 version states the same result.
    - title: 'Tsallis-INF: An Optimal Algorithm for Stochastic and Adversarial Bandits'
      year: 2018
      arxiv_id: '1807.07623'
      claim: Tsallis-INF (Zimmert & Seldin) achieves O(√(KT)) adversarial regret, within a constant factor of the
        minimax lower bound, without needing T in advance; running it separately for each context and applying Cauchy–Schwarz
        gives O(√(KMT)).
    - title: Regret Analysis of Stochastic and Nonstochastic Multi-armed Bandit Problems
      year: 2012
      arxiv_id: '1204.5721'
      claim: Source of the database's √(2KMT log K) upper bound (Exp3 run separately for each context, Theorem 4.1)
        and of the Ω(√(KT)) lower bound (Theorem 3.4).
    searches:
