      Lattimore (2016) give a lower bound of Ω(√(KT log(1/δ))), which, as Bacchiocchi et al. (2026) report, holds
      for a loss sequence fixed in advance (oblivious). Together these give Θ(√(KT log(1/δ))) in the oblivious setting.
      The database''s upper bound (Exp3.P/Exp3-IX style, √(KT log(K/δ))) is loose by √(log K) here. Caveat: I could
      not read the Audibert-Bubeck PDFs or Luo''s notes (the fetches returned unreadable compressed PDF data), so
      I did not see the original theorem statement or its conditions on δ; the upper bound rests on Nguyen & Mehta''s
      citation. Contrast: Bacchiocchi, Cesari & Colomboni (arXiv:2608.12231, Aug 2026) prove an Ω(√(dT(log C(d,m)+log(1/δ))))
      high-probability lower bound against adaptive non-anticipating adversaries; with m=1 this shows log K is unavoidable
