  S-179848cd|regret|worst_case:
    verdict: blank
    summary: 'No published result closes the gap and none calls it open, so the verdict is blank. The recorded bounds
      also look unreliable. The upper bound O(√(dT log³T)) is Ailon, Karnin & Joachims (2014), Corollary 3.2, which
      I read in full text: Doubler with CONFIDENCEBALL2 on a compact convex set. It is probably a slip: Dani et
      al.''s CONFIDENCEBALL2 bound is about d√T times polylog factors (a secondary source also gives O(d√T)). With
      Theorem 3.1 of the same paper (constant overhead for base algorithms with polynomial regret), the correct
      reading is about d√(T log³T). My own unpublished argument suggests the lower bound should be d√T, not √(dT).
      With a linear link, a standard bandit learner can simulate a duel (x, y) by playing x and y and drawing a
      coin with probability (1 + r_x − r_y)/2. Standard linear-bandit lower bounds on convex sets (Dani et al. 2008;
      also cited as d√T in the DP-Dueling paper, Remark 4) therefore carry over up to constants. The matching √(dT)
      results (Saha 2021; Bengs, Saha & Hüllermeier 2022) are for finite sets of K arms with a log K factor, so
      they don''t apply to convex bodies; Saha''s arXiv v2 also carries a ''wrong result… major revision required''
      comment. Doubler plus an O(d√T log T) base algorithm such as OFUL should give O(d√T log T). Against Ω(d√T)
      that leaves only a log T gap, and I found no paper closing it for dueling feedback on a convex body. These
      bounds are my combination of existing theorems; no paper states them for this setting. The arXiv PDFs came
      back unreadable through my tools, so I relied on a text copy of the ICML version and on abstracts.'
