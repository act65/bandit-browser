  S-f11b1a7e|regret|worst_case:
    verdict: open_known
    summary: 'The database''s best upper bound (Dani et al. 2008, d√T·log^1.5 T) is not the state of the art. OFUL
      (Abbasi-Yadkori et al. 2011) gets O(d√T log T); I saw this cited by 1904.00242 and 2502.17175, not in the
      paper itself. Bubeck, Cesa-Bianchi & Kakade (2012) get order d√(T log T) for any compact action set. Their
      result is adversarial but applies here because rewards are bounded. They say that without further assumptions
      it is minimax optimal ''up to a logarithmic factor''; I saw this in a search snippet, not the paper. The lower
      bound is still Ω(d√T) (Dani et al. 2008; Rusmevichientong & Tsitsiklis 2010 for the unit ball). Li, Wang &
      Zhou (2019) prove Ω(d√(T log T)), but only for infinite action sets that change over time, so it does not
      cover a fixed compact set. For ellipsoids, arXiv 2502.17175 gets d√T with no log factor, but makes no claim
      for general compact sets. So a √(log T) gap remains for fixed arbitrary compact sets. The literature describes
      the rate as known only up to log factors (e.g. Θ̃(d√T) in 2608.14319), but I found no explicit statement that
      removing the last √(log T) is an open problem. A fixed-set d√(T log T) lower bound could exist that my searches
      missed. I did not check the Lattimore–Szepesvári book directly. Recommendation: raise the upper bound to d√(T
      log T); the remaining gap is √(log T) in T and none in d.'
    papers:
    - title: Towards minimax policies for online linear optimization with bandit feedback (Bubeck, Cesa-Bianchi,
        Kakade)
      year: 2012
      arxiv_id: '1202.3079'
      claim: Regret of order d√(n log n) for any compact action set (adversarial, so it also covers the bounded
        stochastic case). The authors say it is minimax optimal up to a logarithmic factor without further assumptions
        on the action set. Seen in a search snippet, not the paper itself.
    - title: Improved Algorithms for Linear Stochastic Bandits (Abbasi-Yadkori, Pál, Szepesvári)
      year: 2011
      arxiv_id: null
      claim: OFUL achieves O(d√T log T) regret, as cited by 1904.00242 and 2502.17175; not checked in the paper
        itself.
    - title: Nearly Minimax-Optimal Regret for Linearly Parameterized Bandits (Li, Wang, Zhou)
      year: 2019
      arxiv_id: '1904.00242'
      claim: Ω(d√(T log T)) lower bound, but only when the infinite action set changes over time. The standard fixed-action-set
        lower bound is Ω(d√T).
    - title: 'Linear Bandits on Ellipsoids: Minimax Optimal Algorithms'
