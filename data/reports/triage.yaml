  S-e7825ea7|regret|worst_case:
    verdict: closed
    summary: 'The gap exists only because the database''s best upper bounds are plain bandit bounds (Tsallis-INF,
      about sqrt(KT)), which ignore the feedback graph. The literature already has upper bounds that scale with
      the independence number alpha. That matches the existing Omega(sqrt(alpha T)) lower bound up to log factors,
      so the K-dependence gap is closed.


      - **Kocák, Neu, Valko & Munos (NeurIPS 2014), Exp3-IX:** handles an adversarially chosen sequence of directed
      observation systems and does not need to see the graph before acting. Its regret is near-optimal, about sqrt(alpha
      T) up to logs.

      - **Alon et al. (SIAM J. Comput. 2017, arXiv 1409.8428):** Exp3-DOM / Exp3-SET bound regret in terms of graph
      properties (independence number or dominating set) for time-varying graphs.

      - **Eldowa, Esposito, Cesari & Cesa-Bianchi (NeurIPS 2023, arXiv 2305.15383):** proves an upper bound of O(sqrt(alpha
      T (1 + ln(K/alpha)))) for strongly observable undirected graphs using q-Tsallis FTRL. It extends to time-varying
      graphs without needing to know their independence numbers in advance. They also prove a lower bound of Omega(sqrt(alpha
      T ln K / ln alpha)) for alpha > 1, which pins the minimax rate down to log factors.


      So the polynomial K-gap (upper exponent 0.5 vs. lower 0) disappears once the upper bound is stated in terms
      of alpha ≤ K: both sides are sqrt(alpha T) up to logs. Only a small log-factor gap remains, in the regime
      1 < alpha < K.


      Caveats:

      - I did not check whether these upper bounds are stated for adaptive adversaries or only for oblivious ones
      / pseudo-regret.

      - The Eldowa et al. result is for undirected graphs. For directed strongly observable graphs, the bounds carry
      extra log factors.

      - For Kocák et al. and Alon et al., the regret rates above come from abstracts and search summaries. I did
      not open either paper or check exact theorem statements.'
