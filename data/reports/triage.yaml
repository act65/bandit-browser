  S-f6b9bacf|regret|worst_case:
    verdict: closed
    summary: 'The polynomial gap in K (upper K^{3/4} vs lower K^{1/2}) is closed up to log factors. The database''s
      upper bound looks like Jin''s linear-bandit result (arXiv:2609.15170) applied with d=K, which is loose for
      the K-armed case. K arms with stochastic rewards and changing action sets is the stochastic sleeping-bandit
      problem, with regret measured against the best available arm (equivalently the best ordering). UCB on the
      available arms gets O(sqrt(KT log T)) by the standard confidence-width sum, even when availability is adversarial,
      so it covers stochastic availability too (this argument is my own reasoning). A search snippet credits Kleinberg
      et al. (COLT 2008 / MLJ 2010) with an Õ(sqrt(TK log T)) bound for stochastic rewards, but I could not open
      that paper (certificate error / 403). I did read Huang, Hu & Pan (arXiv:2605.09277, INFOCOM 2026): under adversarially
      varying availability, CL-SG gets regret <= C ln T sqrt(mNT) + 2 sqrt(6 mNT ln T), and they cite earlier sqrt(mNT
      ln T) UCB bounds for stochastic and adversarial availability. With m=1 this gives O(sqrt(KT) log T). Caveats:
      their lower-bound construction needs N >= 400m, and I did not confirm their reward assumptions (bounded vs
      subgaussian). The lower bound Omega(sqrt(KT)) already holds when every arm is always available (wu2015online).
      So the minimax rate is Theta~(sqrt(KT)), and only a log T factor remains open.'
