      Cohen–Hazan–Koren (2017) and Ito et al. (2019) prove Θ(√(k³dT)) lower bounds for 0/1 combinatorial bandits
      including 'bandit ranking'. Ito et al. say their ranking result answers an open problem raised by Cohen et
      al.; per a search summary (unverified) that problem concerned full permutations, possibly asking whether the
      rate is Θ(n²√T). These results use the 0/1 permutation-matrix (assignment) representation with d = n², k =
      n and losses in [0,1]^d, not the permutahedron with d = n, so they don't carry over. PDF fetches returned
      unreadable compressed data, so I couldn't check Theorem 4's loss assumptions (e.g. whether it uses the ℓ1
