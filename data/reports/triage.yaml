  S-73d16afe|regret|worst_case:
    verdict: closed
    summary: 'Closed at Θ(√(KT)), on one reading of the setting. The bounds in the database don''t use the best
      available results. The setting lists no corruption level C (parameters is empty), so I treated the problem
      as worst case over C. If C is unbounded, the minimum gap Δ stops restricting the adversary. Any environment
      satisfies Reg ≥ Σ Δ_i E[N_i] − C once C ≥ ΔT, whatever Δ is.


      - **Upper bound:** Tsallis-INF (Zimmert & Seldin, JMLR 2021, arXiv 1807.07623) gets O(√(KT)) in the adversarial
      regime, with no log K factor. It also gets O(Σ log T/Δ_i) in the self-bounding regime. Audibert & Bubeck''s
      INF/MOSS family also removes the √log K factor. This is from what I know already, not from a source I opened
      this session.

      - **Lower bound:** Auer, Cesa-Bianchi, Freund & Schapire (SIAM J. Comput. 2002) prove a matching Ω(√(KT))
      minimax bound. Their hard instance is stochastic, so it lies inside the adversarial self-bounding class. The
      database''s lower bound min(K/Δ, ΔT) already reaches √(KT) when Δ = √(K/T). When C is unbounded, the Auer
      et al. instance still applies at any Δ.


      So the √log K in the database''s upper bound is extra, and the stored per-variable exponents for Δ and T are
      not tight in this worst-case-over-C reading.


      **Caveat:** if C is meant to be a fixed parameter, the right comparison changes. That rate is O(K log T/Δ
      + √(C·K log T/Δ)) from Masoudian & Seldin, COLT 2021 (arXiv 2103.12487). With C = 0 it is matched by the Ω(K
      log T/Δ) stochastic lower bound. Whether the √C term is tight was not checked here.


      **Sources checked:** I saw search results for Tsallis-INF and its improved analysis, and for the 2002 paper''s
      matching lower bound. I did not open any of the full texts, so the proofs and exact constants are unchecked.'
