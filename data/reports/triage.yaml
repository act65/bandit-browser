      none that calls it open. The literature does, however, narrow the gap well beyond what the database records.


      (1) Upper bound. Li, Wang & Zhou (COLT 2019, arXiv:1904.00242) give a Variable-Confidence-Level SupLinUCB
      algorithm for finite-action linear contextual bandits (n ≤ 2^{d/2} actions per round). Its regret matches
      their lower bound of Ω(√(dT log T log n)) up to iterated-logarithm factors, so the upper bound is about √(dT
      log T log K)·polyloglog. Action sets in that analysis may be chosen arbitrarily, so the upper bound should
      also cover stochastic contexts. It is much tighter than the database''s best upper bound, √(Td)·log(2Td)·min(√d,
      (d log K)^{1/4}), from jin2026nearly.


      (2) Lower bound. Li et al.''s Ω(√(dT log T log K)) is built from "delicately constructed adversarial sequences"
      of action sets, according to the abstract. It is therefore unclear whether it holds when contexts are i.i.d.
      Ito (NeurIPS 2024) proves an O(√(dT log(K·min{1, S/d}))) upper bound with a matching lower bound for contextual
      linear bandits, where S is the size of the context space. For S ≥ d this gives Θ(√(dT log K)). That improves
      the database''s √(dT) lower bound by a √(log K) factor, if Ito''s setting fits this one. I believe Ito''s
      model uses i.i.d. contexts, possibly with adversarial losses, but I could not confirm this: the PDF did not
      extract and the abstracts don''t describe how contexts are generated.


      Net result: the remaining gap is at most about √(log T)·polyloglog between √(dT log K) and √(dT log T log
      K), not the log^{3/4} T gap the database shows. Whether the extra √(log T) is needed under i.i.d. contexts
      was not settled by any paper I found. Tool note: the Ito PDF fetch returned unreadable binary, so this verdict
