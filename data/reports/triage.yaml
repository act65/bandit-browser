  S-0e1ac51c|regret|worst_case:
    verdict: closed
    summary: 'I''m treating the gap as closed: worst-case regret here is Θ(√(KT)), up to constants.


      **Upper bound:** Tsallis-INF (Zimmert & Seldin) has an O(√(KT)) guarantee against any adversary, and the corrupted
      stochastic setting is a special case of that. Your database already lists this as 4√(KT)+1. My search confirmed
      the paper and its result up to constants, but not the exact constant 4.


      **Lower bound:** The database''s lower bound is Ω(C), which says nothing about how regret scales with K or
      T. But the class of corrupted instances includes the uncorrupted ones (C=0). So the classical minimax lower
      bound Ω(√(KT)) for K-armed stochastic bandits applies directly, as given by Auer, Cesa-Bianchi, Freund & Schapire
      (SIAM J. Comput. 2002).


      **Unique optimal arm:** I''m relying on the standard construction of that lower bound, from memory rather
      than from a page I opened. In it, one arm has mean 1/2+ε and the rest have mean 1/2, so there is exactly one
      optimal arm and the extra assumption doesn''t weaken the bound. I did not confirm the construction or its
      constant in this session; the search only showed the paper''s abstract stating a matching Ω(√T)-rate lower
      bound.


      **Result:** Both K and T have exponent 1/2 in the upper and lower bounds. Combined with Gupta et al.''s Ω(C),
      the worst-case rate is Θ(√(KT) + C). It''s on the order of √(KT) when regret is measured as in the adversarial-regime
      analysis, which is how the C-free upper bound is stated.


      **Caveat:** I couldn''t find a single paper that states this exact corrupted, unique-optimal-arm worst-case
      result. The verdict comes from putting together the classical results above.'
    papers:
    - title: The Nonstochastic Multiarmed Bandit Problem (Auer, Cesa-Bianchi, Freund, Schapire), SIAM J. Computing
        32:48-77
      year: 2002
      arxiv_id: null
      claim: The abstract states a matching lower bound showing the O(T^{-1/2}) per-round rate (i.e., Θ(√(KT)) regret)
