      abstract claims the price of bandit information is at least sqrt(n), which against sqrt(nT) full-information
      regret means Omega(n sqrt T) bandit regret. I could not read their PDF, so their exact theorem, decision set
      and constant are unverified; that the construction is the bounded-loss cube comes from the 2012 paper''s citation.
      Shamir (2015), Theorem 6, gives c(d-1)sqrt(T) on [-1,1]^d for T >= d^4/4 with stochastic losses whose mean
      lies in the l1 ball and whose tails are sub-Gaussian, not bounded by 1. So the d-exponent gap (1 vs 0.5) closes
      at Theta(d sqrt T); the database is missing the Omega(d sqrt T) lower bound.'
