      order √(dT) come from multi-armed-bandit results (Auer et al. 2002 and the 2012 Bubeck survey) and are not
      tight for linear bandits on convex bodies.


      **Lower bound.** Shamir, "On the Complexity of Bandit Linear Optimization" (arXiv:1408.2368), proves an Ω(d√T)
      lower bound on the hypercube for T ≥ d⁴/4. The hypercube is itself a convex body. I saw this claim, quoted
      from the full text, in a search-result summary. The abstract I fetched only says that "the price of bandit
      information … can be as large as d". Shamir also notes that this matches an O(d√T) upper bound that plays
      only the corners of the hypercube. Dani, Hayes and Kakade (COLT 2008) had earlier given lower bounds of order
      d√T for stochastic linear bandits, and a stochastic lower bound also applies against an oblivious adversary.
      One caveat: I did not check that Shamir''s loss class is exactly the polar of the action set with ±1-bounded
      noise.


      **Upper bound.** For general convex bodies the best upper bound is O(d√(T log T)). That is Hazan & Karnin''s
      volumetric spanners (the database''s source), and Zimmert & Lattimore (COLT 2022) get the same rate against
      adaptive adversaries.


      **What remains.** So the worst-case rate over convex bodies is d√T up to a √log T factor. In the database''s
      terms: the d exponent is settled at 1, and the T dependence is pinned up to √log T.


      **Is the √log T gap open?** I found no source that removes it for general convex bodies, and none that states
      explicitly that it is open. Banerjee & Gopalan (arXiv:2301.03597) say that characterizing minimax regret across
      action spaces had been open, and they give an "optimal" lower bound for a wide class of convex action sets.
      I only saw their abstract, so I could not check their exact rate, whether it is stochastic or adversarial,
      or what they say about log factors.'
