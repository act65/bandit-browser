  S-70f9e0be|regret|worst_case:
    verdict: closed
    summary: 'Closed up to logarithmic factors. The gap comes from the database''s lower bound being too weak. Agarwal
      et al. (AISTATS 2012, arXiv:1202.1334), Theorem 5.1: for every N, K with ln N/ln K ≤ T and every algorithm,
      there is a policy class with |F| ≤ N and a fixed distribution D(x, r) over contexts and rewards, drawn i.i.d.,
      under which regret is Ω(√(KT ln N/ln K)). The instance even satisfies realizability. The proof averages over
      random instances; a lower bound shown this way still holds when the learner is told each instance''s context
      distribution. This matches the upper bound √(KT log(N T/δ)) from Dudík et al. 2011 up to logs in K and T,
      so the minimax rate is Θ̃(√(KT)). The extra √log T in the upper bound comes from the high-probability analysis
      with δ = 1/T. Exp4-type algorithms give O(√(KT ln N)) expected regret with no log T. Kale (2014) is cited,
      though I only saw the citation, for O(√(KT ln(N/K))). Only a log-factor question remains: ln N/ln K versus
      ln(N/K) in the stochastic case. Chase, Ito and Mehalel (2025) prove the tight Θ(√(KT log(N/K))) only against
      an adaptive adversary and leave even the oblivious case as a conjecture. No paper I found states the stochastic
      log-factor question as open.'
    papers:
    - title: Contextual Bandit Learning with Predictable Rewards
      year: 2012
      arxiv_id: '1202.1334'
      claim: 'Theorem 5.1: for all N, K with ln N/ln K <= T, every algorithm suffers expected regret Omega(sqrt(KT
        ln N / ln K)) on some policy class with |F| <= N and some fixed distribution D(x, r), drawn i.i.d., even
        under realizability. The proof averages over random instances (F, D).'
