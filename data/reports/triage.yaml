    verdict: closed
    summary: 'The gap is closed up to logarithmic factors. It looks wide only because the database is missing two
      pieces: the standard minimax lower bound for uncorrupted linear bandits, and the corruption term in the upper
      bound.


      Upper bound: an adversarial linear-bandit algorithm (Exp3 / GeometricHedge with John''s exploration) run on
      the corrupted rewards gets regret O(sqrt(dT log K)). Converting back to the uncorrupted rewards adds at most
      2C, so regret is O(sqrt(dT log K) + C). The database entry 2*sqrt(3)*sqrt(T d log K) leaves out this +O(C)
