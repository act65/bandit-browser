    verdict: closed
    summary: 'The log gap is closed by Zimmert, Luo & Wei (ICML 2019, arXiv:1901.08779). Their Theorem 1 holds for
      any action set X ⊆ {0,1}^d with losses in [-1,1]^d, so it covers i.i.d. Bernoulli rewards. It gives adversarial
      pseudo-regret O(C_adv·√T), and with γ=1 the paper states C_adv = O(√(md)) with m = max‖x‖₁. I also checked
      this from the definitions: by Cauchy–Schwarz the sum of √x_i over coordinates outside the best action is at
      most √(dm), and the other term is O(m). This gives O(√(mdT)) with no √log(d/m) factor. It matches the Ω(√(mdT))
      lower bounds of Kveton et al. 2014 (Prop. 2) and Audibert–Bubeck–Lugosi 2014. The 2025 FTPL paper (arXiv:2506.12490)
      also says O(√(mdT)) is achieved by OSMD and Zimmert et al.''s FTRL, matching the lower bound. Caveat: the
      theorem formula came from a garbled HTML rendering, and the paper does not spell out ''general sets, no log''
      verbatim; the O(√(md)) bound on C_adv is the paper''s statement plus my own check.'
