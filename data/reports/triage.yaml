  S-a0beb0bf|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed up to iterated-log factors, and the paper that closes it is the one the database
      already takes its lower bound from: Li, Wang & Zhou (COLT 2019, arXiv:1904.00242).


      **Setting.** Linear contextual bandits with adversarial, time-varying finite action sets of size n.


      **Lower bound.** The paper proves Ω(√(dT log T log n)) for n ≤ 2^{d/2}, valid when T ≥ d(log₂ n)^{1+ε}. Taking
      n = 2^{d/2} recovers the database''s Ω(d√(T log T)); that substitution is my own inference, the paper does
      not state it.


      **Upper bound.** The same paper''s Variable-Confidence-Level (VCL) SupLinUCB algorithm "matches the lower
      bound up to iterated logarithmic factors". That gives O(√(dT log T log n)·poly(log log T)), which saves two
      √log T factors over earlier SupLinUCB analyses. The database instead lists LinTS (Agrawal & Goyal 2013), which
      is much looser.


      **What remains open.** Only a poly(log log T) gap. If the database insists on exact log tightness, "open_known
      (log log gap)" would be the stricter label.


      **Caveats.**

      - I read only the abstract and search summaries, not the paper''s theorem statements. The explicit form √(dT
      log T log n)·poly(log log T) is inferred from the abstract''s "matches the lower bound up to iterated logarithmic
      factors" and a talk abstract by Yuan Zhou.

      - I didn''t check whether the upper bound''s analysis needs any extra assumption beyond this setting, e.g.
      knowing σ.


      Sources: https://arxiv.org/abs/1904.00242 ; https://proceedings.mlr.press/v99/li19b.html ; https://itcs.sufe.edu.cn/41/5b/c10453a213339/page.htm'
    papers:
    - title: Nearly Minimax-Optimal Regret for Linearly Parameterized Bandits
      year: 2019
      arxiv_id: '1904.00242'
      claim: Lower bound Ω(√(dT log T log n)) for finite time-varying action sets (n ≤ 2^{d/2}). The VCL SupLinUCB
        algorithm matches this lower bound up to iterated-logarithmic factors, saving two √log T factors over previous
        analyses. For infinite action sets, a talk abstract gives O(√(d²T log T)·poly(log log T)) against a lower
        bound of Ω(√(d²T log T)).
