  S-bd6f094c|regret|worst_case:
    verdict: blank
    summary: 'Setting: stochastic K-armed bandits where the set of available arms changes over time and may be chosen
      adversarially (stochastic sleeping bandits). The benchmark is the best available arm in each round, which
      is the same as the best fixed ordering of the arms.


      **What is established**

      - Lower bound: Ω(√(KT)). Gaillard–Saha–Dan (AISTATS 2023) and Saha–Gaillard–Valko (ICML 2020) both cite this
      rate for the stochastic-reward, adversarial-availability case.

      - Upper bound: I found no paper that achieves √(KT) here without a log factor. I also found no paper that
      states the log gap as an open problem.


      **Database upper bound can be improved (my own argument, not a citation)**

      Plain UCB, restricted to the arms available in each round, appears to give O(√(KT log T)):

      - On the event that all confidence bounds hold, the per-round regret is at most UCB(a_t) − μ(a_t) ≤ 2√(2 log
      T / n_{a_t}).

      - Summing over each arm''s pull counts gives O(√(KT log T)).


      This is tighter than the database''s best upper bound, which carries a log^{3/4}·(log)^{1/2} factor. If it
      holds, the remaining gap is √(log T).


      **What I could not verify**

      - Whether MOSS-style techniques remove the last √log T factor when availability is adversarial. No source
      I saw addressed this.

      - The exact stochastic bounds in Kleinberg–Niculescu-Mizil–Sharma (COLT 2008 / MLJ 2010). Fetching the PDF
      failed (certificate rejected), and the page I could open had no abstract. A separate listing quoted the abstract
      as claiming bounds that are optimal "up to a constant or a sub-logarithmic factor", but I didn''t see the
      specific theorems.


      **Verdict: blank.** I found no paper that closes the gap and none that explicitly calls it open.'
    papers:
    - title: Regret Bounds for Sleeping Experts and Bandits
      year: 2010
      arxiv_id: null
      claim: Kleinberg, Niculescu-Mizil, Sharma (COLT 2008 / Machine Learning 2010). Covers stochastic and adversarial
        rewards with time-varying action sets against the best-ordering benchmark. Per the abstract (via search
        snippet), its bounds are almost information-theoretically optimal, up to a constant or sub-logarithmic factor.
        I did not see the exact theorems.
