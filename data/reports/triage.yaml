      page does not state whether contexts are adversarial; that is assumed from the SupLinUCB line of work. If
      the NTK/neural model is meant literally, I found no neural-specific minimax lower bound. Known neural upper
      bounds are d̃·sqrt(T) for NeuralUCB/NeuralTS, which a 2024 ICLR paper argues can be linear in the worst case,
