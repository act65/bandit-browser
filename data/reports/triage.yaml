  S-86f54b23|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed up to logarithmic factors. Our database''s upper bounds are √(KT)-type rates borrowed
      from plain bandit algorithms. Those rates ignore the graph, which is why there is a polynomial gap in K against
      the Ω(√(α T)) lower bound.


      Alon, Cesa-Bianchi, Dekel & Koren (COLT 2015, arXiv 1502.07617) show that minimax regret is Θ̃(√(α T)) for
      strongly observable feedback graphs, directed ones included. The adversary may choose a sequence of graphs
      G_1..G_T, and the paper covers both the informed setting and the uninformed one, where G_t is revealed only
      after the action is played. According to the search summary, the paper says its algorithm (Exp3.G) carries
      over to these time-varying settings "with only a few cosmetic modifications". In that case α becomes the average
      of the per-round independence numbers α_t. That matches the lower bound up to log factors.


      Two earlier results also apply in the uninformed setting:

      - Exp3-SET (Alon et al. 2013, and the journal version arXiv 1409.8428) is near-optimal in the uninformed setting
      for symmetric (undirected) graphs.

      - For undirected graphs, Eldowa, Esposito, Cesari & Cesa-Bianchi (NeurIPS 2023, arXiv 2305.15383) sharpen
      the upper bound to O(√(αT(1+ln(K/α)))). Their abstract says the method extends to time-varying graphs without
      knowing the independence numbers in advance. They also prove a lower bound of Ω(√(αT ln K / ln α)) for α >
      1.


      What remains open is only the exact logarithmic factor. Even that is settled for undirected graphs in fixed-graph
      or informed-type settings. The polynomial dependence on K versus α is resolved.


      Caveat: I checked the theorem statements only through search-result summaries, not the full texts. That includes
      the exact uninformed, adaptive-adversary bound for directed graphs.'
