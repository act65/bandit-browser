  S-4db9db5f|regret|worst_case:
    verdict: closed
    summary: 'I think the gap is closed at Θ̃(T^{2/3}), but this rests on reading the database''s setting as fixed-price
      bilateral trade (selling at a posted price, where only part of the outcome is observed). The setting key is
      vague, so that reading is my inference.


      **Where the two bounds come from.** The upper bound in your database comes from jin2026tight. That is Yaonan
      Jin, "Tight Regret Bounds for Bilateral Trade under Semi Feedback" (arXiv:2601.16412, 2026). It gives an Õ(T^{2/3})
      mechanism for budget-balanced fixed-price bilateral trade under semi feedback. Its abstract states this for
      *adversarial* values. Your stochastic i.i.d. cell probably inherited the bound because an adversarial upper
      bound also holds for i.i.d. values. The log(T) lower bound comes from Weed et al. 2015 on repeated auctions,
      which is a different problem. Its log T rate is a per-instance (margin-type) bound, so it is far from the
      true worst-case rate here.


      **Lower bounds that close the gap.** Both papers below have stochastic, partial-feedback, continuum-of-prices
      lower bounds of order T^{2/3}:

      - Cesa-Bianchi, Cesari, Colomboni, Fusco, Leonardi, "A Regret Analysis of Bilateral Trade" (arXiv:2102.08754).
      With realistic (posted-price) feedback and independent i.i.d. valuations with bounded densities, it reports
      Θ̃(T^{2/3}). The table of contents lists a section on the T^{2/3} lower bound under realistic feedback.

      - Chen, Jin, Lu, Zhang, "Tight Regret Bounds for Fixed-Price Bilateral Trade" (arXiv:2504.04349, ICALP 2026).
      With independent values it reports a tight Θ̃(T^{2/3}) bound for budget-balanced mechanisms under one-bit
      and two-bit feedback. Jin 2026 cites this paper as the source of its matching Ω(T^{2/3}) lower bound.


      Both lower bounds come from a subclass of i.i.d. problems, so they also apply to the broader stochastic class.
      That gives a worst-case lower bound of Ω(T^{2/3}), which matches the inherited Õ(T^{2/3}) upper bound up to
      log factors.


      **Caveats.**

      - I have not checked that Jin''s semi-feedback model and the feedback model in the lower-bound papers are
      exactly the same. CJLZ25''s one-/two-bit feedback is probably the same or a closely related model.

      - If the setting is read as completely general stochastic partial monitoring over a continuum with only bounded
