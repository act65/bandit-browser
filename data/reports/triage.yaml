  S-5653b986|regret|worst_case:
    verdict: open_known
    summary: 'The T-dependence gap is mostly an artifact of how the database states its upper bounds. Its entries
      are high-probability bounds with delta=1/T, which brings in log(NT). Bounds on expected regret avoid this.
      Kale (2014) gives O(sqrt(KT log(N/K))), which Chase, Ito & Mehalel cite as the matching upper bound. That
      bound is proved for non-stochastic expert advice, so it should also hold when contexts are i.i.d., which is
      a special case.


      The K-dependence gap is the real one. The lower bound is sqrt(KT log N / log K), from Agarwal et al. 2012
      and Seldin & Lugosi. The upper bound is sqrt(KT log(N/K)). Recent work closed this gap, but only outside the
      stochastic-context setting:

      - Cesa-Bianchi, Eldowa, Esposito & Olkhovskaya (arXiv 2406.16802) prove Omega(sqrt(KT ln(N/K))), but only
      under a restricted feedback model.

      - Ito (NeurIPS 2024) proves the same lower bound for a different protocol, where the player commits to an
      expert before seeing the advice.

      - Chase, Ito & Mehalel (arXiv 2511.00257, COLT 2026) settle the minimax rate for the standard non-stochastic
      problem at Theta(sqrt(TK log(N/K))). Their hard instance uses an adaptive adversary: advice for a batch of
      arms is redrawn only after the learner pulls an arm from that batch, so advice is not i.i.d. across rounds.
      The authors only conjecture that the bound also holds against an oblivious adversary.


      None of these lower bounds covers stochastic i.i.d. contexts with i.i.d. rewards, which is the setting asked
      about. I found no paper that removes the 1/log K factor there. The authors'' stated conjecture marks the oblivious
      case, and by extension the stochastic case, as open.


      One caveat: the Ito NeurIPS 2024 PDF did not render, so I could not check its hard instance directly. What
      I report about it comes from the abstract and search snippets.'
