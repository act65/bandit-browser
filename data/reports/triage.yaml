    verdict: blank
    summary: 'The bounds in this cell come from static adversarial linear bandits on the unit ℓ2 ball. They do not
      depend on the number of switches. The question is whether the √log T gap between the Θ(√(dT)) lower bound
      and the O(√(dT log T)) upper bound has been closed. I found no paper that closes it and no paper that explicitly
      calls it an open problem.


      - **Lower bound, Jacobsen–Baudry–Ito–Cesa-Bianchi (arXiv:2603.28201, 2026):** They prove the "folklore Θ̃(√(dT))"
      minimax rate on the Euclidean ball. Their lower bound (Thm 5.2) carries a factor √(d/(d∨log T)), so it is
      only Ω(√(dT)) when d ≳ log T. For the upper bound they cite Bubeck et al. 2012 as Õ(√(dT)), with the logs
      hidden. They do not say whether removing the log is open.

      - **Upper bound, Bubeck–Cohen–Li (arXiv:1711.01037, AISTATS 2018), Theorem 3:** On ℓp balls with p∈(1,2] they
      get R_T ≤ 2^{6/(p−1)}√(nT log T). This keeps the √log T and, at p=2, gives the same rate as Bubeck et al.
      2012, so it does not close the gap.

      - **FTPL papers (Lévy et al. COLT 2026, arXiv:2510.24187; arXiv:2610.17818):** Their bounds on the ball are
      only O(d√(T log T)), worse than the bound already in the database.


      The gap appears unresolved, but I found no explicit "open problem" statement, so the verdict is blank.'
