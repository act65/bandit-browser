  S-d66b7845|regret|instance_dependent:
    verdict: closed
    summary: 'Closed in the worst-case-over-instances sense. Theorem 8 of Bubeck, Perchet and Rigollet (COLT 2013,
      arXiv:1302.1611), read from a text version of the arXiv PDF fetched through the r.jina.ai proxy, covers two
      arms, unit-variance Gaussians and a learner that knows only mu*. Instances: nu0 = N(0,1) x N(-1,1) and nu_Delta
      = N(-Delta,1) x N(0,1) for Delta in (0,1], so mu* = 0 throughout. Statement: for any policy and any n, max(R_n(nu0),
      sup_Delta Delta*R_n(nu_Delta)) >= (1/2) log(n/139). The paper reads this as ''regret of order log(n)/Delta
      is unavoidable for some Delta when only mu* is known''. My own step, not stated in the paper: since R_n(nu_Delta)
      <= n*Delta, the Delta attaining the sup has n*Delta^2 >~ log n, so log n ~ log(1/Delta). Hence no uniform
      guarantee of order C/Delta, or o(log(1/Delta))/Delta, is possible, and the log(1/Delta)/Delta upper bound
      (Garivier, Menard and Stoltz 2019, Theorem C.1, taken from the database; I could not read that PDF) is order-optimal
      in Delta. A per-instance log(1/Delta)/Delta lower bound cannot hold, because an algorithm tuned to one Delta
      gets order 1/Delta there, so the per-instance 1/(4 Delta) from Theorem 5 (where Delta is also known) remains
      correct. The K ''poly_gap'' is a bookkeeping artefact since K = 2 is fixed. Several fetches failed: the raw
      arXiv PDFs of 1302.1611 (v1, v2) and 1602.07182 and the PMLR PDF would not extract, and sbubeck.com refused
      the connection. The r.jina.ai text version of 1302.1611 worked.'
