  S-bc618b70|regret|worst_case:
    verdict: open_known
    summary: 'For a fixed, arbitrary compact action set in a stochastic linear bandit, the gap is not closed, but
      it is smaller than the database says. The database upper bound (Dani et al. 2008, about d√T·log^1.5 T) has
      been improved. Bubeck, Cesa-Bianchi & Kakade (COLT 2012) give O(d√(T log T)) for any compact action set and
      call it "minimax optimal up to a logarithmic factor." Their setting is adversarial with losses bounded by
      1; applying it to bounded ±1 stochastic noise is my inference (bounded observed rewards, unbiased loss estimates),
      not something the paper states. The best lower bound for a fixed set is still Ω(d√T): Dani et al., Rusmevichientong–Tsitsiklis
      for the unit ball, and Banerjee–Gopalan 2023 for ℓp balls. Banerjee–Gopalan describe characterising minimax
      regret across action spaces as an open problem from Lattimore–Szepesvári (2020) and leave general convex bodies
      as a conjecture; I did not open the book''s notes to check the wording. Partial results that do not close
      the gap: Li–Wang–Zhou (2019) prove Ω(d√(T log T)) only when an adversary picks a different action set each
      round (Gaussian noise), so it does not cover a fixed set. Zhang–Hadiji–Combes (2025) get Θ(d√T) only for ellipsoids.
      Wei (2026) gives Õ(d√T) for general sets, but the hidden log factors are not stated on the abstract page.
      Lattimore (COLT 2023) shows adaptive-regression concentration bounds cannot be tightened in general (proved
      in continuous time), which suggests confidence-ellipsoid methods cannot drop the log. The remaining gap is
      about √log T and still appears open.'
    papers:
