    summary: 'I found no published result that closes the gap for an arbitrary fixed convex body. What I could verify:


      **Upper bound.** The best upper bound in your database is about d·√T·log^1.5 T, taken from Dani et al. 2008.
      The literature does better: an order-d√(T log T) bound for any compact action set. This comes from Bubeck,
      Cesa-Bianchi & Kakade (COLT 2012) for adversarial losses bounded by 1, and the abstract says it is "minimax
      optimal up to a logarithmic factor". In the stochastic setting, discretising the body and running a finite-arm
      optimal-design method (phased elimination with a G-optimal design, from the Lattimore–Szepesvári book) gives
      the same rate. I did not check that page in this session.


      **Lower bound.** The lower bound of order d√T is classical. Searches show it attributed to Rusmevichientong
      & Tsitsiklis for the unit ball and to Lattimore–Szepesvári more generally; I did not open those sources myself.


      **What remains.** The real gap is a factor of √log T between d√T and d√(T log T), not log^1.5 T.


      **Special cases that are closed:**

      - Ellipsoids, including the unit ball: Zhang, Hadiji & Combes (arXiv 2502.17175, 2025) prove Θ(dσ√T) up to
      a universal constant, with no log factors.

      - Hypercube: Bubeck et al. 2012 give an efficient algorithm with regret of order d√T. That result is adversarial,
      and I saw it only in a secondary summary, not in the paper.


      **Arbitrary convex bodies.** Recent papers still state their general-action-set bounds with log factors. Examples
      are OLSOFUL (Nearly Minimax-Optimal Regret for Linearly Parameterized Bandits, arXiv 1904.00242) and an FTPL
      paper, arXiv 2610.17818, whose bound I saw only in a search summary. I found no matching d√T upper bound or
      ω(d√T) lower bound for this case.


      **Caveat on the verdict.** "open_known" here means the log gap is acknowledged and appears unresolved. I did
      not find an explicit statement calling it an open problem.'
