  S-6f91cbd3|hp_regret|worst_case:
    verdict: closed
    summary: 'The polynomial gap in K has been closed for a long time. The database''s upper bound, inherited from
      Lee et al. 2020 (Theorem 3.1), grows like K^2.5. That is very loose for plain K-armed adversarial bandits.
      Exp3.P (Auer, Cesa-Bianchi, Freund & Schapire 2002) already guarantees high-probability regret of O(sqrt(KT
      log(K/δ))). The Bubeck–Cesa-Bianchi survey (Theorem 3.10 there) states this as about 5.15·sqrt(nK ln(K/δ))
      with probability at least 1−δ, when the tuning is chosen using δ. Neu (2015), with Exp3-IX, gets O(sqrt(KT
      log K) + sqrt(KT/log K)·log(1/δ)) without forced exploration, and that bound holds for any δ.


      Losses in [-1,1] reduce to [0,1] by the affine map (x+1)/2, which changes regret by only a factor of 2. So
      these bounds apply to the bounded_pm1 setting. The upper bound sqrt(KT log(K/δ)) matches the lower bound sqrt(T(K−1)
      log(1/(4δ)))/27 from Gerchinovitz & Lattimore 2016 up to a sqrt(log K) factor, and possibly constants. The
      K exponent is therefore tight at 1/2, and so is the T exponent. Only logarithmic factors in K remain open.


      I saw these bounds in search results, not in the papers themselves. I did not check the exact theorem numbers
      or constants in the original papers.'
