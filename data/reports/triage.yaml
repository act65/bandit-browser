  S-08bbd034|regret|worst_case:
    verdict: closed
    summary: 'The gap is closed: the minimax regret is Θ(√(K·M·T)). Two published results give this, though one
      step (the Cauchy–Schwarz combination) is my own short derivation, not a quoted theorem.


      **Removing the log K from the upper bound.** The database''s upper bound runs a separate Exp3 for each context.
      That gives √(2·K·M·T·log K), because Σ_m √(K·T_m) ≤ √(K·M·T) by Cauchy–Schwarz, where T_m is the number of
      rounds context m appears. Audibert & Bubeck (COLT 2009) showed that INF / Poly-INF reaches O(√(KT)) pseudo-regret
      without the log factor, and does not need T to be known. Running one Poly-INF per context and summing with
      the same Cauchy–Schwarz step gives O(√(K·M·T)) with no log K. The context set and its size M are known to
      the learner, so this reduction is valid.


      **Lower bound.** The database''s lower bound is √(KT)/20. It ignores M, so even the dependence on M is not
      matched. The standard construction splits the horizon into M blocks of T/M rounds, one per context, and applies
      the multi-armed bandit lower bound √(K·T/M) in each block. This gives Ω(√(K·M·T)). The bound is stated explicitly
      as Proposition 5.2 of "Bandits with Abstention under Expert Advice" (arXiv 2402.14585, 2024): Ω(√(MKT)) for
      a contextual bandit with M disjoint context groups. I saw that only in a search-result summary; I did not
      open the paper to check its exact assumptions.


      So the matching rate is Θ(√(KMT)). The remaining log K gap in the database is an artifact of using Exp3 instead
      of INF / Tsallis-INF. The M dependence was also only loosely bounded in the database. My searches worked normally.'
    papers:
    - title: Minimax Policies for Adversarial and Stochastic Bandits (Audibert, Bubeck)
      year: 2009
      arxiv_id: null
      claim: The INF (implicitly normalized forecaster) algorithm with a polynomial potential achieves O(sqrt(nK))
        pseudo-regret for adversarial K-armed bandits, removing Exp3's log K factor. Running it per context and
        summing with Cauchy–Schwarz gives O(sqrt(KMT)) for M known contexts.
    - title: Regret Analysis of Stochastic and Nonstochastic Multi-armed Bandit Problems (Bubeck, Cesa-Bianchi)
