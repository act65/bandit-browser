      for adversarial linear bandits on general action sets. The algorithm is FTRL with a log-determinant potential.
      The bound holds against adaptive adversaries, so it covers the oblivious case. This lowers the d exponent
      of the upper bound from 2.5 to 1. They also give a polynomial-time entropic-barrier method with O(d^2 sqrt(T)
      log T). (2) Dani, Hayes & Kakade (NeurIPS 2007) show the price of bandit information is at least sqrt(d) over
      the full-information rate sqrt(dT), which gives Omega(d sqrt(T)). This raises the d exponent of the lower
      bound from 0.5 to 1. Together the worst-case rate is Theta~(d sqrt(T)). Caveats: (a) I saw only the Dani et
      al. abstract, not the proofs. Their lower bound may need a specific convex body (e.g. a hypercube with losses
      bounded by |<a,y>|<=1), in which case the match holds for some convex bodies rather than every one. (b) I
      did not see a lower bound combining the d sqrt(T) order with a log(1/δ) term, so the δ-dependence is only
      matched up to log factors. (c) The fetch of the Zimmert–Lattimore PDF returned unreadable binary, so its claims
