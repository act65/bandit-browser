  S-496d1f16|regret|worst_case:
    verdict: open_known
    summary: 'The polynomial gap in K mostly comes from the database using a weak lower bound. The bound Ω̃(min(√(KT),
      N+√T)) is from Erez et al. 2024, which studies bandit multiclass classification with sparse rewards; there
      Õ(|H|+√T) is achievable. With general Bernoulli rewards and N ≥ K, the policy class can contain the K constant
      policies. That reduces to a K-armed stochastic bandit with trivial contexts, so the standard Ω(√(KT)) applies
      (for N < K, roughly Ω(√(NT))). I''m relying on that standard reduction, not a paper fetched this session.
      Dudik et al.''s √(KT log N) is therefore tight up to log factors. The remaining question is the log factor.
      For non-stochastic bandits with expert advice, Chase, Ito and Mehalel (2025) prove Ω(√(TK log(N/K))), which
      matches Kale''s (2014) upper bound. But their hard instance uses an adaptive adversary. In their Future Work
      they conjecture the bound also holds against an oblivious adversary, which leaves that case, and so the stochastic
      i.i.d.-context case, open. Ito (NeurIPS 2024) proves Ω(√(KT log(N/K))) only for a restricted protocol where
      the learner picks an expert before seeing that round''s advice. Seldin and Lugosi (2016) give Ω(√(KT ln N/ln
      K)); I only saw this through citations and couldn''t confirm it holds with stochastic contexts. No paper I
      found settles the exact log factor for i.i.d. contexts with a known context distribution. The verdict ''open''
      is a judgement: Chase et al. flag the oblivious case as open but don''t mention stochastic contexts specifically.'
