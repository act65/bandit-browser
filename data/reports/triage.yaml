  S-922664e0|regret|instance_dependent:
    verdict: open_known
    summary: 'I found no published result that closes this gap. The only lower bound that would close it was retracted
      by its own authors, so the question is known to be open.


      **The gap.** In the regime T→∞, the upper bound is of order log(1/Δ)/Δ and the lower bound is of order 1/Δ.
      They differ by a log(1/Δ) factor; the extra K-dependence matters little for K=2.


      **The retracted claim.** Bubeck, Perchet & Rigollet (COLT 2013, arXiv:1302.1611) study the case where the
      learner knows μ* but not Δ. Their abstract says that "bounded regret of order 1/Δ is not possible if one only
      knows μ*". Their introduction says that logarithmic growth of the rescaled regret ΔR_n is unavoidable even
      when μ* is known. This is their Theorem 8, which would make the log(1/Δ)/Δ rate tight.


      **The erratum.** The paper''s Microsoft Research page carries this note, which I fetched and saw directly:
      "The proof of Theorem 8 is not correct. We do not know if the theorem holds true." The arXiv page (v2, Feb
      2013) has no erratum. Garivier, Ménard & Stoltz (2019) cite the erratum and only point to later work showing
      bounded regret is achievable when μ* is known (Bubeck et al. 2013; Faure et al. 2015).


      **What''s left.** I found nothing that proves Theorem 8 or improves the upper bound to O(1/Δ) when Δ is unknown.
      So whether the log(1/Δ) factor is necessary for K=2 Gaussian arms with μ* and σ known is still unresolved.
      My searches can''t rule out a recent paper that fixes it.


      **Caveats.** I couldn''t read the full Theorem 8 statement, so I''m relying on how the abstract, introduction
      and erratum describe it. I also couldn''t read the appendices of arXiv:1602.07182, so I didn''t check whether
      the database''s Theorem A.3 and C.1 come from that paper.'
