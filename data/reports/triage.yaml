  S-b24676d6|regret|worst_case:
    verdict: closed
    summary: 'Read literally, this setting has K arms, i.i.d. contexts, rewards in [0,1], no function class and
      no number of contexts. Without a policy class, the only well-defined benchmark is the best fixed arm, so the
      problem reduces to the stochastic K-armed bandit. The context can be ignored. On that reading the polylog
      gap is closed. MOSS (Audibert & Bubeck, COLT 2009, ''Minimax Policies for Adversarial and Stochastic Bandits'')
      achieves O(sqrt(KT)) worst-case regret with no log factors. That matches the Ω(sqrt(KT)) lower bound already
      in the database (Bubeck & Cesa-Bianchi survey; Foster et al.). Caveat: the database''s upper bounds come from
      linear contextual bandit papers with d replaced by K, which looks like a mapping error. jin2026nearly is Tianyuan
      Jin, ''Nearly Minimax-Optimal Regret for Linear Contextual Bandits with Arbitrary Adaptive Action Sets'',
      arXiv 2609.15170. Its Corollary 17 bound, 130[K log(2KT+1)]^{1/4} sqrt(dT log(1+T/d)), is for linear menus
      in R^d with adaptively chosen menus, not i.i.d. contexts. Its lower bound Ω(K^{1/4} sqrt(dT)) uses adaptive,
      non-i.i.d. menus. Its Corollary 2 says oblivious menus admit Õ(sqrt(dT)), which I saw only in that paper''s
      statement. chu2011 (SupLinUCB) is also a linear-in-d result. If the intended setting is really linear contextual
      bandits with K arms in dimension d and stochastic contexts, then d must be a separate parameter. In that case
      the relevant reference points are Li, Wang & Zhou (COLT 2019, arXiv 1904.00242): VCL-SupLinUCB has an upper
      bound matching their lower bound up to iterated-log factors. Their lower bound Ω(sqrt(dT log T log K)) is
      built with adversarial contexts. I did not find a result settling the exact log factors for i.i.d. contexts
      in that linear setting. My verdict of ''closed'' applies only to the literal, structure-free K-armed setting
      given here.'
