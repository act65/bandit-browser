    verdict: open_known
    summary: 'I found no published result that closes this gap. The gap itself is stated explicitly in the paper
      that gives the upper bound. One label in the database seems to be wrong.


      **Where the upper bound comes from.** The cited upper bound, bai2021sample Theorem 5, is Bai, Jin, Wang &
      Xiong, "Sample-Efficient Learning of Stackelberg Equilibria in General-Sum Games" (NeurIPS 2021, arXiv 2102.11494).
      I read the theorem list in the ar5iv version. Theorem 5 is not about K-armed bandits. It is an Õ(d²/ε²) upper
      bound for learning Stackelberg equilibria in linear bandit games, where d is the feature dimension. The database
      appears to have recorded d as "K".


      **The gap is acknowledged in the same paper.** Appendix E.2 adapts the paper''s bandit-game lower bound to
      get Ω(d/ε²) for linear bandit games. The authors say the upper bound is off from this "by at most an Õ(d)
      factor". That is the K² (really d²) versus K (really d) gap in the database.


      **What I could not find.**

      - No later paper in my searches tightens the linear-bandit Stackelberg rate to d/ε² or raises the lower bound
      to d²/ε².

      - I could not identify li2023tight, the claimed source of the lower bound. In any case, Bai et al. already
      give an Ω(d/ε²) lower bound for this setting.

      - I could not find a formal statement calling this an open problem. It is "known open" only in the sense that
      the authors explicitly flag the gap.


      **If you meant the plain finite-action setting.** For the setting the database labels as K-armed (finite action
      sets, bandit feedback), the same paper is tight. Theorem 2 gives an Õ(AB/ε²) upper bound and Theorem 3 a matching
      Ω(AB/ε²) lower bound, where A and B are the two players'' action counts. If the intended setting is a Stackelberg
      bandit game with A = B = K, the gap is closed at K²/ε².


      **Checking limits.** The PDF fetches returned unreadable binary, so I took the theorem statements from the
      ar5iv HTML version. That page''s answer covered only the first 100k of its 185k characters, but the theorem
      list and the Appendix E.2 remark were both readable there.'
