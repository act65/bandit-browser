      Strategies" (Garivier, Lattimore, Kaufmann, NeurIPS 2016, arXiv:1605.08988) studies exactly this setting:
      two-armed Gaussian bandits, with and without knowledge of the gap Delta. It proves asymptotic lower bounds
      and gives fully sequential (non-ETC) strategies that are asymptotically optimal as T grows, so the leading
      constant is matched. It also shows that explore-then-commit strategies lose a factor of about 2 asymptotically.


