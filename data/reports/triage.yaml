  S-32605594|regret|worst_case:
    verdict: blank
    summary: 'I found no source that closes this gap or calls it a known open problem for this exact setting. The
      setting is a fixed finite action set of K points, oblivious adversary, losses in the polar of the action set,
      and expected regret.


      The setting''s upper bound is O(√(dT log K)) (Bubeck, Cesa-Bianchi and Kakade, 2012, Theorem 4). Its abstract
      presents this only as an upper bound. It calls the d√(T log T) bound for compact action sets "minimax optimal
      up to a logarithmic factor", but makes no such claim for the √(dT log K) bound.


      The only K-dependent lower bound I confirmed for a fixed action set is for K = 2^d. Shamir (2015), in the
      dual normalization, proves an Ω((d−1)√T) lower bound for the hypercube [−1,1]^d (Theorem 6, which needs T
      ≥ d⁴/4). Because the losses are linear, this also applies to the corner set {−1,1}^d, where d√T is the same
      order as √(dT log K). It also cites a prior Ω(d√T) lower bound for the Boolean hypercube. Two caveats: Shamir
      allows sub-Gaussian loss noise rather than strictly bounded losses, and says this relaxation costs only a
      √log T factor in lower bounds. At K = d (the simplex), Shamir''s Ω(√(dT)) lower bound matches EXP3, and no
      log K term appears.


      So √log K is needed at the extreme K = 2^d (up to the noise-model caveat), but I found no lower bound for
      general K.


      The most relevant candidate is Ito (NeurIPS 2024), "On the Minimax Regret for Contextual Linear Bandits and
      Multi-Armed Bandits with Expert Advice". Its abstract states an upper bound of O(√(dT log(K·min{1, S/d})))
      with a matching lower bound, where S is the number of contexts. With S = 1 this would give Θ(√(dT log(K/d)))
      and close the gap. However, I could not read the full text: the PDF did not extract and OpenReview was blocked
      by a browser check. I therefore could not confirm that the lower bound covers S = 1, nor its loss normalization
      or adversary model. It may need S ≥ d.


      Bacchiocchi, Cesari and Colomboni (arXiv 2608.12231) prove a matching lower bound of order √(dT log(K/δ)).
      But it is a high-probability bound against adaptive adversaries for m-set bandits, so it does not settle the
      expected-regret question. Li et al. (2019), Ω(√(dT log K log T)), is for stochastic contextual bandits whose
      action sets change over time; I saw it only cited secondhand and did not fetch it.


      The verdict is "blank" because Ito (2024) could not be checked. If its lower bound covers S = 1 under bounded
      polar losses, the verdict should be "closed".'
