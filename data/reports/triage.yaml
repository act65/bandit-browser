  S-cd1e913b|regret|worst_case:
    verdict: closed
    summary: 'The polynomial gap in K is closed up to log factors. The remaining gap in T is only logarithmic.


      The database''s upper bound is LinTS-style, of order K·sqrt(T)·polylog. It is loose because it treats d as
      roughly K and uses an analysis whose dependence on d is d rather than sqrt(d). For K-armed neural bandits
      in the NTK regime, Kassraie & Krause (AISTATS 2022, arXiv 2107.03144) analyse a Sup-style algorithm, SupNN-UCB,
      which adapts SupLinUCB (Chu et al. 2011) and SupKernelUCB to this setting. Their Theorem 4.2 gives R(T) =
      O(sqrt(T)·(sqrt(γ_T σ^-2 log^3 T · log(T log T·|A|/δ)) + σB)), where |A| = K is the number of arms and γ_T
      is the NTK maximum information gain. I read this statement on the arXiv HTML page. The paper says the bound
      holds for arbitrary sequences of contexts, and γ_T is defined as a maximum over all input sequences. The theorem
      also needs a sufficient-exploration assumption (λ₀ I ≼ K_T) and a network width that grows polynomially in
      |A|.


      With d_eff ≈ γ_T, this bound is about sqrt(d_eff·T)·polylog(T)·sqrt(log K). The sqrt(KT) lower bound only
      applies when the effective dimension is large enough to embed K independent arms (d_eff ≳ K). In that case
      γ_T ≈ K log T, so the upper bound becomes sqrt(KT)·polylog(K,T), matching Ω(sqrt(KT)) up to logs. When d_eff
      is fixed and smaller than K, the K-dependence is only sqrt(log K), and the MAB lower bound does not apply.
      Either way, the per-variable K gap is not a real polynomial gap. Exact log factors in K and T are not settled.


      Caveats:

      - I did not find a matching sqrt(d_eff·T) lower bound for neural or NTK bandits stated directly. The lower-bound
      side rests on the standard MAB embedding.

      - Salgia, Vakili & Zhao (arXiv 2206.00099) describe a Sup variant with an O(sqrt(Γ_k(T)·T)) bound. I only
      saw that in a search-result snippet, not on a page I fetched.

      - Kim et al. (arXiv 2312.07145, ICLR 2024 version) argue that the standard NeuralUCB/NeuralTS d̃·sqrt(T) analyses
      can be Ω(T) in the worst case. This affects how the database''s other inherited bounds should be read, not
      the Sup-type result.'
