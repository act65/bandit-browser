  S-ad3afe31|regret|worst_case:
    verdict: closed
    summary: 'The log K gap closes by combining standard published results. The database lower bound Ω(√(KT)) is
      also too weak: it is missing M_ctx.


      **Upper bound.** Audibert & Bubeck (COLT 2009 / JMLR 2010) give INF / Poly-INF, which has pseudo-regret O(√(TK))
      with no log factor. Zimmert & Seldin''s Tsallis-INF gets the same rate anytime, without knowing the horizon.
      Running one such instance per context, in the same way as the "one Exp3 per context" argument from bubeck2012survey
      and Lattimore–Szepesvári §18.1, gives Σ_c O(√(K·T_c)) ≤ O(√(K·M·T)) by Cauchy–Schwarz. Because the base algorithm
      is anytime, the per-context counts T_c do not need to be known. This removes the √(log K) factor.


      **Lower bound.** Bubeck & Cesa-Bianchi (2012) state an Ω(√(nSK)) lower bound for S contexts, obtained by splitting
      the rounds evenly across contexts and applying the K-armed minimax lower bound in each. A search snippet says
      it needs a constant fraction of contexts to cover a constant fraction of the rounds, which a worst-case adversary
      can arrange.


      **Result.** Both bounds are Θ(√(KMT)), so the minimax rate is settled up to constants.


      **Caveats.**

      - The search snippet attributes the stated √(nSK) lower bound to the Bubeck–Cesa-Bianchi monograph. Its main
      text did not load: the PDF was unreadable, and the ar5iv fetch returned text whose theorem numbering does
      not match the survey. So I have not checked the theorem number or exact constant myself.

      - The √(KT) bound for INF and Tsallis-INF is a pseudo-regret guarantee. If "cumulative regret" here means
      expected regret against the best fixed per-context policy in hindsight under an adaptive adversary, that version
      can differ. Under the usual pseudo-regret convention the gap is closed.

      - I found no single paper that states the combined Θ(√(KMT)) result. It is a direct folklore composition of
      the results above.'
