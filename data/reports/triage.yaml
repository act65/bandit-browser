  S-a945275c|regret|worst_case:
    verdict: blank
    summary: 'The gap is narrowed but I could not confirm it is closed, and found no paper calling it open. (1)
      Zimmert & Lattimore (COLT 2022) give O(sqrt(dT log(kT))) regret against adaptive adversaries for k actions
      via exponential weights. This beats the database upper bound sqrt(dT log T log(KT)) from Kong et al. 2023.
      (2) Ito (NeurIPS 2024) gives O(sqrt(dT log(K min{1,S/d}))) for contextual linear bandits with a matching lower
      bound. Search snippets say this also improves the non-contextual bound to about sqrt(dT log(K/d)). If the
      lower bound covers S=1, minimax regret is Θ(sqrt(dT log(K/d))) at least for oblivious adversaries, and a lower
      bound for oblivious adversaries also applies to adaptive ones. That would make the K-dependence tight. I could
      not verify the S=1 case or the adversary model: the paper PDF was not readable via fetch and OpenReview was
      blocked, so I saw only the abstract and summaries. For adaptive adversaries a gap of about sqrt(log T) remains
