  S-60f6f53d|regret|worst_case:
    verdict: closed
    summary: 'Under the reading that this is a finite realizable class F with |F| held fixed, the K and T gap is
      closed. EXP4 (Auer, Cesa-Bianchi, Freund, Schapire 2002) has expected regret O(sqrt(KT ln N)) against any
      N experts, including adversarial ones. I saw this attributed to Auer et al. in secondary sources (arXiv 2406.16802,
      1508.03326) but did not open the 2002 paper itself. Taking the N <= |F| greedy policies induced by F gives
      O(sqrt(KT log|F|)), with no log T factor, for i.i.d. contexts and rewards in [0,1]. This matches the existing
      Omega(sqrt(KT)) lower bound, so the rate is Theta(sqrt(KT)). The log^{3/4} T factor in the recorded upper
      bounds, which come from SupLinUCB and Jin et al. 2026 and look like linear-model results with d=K, is therefore
      not needed. Agarwal et al. 2012 (arXiv 1202.1334, Thm 5.1) gives the matching realizable lower bound Omega(sqrt(KT
      ln N / ln K)). FALCON (Simchi-Levi & Xu, arXiv 2003.12699) reaches sqrt(KT log|F|) up to log terms with an
      efficient algorithm. Caveats: EXP4 is not computationally efficient. In |F| the bounds still differ by sqrt(log
      K). If the database means a different or infinite class, this conclusion does not carry over directly.'
