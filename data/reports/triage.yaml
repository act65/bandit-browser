      construction would also give Ω(√(K M T)) in M, but that is my own derivation: I didn''t find it stated in
      a paper or in the sources I read. Caveats: INF''s guarantee is for pseudo-regret / expected regret against
      an oblivious adversary, so check that this matches the database''s regret notion. I took the Audibert–Bubeck
      claim from search-result summaries and did not fetch the full text, so the theorem number and constant are
      unchecked. I also didn''t look for an explicit statement of the contextual √(KMT) bound, for example in Lattimore–Szepesvári''s
