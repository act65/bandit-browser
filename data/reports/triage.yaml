  S-5d997e6a|hp_regret|worst_case:
    verdict: closed
    summary: 'The polynomial gap in d appears to be closed up to logarithmic factors. Your database''s upper bound
      is d²·ϑ·√(T log(1/δ)) from Lee et al. 2020; its lower bound is √(dT) from Gerchinovitz & Lattimore 2016.


      Upper bound: Zimmert & Lattimore (COLT 2022) give a high-probability bound of order d√(T log(T/δ)) on any
      compact action set, which includes convex bodies. I saw this on the PMLR page and in search summaries of the
      PDF. It holds even against adaptive adversaries, so it also covers the oblivious case. That improves the exponent
      of d from 2 to 1. The same paper also gives an efficient algorithm (FTRL with the entropic barrier) with regret
      O(d²√T log T), which beats Lee et al.''s efficient d^{7/2}√T·polylog(T) bound.


      Lower bound: for worst-case convex bodies, an Ω(d√T) lower bound goes back to Dani, Hayes & Kakade (2007).
      Two pieces of evidence point to this. Bubeck, Cesa-Bianchi & Kakade (2012) say in their abstract that d√(n
      log n) on compact action sets is minimax optimal up to a log factor. A 2025 arXiv paper (2510.24187, "Self-Concordant
      Perturbations for Linear Bandits") says, according to the search summary, that Dani et al. (2007) proved an
      Ω(d√n) minimax lower bound for arbitrary convex bodies. This lower bound is for expected regret; with δ held
      constant it carries over to high-probability regret. So the d-exponents become 1 and 1, and T stays at 1/2.


      Caveats: I could not read the Zimmert–Lattimore PDF (the fetch returned compressed binary) or the lower-bound
      theorem in Dani et al. So I have not checked directly that Dani et al.''s loss normalization matches your
      ''polar_of_action_set'' condition (|⟨a,ℓ⟩| ≤ 1). The δ-dependence in the matching lower bound is also not
      pinned down. Your database''s √(dT log(1/δ)) bound does have the right δ-scaling, but only for the √(dT) rate.
      If you want an exact δ-tight match, that remains unverified.'
    papers:
    - title: 'Return of the Bias: Almost Minimax Optimal High Probability Bounds for Adversarial Linear Bandits
        (Zimmert, Lattimore; COLT 2022, PMLR 178:3285-3312)'
      year: 2022
      arxiv_id: null
      claim: With probability at least 1−δ, regret is O(d√(T log(T/δ))) for adaptive adversaries on compact action
