  S-a2719807|regret|worst_case:
    verdict: blank
    summary: 'The gap is not closed, but it is narrower than the database shows. The best upper bound in the database
      is O(d^{3/2}√T), from Theorem 1 of Ailon, Hatano & Takimoto (arXiv:1312.1530). That same paper uses the database''s
      loss normalization (|π·s_t| ≤ 1 for all π, a loss set dual to the permutahedron). It states that CombBand
      (Cesa-Bianchi et al., 2009) already gets regret O(n√(T log n)) in this setting. The catch is that CombBand
      needs to approximate a matrix permanent at each step, so it is computationally inefficient. The authors present
      their own O(n^{3/2}√T) bound as ''slightly worse regret'' in exchange for O(n³) time per step. So the information-theoretic
      upper bound should be Õ(d√T), not d^{3/2}√T. Their main open question is whether O(n√T) regret can be achieved
      in O(n³) time: that is a question about efficiency, not about the minimax rate. They also give an efficient
      O(n√T) algorithm, but only for the more restricted loss class ‖s_t‖₁ ≤ 1.


      On the lower bound side, I found no lower bound specific to the permutahedron that beats the generic Ω(√(dT)).
      The general Ω(d√T) lower bound for bandit linear optimization (Dani et al.) is proved for other action sets,
      such as the hypercube, so it does not automatically carry over here. Cohen, Hazan & Koren (arXiv:1702.07539)
      leave the regret rate for full permutations open, but they use a different combinatorial (semi-bandit-style)
      normalization. That makes the remaining exponent gap in d (0.5 vs 1, ignoring log factors) neither shown to
      be resolved nor explicitly identified as open in this normalization.'
