  S-435bc3c6|regret|worst_case:
    verdict: closed
    summary: 'I think the log gap is already closed: the optimal rate is Θ(d√T). There is one caveat about the noise
      model, set out below.


      **Upper bound.** Bubeck, Cesa-Bianchi & Kakade (COLT 2012, arXiv 1202.3079) give an efficient Online Stochastic
      Mirror Descent algorithm on the hypercube with regret of order d√n. That has no log factor. They say it beats
      the best efficient bound by a √(d log n) factor and is minimax optimal on the hypercube. It is stated for
      bandit linear optimization with adversarial losses. Stochastic i.i.d. losses are a special case, so it bounds
      the expected pseudo-regret here too.


      **Lower bound.** Shamir (COLT 2015, arXiv 1408.2368) is the source of the lower bound in your database. Theorem
      6 gives Ω(d√T) on [-1,1]^d for T ≥ d⁴/4, using a stochastic construction with sub-Gaussian (Gaussian) losses.
      In Section 5, Shamir says this lower bound "matches the O(d√T) upper bound attained in [5]". Reference [5]
      is Bubeck–Cesa-Bianchi–Kakade 2012. He adds that this algorithm plays only on the corners of the hypercube.
      His introduction also gives the hypercube minimax regret as Θ(d√T).


      Your database''s upper bound (Dani et al. 2008, about d√T·log^1.5 T) is therefore loose. The d√T log factor
      is removed by the 2012 adversarial result.


      **Caveat.** That result assumes bounded losses, roughly |⟨a,z⟩| ≤ 1. Carrying it to unbounded sub-Gaussian
      reward noise needs the usual estimator-variance argument. I did not check that step in the full proof. Shamir''s
      framework, which allows sub-Gaussian losses, treats the two bounds as matching.


      **Tool issues.** I could not extract text from the Lattimore–Szepesvári book PDF or the PMLR PDF of Shamir''s
      paper. I read Shamir''s paper from the ar5iv HTML version instead.'
