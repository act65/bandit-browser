  S-fd2c947e|regret|worst_case:
    verdict: closed
    summary: 'He, Zhou, Zhang & Gu (NeurIPS 2022, arXiv:2205.06811) close the gap up to log factors. In linear contextual
      bandits whose decision sets change over time (bounded l2 norm) and whose rewards are corrupted with total
      budget C, their CW-OFUL algorithm has regret Õ(d√T + dC) when C is known (Theorem 4.2, horizon written as
      K in the paper). Regret is pseudo-regret against the true, uncorrupted rewards. Propositions 4.7 and 4.8 give
      a matching Ω(max{d√T, dC}) lower bound. This beats the database''s best upper bound (Ding et al.''s T^{3/4}
      rate) and matches the d√(T log T) lower bound up to logs. The upper bound doesn''t depend on K. I inferred,
      without reading jin2026, that the K^{1/4}√(dT) lower bound only applies where it stays below d√T. Only logarithmic
      gaps remain. Caveats: I read the v2 HTML only up to character 100,000 of about 121,000. I didn''t explicitly
      verify that the analysis allows an adaptive adversary with the budget counted along each sample path, though
      that is the standard model in this line of work.'
