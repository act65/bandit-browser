    - claude-haiku-5-5
  viering19a:
    title: 'Open Problem: Monotonicity of Learning'
    authors:
    - Tom Viering
    - Alexander Mey
    - Marco Loog
    year: 2019
    url: https://proceedings.mlr.press/v99/viering19a.html
    bandits: 'no'
    statement: Does a learning algorithm (in particular ERM) perform better in expectation when one more training
      instance is added? When are learners risk-monotone, and does every PAC-learnable problem have a monotone learner?
    status: partially_resolved
    summary: 'The main question, whether monotone learners exist, has been largely answered. Pestov (2021) gave
      a universally consistent learning rule whose expected error is universally monotone for binary classification.
      Bousquet et al. (COLT 2022) showed that any multiclass learner can be turned into a monotone one with similar
      performance, so every PAC-learnable class has a monotone PAC learner. Mhammedi (NeurIPS 2021) gave consistent,
      risk-monotone algorithms for general losses via distributionally robust optimisation, but the guarantees hold
      with high probability. Loog, Viering & Mey (NeurIPS 2019) showed that ERM can be non-monotone however large
      the training set. Still open: a characterisation of when ERM itself is monotone, and fully general in-expectation
      monotone transformations for arbitrary losses. No 2024–2026 work closing these gaps was found in a short search.'
    papers:
    - title: Minimizers of the Empirical Risk and Risk Monotonicity
      year: 2019
      arxiv_id: '1907.05476'
      claim: Formalizes risk monotonicity; shows that various ERM learners can act non-monotonically however large
        the training sample.
    - title: Risk-Monotonicity in Statistical Learning
      year: 2021
      arxiv_id: '2011.14126'
      claim: First algorithms that are both consistent and risk-monotone under weak assumptions for general losses,
