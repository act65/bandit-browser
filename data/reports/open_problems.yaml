    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  orabona16:
    title: 'Open Problem: Parameter-Free and Scale-Free Online Algorithms'
    authors:
    - Francesco Orabona
    - Dávid Pál
    year: 2016
    url: https://proceedings.mlr.press/v49/orabona16.html
    bandits: adjacent
    statement: Can one design online linear optimization algorithms that are simultaneously parameter-free (regret
      ~O(sqrt(R(u) T)) for every comparator u without tuning) and scale-free (no prior knowledge of the bound on
      loss-vector norms, regret scaling with max_t ||l_t||)?
    status: resolved
    summary: 'The question is answered: being parameter-free and scale-free at once is possible, but only with an
      extra term that a lower bound shows can''t be removed. Cutkosky & Boahen (COLT 2017) prove a set of lower
      bounds for algorithms that know neither the gradient bound nor the comparator norm. They show a tradeoff between
      a term depending on the comparator and a term depending on how fast the gradients grow, and give algorithms
      that reach any point on that tradeoff. They credit their 2016 paper with first showing the regret must include
      the penalty exp(max_t sqrt(L_t/L_{t-1})); the exact form of the 2017 lower bound was not checked. Mhammedi
      & Koolen (COLT 2020) give parameter-free, scale-free algorithms for the setting with unbounded predictions
      and gradients. A 2024 paper by Cutkosky & Mhammedi, seen only via a search summary, is said to remove the
      need to know either the gradient bound or the comparator norm.'
    papers:
    - title: Online Learning Without Prior Information
      year: 2017
      arxiv_id: '1703.02629'
      claim: Proves a set of lower bounds showing a tradeoff between a comparator-dependent term and a term depending
        on how fast the gradients grow, so the ideal bound is impossible when both are unknown. Gives algorithms
        that reach any point on this tradeoff. Credits Cutkosky & Boahen (2016) with first showing an exponential
        penalty exp(max_t sqrt(L_t/L_{t-1})) is needed.
    - title: Lipschitz and Comparator-Norm Adaptivity in Online Learning
      year: 2020
      arxiv_id: '2002.12242'
      claim: Gives parameter-free, scale-free algorithms for online convex optimization with unbounded predictions
        and gradients, adapting to both the gradient sequence and the comparator, via reductions that remove the
        need for hints and handle an unknown range of gradient sizes.
    - title: Fully Unconstrained Online Learning
      year: 2024
      arxiv_id: '2405.20540'
      claim: 'Seen only via a search summary: an algorithm that needs neither the gradient bound G nor the comparator
        norm ||w*||.'
    searches:
    - Cutkosky Boahen Online Learning Without Prior Information parameter-free scale-free lower bound
    - Mhammedi Koolen Lipschitz and Comparator-Norm Adaptivity in Online Learning
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  Banerjee15:
    title: 'Open Problem: Restricted Eigenvalue Condition for Heavy Tailed Designs'
    authors:
    - Arindam Banerjee
    - Sheng Chen
    - Vidyashankar Sivakumar
    year: 2015
    url: https://proceedings.mlr.press/v40/Banerjee15.html
    bandits: 'no'
    statement: Given a random design matrix drawn from a heavy-tailed distribution satisfying Mendelson's small-ball
      property, does it satisfy the restricted eigenvalue (RE) condition with high probability once the sample size
      is of order the squared Gaussian width of the restricted set, as for sub-Gaussian designs?
    status: resolved
    summary: Two 2026 arXiv preprints, which I could not confirm are peer-reviewed, answer the general version negatively.
      Fu, Xu, Zhang and Tao (arXiv:2609.03504) build a constant-width polyhedral cone whose empirical RE is zero
      up to about half the ambient dimension. They put the failure down to a single sample having to detect every
      direction at once ("threshold occupancy"). They also give a fallback sample complexity in terms of a threshold
      VC dimension, and a sharp distribution-free bound for isotropic designs. Zhao (arXiv:2609.11795) builds, for
      each n, a heavy-tailed design and a set of Gaussian width below 2. Every direction passes the small-ball test
      with probability at least 1/12, yet the design is singular on the set with high probability. So small-ball
      constants plus Gaussian width cannot control RE in the distribution-free, arbitrary-set form. Restricted versions,
      such as isotropic or upper-tail assumptions or structured sets, may still be open. This assessment rests on
      the arXiv abstracts only; I did not check the proofs.
    papers:
    - title: 'Restricted Eigenvalues Beyond Gaussian Width: Threshold Occupancy under Heavy Tails'
      year: 2026
      arxiv_id: '2609.03504'
      claim: Claims an explicit, systematic negative answer to the COLT 2015 question as formulated. A constant-width
        polyhedral descent cone has zero empirical RE up to about half the ambient dimension under small-ball heavy-tailed
        designs, while Gaussian designs succeed on the same cone with far fewer samples. Also gives a threshold-VC-dimension
        sample complexity and a sharp distribution-free fallback for isotropic designs.
    - title: Small-Ball Marginals Do Not Control Restricted Eigenvalues by Euclidean Gaussian Width
      year: 2026
      arxiv_id: '2609.11795'
      claim: 'Negative answer to the distribution-free formulation. For each n, a heavy-tailed design in dimension
        4^n+1 and a set with Gaussian width below 2: every direction satisfies small-ball with probability at least
        1/12, yet X is singular on the set with probability at least 1-exp(-2^n). The isotropic and upper-tail variants
        are discussed as a different problem and not claimed as solved.'
    searches:
    - restricted eigenvalue condition heavy-tailed design small ball Gaussian width sample complexity
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  Choromanska15:
    title: 'Open Problem: The landscape of the loss surfaces of multilayer networks'
    authors:
    - Anna Choromanska
    - Yann LeCun
    - Gérard Ben Arous
    year: 2015
    url: https://proceedings.mlr.press/v40/Choromanska15.html
    bandits: 'no'
    statement: Can some of the unrealistic assumptions (e.g. path independence / independence of activations, ReLU-specific
      modelling, spherical constraint, redundancy, uniformity) behind the Choromanska et al. (2015) link between
      deep network losses and the Hamiltonian of spherical spin-glass models be dropped, so that the connection
      becomes stronger and more rigorous?
    status: partially_resolved
    summary: Later work has answered parts of this question, but not all of it. Kawaguchi (NeurIPS 2016) says outright
      that it "partially addresses an open problem announced at COLT 2015." For deep linear networks, it drops the
      unrealistic assumptions and proves that every local minimum is global. It also finds "bad" saddle points,
      meaning saddles whose Hessian has no negative eigenvalue, in networks deeper than three layers. For nonlinear
      networks, it removes most of the Choromanska assumptions but still depends on weaker versions of two of them,
      including the independence assumption. Baskerville, Keating, Mezzadri and Najnudel (2020/2021) removed the
      ReLU-only restriction in the spin-glass approach. To do this they used a deformed spin-glass model analysed
      with supersymmetric random-matrix methods. Neither paper gives a fully rigorous connection between realistic
      deep-network losses and spin glasses. The core independence-type assumptions remain, so the problem is still
      open in its strongest form. I only read abstracts and summaries, not the full papers.
    papers:
    - title: Deep Learning without Poor Local Minima
      year: 2016
      arxiv_id: '1605.07110'
      claim: Says it partially addresses the COLT 2015 open problem. For deep linear networks it drops the unrealistic
        assumptions and proves all local minima are global, with bad saddle points appearing beyond three layers.
        For deep nonlinear networks it discards most assumptions but keeps weaker forms of two of them, including
        independence.
    - title: The Loss Surfaces of Neural Networks with General Activation Functions
      year: 2020
      arxiv_id: '2004.03959'
      claim: Removes the ReLU-only restriction in the Choromanska et al. spin-glass approach and computes the complexity
        of a resulting deformed spin-glass model using supersymmetric random-matrix methods, which tests how valid
        the approach is.
    searches:
    - Kawaguchi "Deep learning without poor local minima" Choromanska open problem COLT 2015 assumptions
    - relaxing assumptions spin glass neural network loss surface connection Choromanska follow-up
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
