    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  wang24c:
    title: 'Open problem: Convergence of single-timescale mean-field Langevin descent-ascent for two-player zero-sum
      games'
    authors:
    - Guillaume Wang
    - Lénaïc Chizat
    year: 2024
    url: https://proceedings.mlr.press/v247/wang24c.html
    bandits: adjacent
    statement: On the d-torus, take the entropy-regularized min-max functional F_β(μ,ν) = ∬ f dμ dν + β⁻¹H(μ) −
      β⁻¹H(ν). Does its single-timescale Wasserstein gradient descent-ascent flow (μ_t, ν_t), which is the mean-field
      Langevin descent-ascent, converge weakly as t→∞ for every smooth f and every β>0?
    status: partially_resolved
    summary: 'The open problem is now partly answered, by a local positive result and a global negative one. Neither
      settles the torus question exactly as posed.


      **Positive, local:** Seo, Shin, Monmarché and Choi (arXiv 2602.01564, 2026) respond directly to Wang and Chizat.
      They prove that single-timescale MFL-DA converges exponentially fast to the mixed Nash equilibrium in Wasserstein
      space if it starts close enough to it. This holds for nonconvex-nonconcave payoffs. The finite-particle system
      keeps this stability for times exponential in N, at an N-independent rate, up to a finite-particle error floor.


      **Negative, global:** "Oscillating solutions to the mean-field Langevin descent-ascent flow" (arXiv 2604.11134,
      2026) cites the open problem and gives a counterexample to convergence. Seo et al. credit this counterexample
      to Mourrat and Pillaud-Vivien; the arXiv page I fetched didn''t show the author list. The payoff is a double
      well in each coordinate, the deterministic dynamics has a limit cycle, and with strong coupling and small
      entropic regularization the mean-field flow does not converge. However, this example is on R², with confinement
      coming from quartic growth. The paper does not mention the torus or compact manifolds.


      So global convergence fails in a closely related Euclidean setting, and convergence holds locally near the
      equilibrium. Whether it can fail on the torus for some f and β, as the problem actually asks, is not settled
      by what I found.


      **Related:** Global convergence does hold with time-averaging (Lu and Monmarché, 2505.07642), with two timescales
      (2501.17122), or under strong convexity-concavity (Cai et al., 2412.20471).'
    papers:
    - title: Local exponential stability of mean-field Langevin descent-ascent and associated particle system
      year: 2026
      arxiv_id: '2602.01564'
      claim: Seo, Shin, Monmarché and Choi answer the Wang–Chizat question positively but only locally. If MFL-DA
        starts close enough to the mixed Nash equilibrium, it converges there exponentially fast, for nonconvex-nonconcave
        payoffs. The particle system keeps this stability for times exponential in N, up to a finite-particle error
        floor.
    - title: Oscillating solutions to the mean-field Langevin descent-ascent flow
      year: 2026
      arxiv_id: '2604.11134'
      claim: Cites the Wang–Chizat open problem and gives a counterexample on R². With a double-well payoff in each
        coordinate, strong coupling and small entropic regularization, the mean-field descent-ascent flow does not
        converge (the deterministic dynamics has a limit cycle). The torus is not addressed.
    - title: Convergence of Time-Averaged Mean Field Gradient Descent Dynamics for Continuous Multi-Player Zero-Sum
        Games
      year: 2025
      arxiv_id: '2505.07642'
      claim: Lu and Monmarché keep all players on a single timescale but use time-averaged dynamics. For fixed entropic
        regularization, they prove exponential convergence in total variation to the mixed Nash equilibrium.
    - title: 'Convergence of two-timescale gradient descent ascent dynamics: finite-dimensional and mean-field perspectives'
      year: 2025
      arxiv_id: '2501.17122'
      claim: Studies convergence of two-timescale GDA, including the mean-field setting. This is the workaround
        that the open problem itself mentions.
    searches:
    - single-timescale mean-field Langevin descent-ascent convergence zero-sum game entropy
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
