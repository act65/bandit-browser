  ge19b:
    title: 'Open Problem: Do Good Algorithms Necessarily Query Bad Points?'
    authors:
    - Rong Ge
    - Prateek Jain
    - Sham M. Kakade
    - Rahul Kidambi
    - Dheeraj M. Nagaraj
    - Praneeth Netrapalli
    year: 2019
    url: https://proceedings.mlr.press/v99/ge19b.html
    bandits: adjacent
    statement: In stochastic convex optimization, must any algorithm (information-theoretically) query iterates
      that are sub-optimal (relative to the minimax rate at that time) infinitely often, as is known to happen for
      SGD's final iterate under any step-size schedule?
    status: open
    summary: 'I found no paper that answers the question as posed for all algorithms, so it looks open. Ge et al.''s
      earlier work had already shown that SGD''s final iterate queries highly suboptimal points infinitely often,
      whatever the step sizes. Jain, Nagaraj & Netrapalli (2019) got the optimal last-iterate rate, but only with
      a step-size schedule that needs the horizon T in advance. They conjectured that no step-size sequence can
      do this without knowing T. Kornowski & Shamir (arXiv 2604.13870, 2026) prove that conjecture for convex Lipschitz
      functions: even noiseless GD has an unavoidable poly-log excess in an anytime last-iterate guarantee, and
      such suboptimal times are common. That result covers only step-size-based GD/SGD, not arbitrary algorithms,
      and its abstract does not cite the open problem. So it is progress on a restricted version only.'
    papers:
    - title: Gradient Descent's Last Iterate is Often (slightly) Suboptimal
      year: 2026
      arxiv_id: '2604.13870'
      claim: 'Proves the Jain et al. (2019) conjecture: with the horizon T unknown, no step-size sequence gives
        SGD the optimal last-iterate error. Even noiseless GD on convex Lipschitz functions cannot avoid a poly-log
        excess in an anytime last-iterate guarantee, and such suboptimal times are common. This covers step-size-based
        GD/SGD only, not arbitrary algorithms.'
