  woodworth19a:
    title: 'Open Problem: The Oracle Complexity of Convex Optimization with Limited Memory'
    authors:
    - Blake Woodworth
    - Nathan Srebro
    year: 2019
    url: https://proceedings.mlr.press/v99/woodworth19a.html
    bandits: adjacent
    statement: Known first-order methods that reach the optimal oracle complexity for convex Lipschitz optimization
      use about d^2 memory, for example center-of-mass and other cutting-plane methods. Is quadratic memory necessary
      for this? More broadly, the problem asks for the minimax number of first-order queries needed to optimise
      a d-dimensional convex Lipschitz function under a memory constraint, i.e. the full memory–query tradeoff curve
      between cutting-plane methods (about d^2 memory, about d queries) and gradient descent (about d memory, about
      1/ε^2 queries).
    status: partially_resolved
    summary: 'The main yes/no question has been answered: quadratic memory is necessary. The broader goal of characterising
      the full minimax memory–query tradeoff is still open, so the status is partially resolved.


      **How the main question was answered**

      - **Marsden, Sharan, Sidford and Valiant (COLT 2022)** showed that memory must grow faster than linearly in
      d. With at most d^{1.25−δ} bits, an algorithm needs Ω(d^{1+4δ/3}) queries. The authors say this resolves one
      of the questions in the Woodworth–Srebro open problem.

      - **Blanchard, Zhang and Jaillet (COLT 2023; Mathematics of Operations Research 2025)** proved the deterministic
      case. Any deterministic first-order method with at most d^{2−δ} bits needs Ω̃(d^{1+δ/3}) queries, at accuracy
      1/d^4. For feasibility problems the bound is Ω̃(d^{1+δ}). So center-of-mass is Pareto-optimal up to log factors,
      and quadratic memory is necessary. The paper states that it "resolves a COLT 2019 open problem of Woodworth
      and Srebro."

      - **Chen and Peng (FOCS 2023)** extended this to randomized algorithms. A randomized algorithm needs either
      Ω(d^{2−δ}) bits of memory or Ω(d^{1+δ/6−o(1)}) queries, but only at quasi-polynomially small accuracy.


      **What is still open**

      - **The low-memory end:** Blanchard (2024) showed that gradient descent is Pareto-optimal, but only for feasibility
      problems. With d^{1+δ} memory, deterministic algorithms need a number of queries polynomial in 1/ε.

      - **The latest bounds:** Menart, Nikolov and Shamir (arXiv, July 2026) improved the lower bounds for m bits
      of memory to Ω̃(d^2/√m) queries for randomized algorithms and Ω̃(min{d^{1.6}, d^{8/3}/m^{2/3}}) for deterministic
      ones. They also showed that about d^2 memory is needed even at polynomially small accuracy. However, they
      do not claim the bounds are tight across all memory regimes.


      So no paper I found gives exact, matching upper and lower bounds across the whole tradeoff curve for optimisation.'
    papers:
    - title: Efficient Convex Optimization Requires Superlinear Memory
      year: 2022
      arxiv_id: '2203.15260'
      claim: Any algorithm with at most d^{1.25−δ} bits of memory needs Ω(d^{1+4δ/3}) first-order queries to minimise
        1-Lipschitz convex functions on the unit ball, so memory must be superlinear. The authors say this resolves
        one of the questions in the Woodworth–Srebro COLT 2019 open problem.
    - title: 'Quadratic Memory is Necessary for Optimal Query Complexity in Convex Optimization: Center-of-Mass
        is Pareto-Optimal'
      year: 2023
      arxiv_id: '2302.04963'
      claim: Deterministic first-order methods with at most d^{2−δ} bits need Ω̃(d^{1+δ/3}) queries (Ω̃(d^{1+δ})
        for feasibility problems). So quadratic memory is necessary and center-of-mass is Pareto-optimal. The paper
        states that it resolves the COLT 2019 open problem of Woodworth and Srebro.
    - title: Memory-Query Tradeoffs for Randomized Convex Optimization
      year: 2023
      arxiv_id: '2306.12534'
      claim: Randomized first-order algorithms need either Ω(d^{2−δ}) bits of memory or Ω(d^{1+δ/6−o(1)}) queries,
        at quasi-polynomially small accuracy. So cutting-plane methods are Pareto-optimal among randomized methods
        too.
    - title: Gradient Descent is Pareto-Optimal in the Oracle Complexity and Memory Tradeoff for Feasibility Problems
      year: 2024
      arxiv_id: '2404.06720'
      claim: For feasibility problems, deterministic algorithms with d^{1+δ} memory need a number of queries polynomial
        in 1/ε, so gradient descent is Pareto-optimal at the low-memory end. This applies to feasibility problems
        only.
    - title: 'Stronger Memory-Query Tradeoffs for Convex Optimization: The Limitations of Subquadratic Memory'
      year: 2026
      arxiv_id: '2607.24827'
      claim: With m bits of memory, randomized algorithms need Ω̃(d^2/√m) queries and deterministic algorithms need
        Ω̃(min{d^{1.6}, d^{8/3}/m^{2/3}}). It also shows that about d^2 memory is needed at polynomially small accuracy.
        The abstract does not claim a full, tight characterisation of the tradeoff.
    searches:
    - quadratic memory necessary optimal query complexity convex optimization center-of-mass Pareto-optimal
    - memory-query tradeoff convex optimization gradient descent Pareto-optimal lower bound
    - Chen Peng "Memory-Query Tradeoffs for Randomized Convex Optimization" d^{2-delta} memory queries
    - Marsden Sharan Sidford Valiant Efficient convex optimization requires superlinear memory
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  hazan18a:
    title: 'Open problem: Improper learning of mixtures of Gaussians'
    authors:
    - Elad Hazan
    - Livni Roi
    year: 2018
    url: https://proceedings.mlr.press/v75/hazan18a.html
    bandits: 'no'
    statement: Is there an efficient (polynomial-time) unsupervised learning algorithm for mixtures of Gaussians
      in the over-complete case, where there are more components than dimensions? Learning is measured by worst-case
      compression (reconstruction) relative to the best mixture model, so the algorithm may be improper.
    status: open
    summary: 'I found no paper that solves this problem, so it looks open. The status is uncertain because I didn''t
      check the papers that cite it.


      **The problem.** Hazan and Livni (COLT 2018) work in the compression-based, non-generative framework of Hazan
      and Ma (2016). They give an efficient improper algorithm based on PCA for the under-complete case, where there
      are fewer components than dimensions. They ask whether the over-complete case can also be learned efficiently,
      and a third-party summary (Lacuna) says they offered a $200 bounty.


      **What the searches turned up.** All of it is near the question rather than an answer to it:

      - Proper learning of mixtures with a constant number of components.

      - Improper density estimation in one dimension, where the output is a piecewise polynomial rather than a Gaussian
      mixture.

      - Sample-complexity bounds from sample compression schemes (Ashtiani et al.).

      - Learning with diffusion models and score matching (2024), which makes separation or structure assumptions.

      - Statistical-query lower bounds against learning the parameters, which don''t apply directly to improper
      compression.


      A 2025 search result says worst-case competitive compression is computationally hard in general under cryptographic
      assumptions. That points to hardness but doesn''t settle the Gaussian-mixture case.


      **Bandits.** This is not a bandit problem: it is unsupervised learning and density estimation.'
    papers:
    - title: A Non-generative Framework and Convex Relaxations for Unsupervised Learning
      year: 2016
      arxiv_id: '1610.01132'
      claim: Sets up the compression-based framework the open problem uses (earlier context, not a solution).
    - title: Learning general Gaussian mixtures with efficient score matching
      year: 2024
      arxiv_id: '2404.18893'
      claim: Learns Gaussian mixtures using score matching under structural assumptions, and notes SQ lower bounds
        of d^Ω(k) for learning the parameters. It does not answer the over-complete compression question.
    searches:
    - improper learning mixtures of Gaussians over-complete compression unsupervised learning Hazan Livni open problem
    - efficient improper unsupervised learning overcomplete Gaussian mixture compression reconstruction error polynomial
      time hardness
    - '"improper learning of mixtures of Gaussians" Hazan Livni cited overcomplete solved'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  jiang18a:
    title: 'Open Problem: The Dependence of Sample Complexity Lower Bounds on Planning Horizon'
    authors:
    - Nan Jiang
    - Alekh Agarwal
    year: 2018
    url: https://proceedings.mlr.press/v75/jiang18a.html
    bandits: adjacent
    statement: Can one prove a sample-complexity lower bound for (tabular, episodic) PAC RL that depends polynomially
      on the planning horizon H, once the technical assumptions (e.g. reward normalization making the horizon dependence
      superficial) behind existing upper bounds are removed? Jiang and Agarwal conjectured that such a lower bound
      exists.
    status: resolved
    summary: 'Resolved negatively. Wang, Du, Yang and Kakade (NeurIPS 2020) explicitly refute the Jiang–Agarwal
      conjecture. With total reward normalized to [0,1], they show tabular episodic RL needs only a number of episodes
      logarithmic in H, so long horizons are no harder in the minimax sense. Li, Wang and Yang (2021) then remove
      the remaining log factor: their algorithm finds an O(1)-optimal policy with O(1) episodes, independent of
      H, which they describe as completely settling the horizon dependence. Caveat: the answer holds in the normalized-reward,
      tabular, minimax setting.'
