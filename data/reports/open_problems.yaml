  Koolen15b:
    title: 'Open Problem: Online Sabotaged Shortest Path'
    authors:
    - Wouter M. Koolen
    - Manfred K. Warmuth
    - Dmitri Adamskiy
    year: 2015
    url: https://proceedings.mlr.press/v40/Koolen15b.html
    bandits: adjacent
    statement: Is there an efficient (polynomial-time) algorithm for online shortest path in which, on each trial,
      some edges are sabotaged or asleep, achieving the regret bound you get inefficiently by running a sleeping-experts
