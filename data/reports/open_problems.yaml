  open-problem-bassily22a:
    title: 'Open Problem: Better Differentially Private Learning Algorithms with Margin Guarantees'
    authors:
    - Raef Bassily
    - Mehryar Mohri
    - Ananda Theertha Suresh
    year: 2022
    url: https://proceedings.mlr.press/v178/open-problem-bassily22a.html
    statement: The paper asks two questions. (1) Can we design differentially private learning algorithms with dimension-independent
      confidence-margin guarantees, for linear and kernel classifiers and neural networks, that cost much less to
      compute than existing ones? Examples of the costly existing methods are pure-DP exponential-mechanism approaches
      and JL-plus-DP-ERM pipelines. (2) Can we get DP margin-based generalization guarantees for neural networks
      with no explicit dependence on network size, such as the number of units? The existing bound scales linearly
      with the number of activation units.
    status: open
    bandits: 'no'
    summary: 'This is a DP learning-theory problem, not a bandit problem. The "recent work" the open problem builds
      on is the authors'' own NeurIPS 2022 paper. That paper gives:

      - efficient DP algorithms with margin guarantees for linear classifiers (JL transform plus DP-ERM) and for
      shift-invariant kernels;

      - a computationally inefficient pure-DP algorithm with relative-deviation margin bounds;

      - a pure-DP algorithm for feed-forward neural networks whose margin bound does not depend on input dimension
      but grows linearly with the number of units.


      I searched specifically for later work on either open question and found no paper that resolves either one.

      - **Question 2 (network-size-free bounds):** I found no follow-up that removes the dependence on network size
      from DP margin bounds for neural networks.

      - **Question 1 (computational cost):** The closest later work is Wang, Zhu and Wang (arXiv 2505.24737, 2025).
      For DP linear classification it gives an efficient (ε,δ)-DP algorithm whose risk depends on the margin, adapts
      to large-margin separable subsets after outliers are removed, and claims a dimension-free excess population
      risk. From its abstract it does not cite or address the open problem directly. It touches only the linear
      part of question 1 and does not cover kernels, neural networks or pure DP.


      The earlier efficient private large-margin halfspace learners predate the open problem: Nguyen–Ullman–Zakynthinou
      (ALT 2020) and Bun–Carmosino–Sorrell (COLT 2020). I saw only search results and abstracts, not full texts,
      so I can''t rule out a later paper I missed. Based on what I found, both questions look open, with only some
      related progress on the linear case.'
    papers:
    - title: Differentially Private Learning with Margin Guarantees
      year: 2022
      arxiv_id: '2204.10376'
      claim: This is the base work that motivates the open problem, by the same authors (NeurIPS 2022). It gives
        pure-DP and efficient DP algorithms with margin guarantees for linear classifiers, an efficient algorithm
        for shift-invariant kernels, and a pure-DP algorithm for feed-forward networks whose margin bound does not
        depend on input dimension but grows linearly with the number of units.
    - title: Adapting to Linear Separable Subsets with Large-Margin in Differentially Private Learning
      year: 2025
      arxiv_id: '2505.24737'
      claim: Related progress on the linear case only. It gives an efficient (ε,δ)-DP ERM algorithm for binary linear
        classification with risk bounds that depend on the margin after outliers are removed, and claims a dimension-free
        excess population risk for DP large-margin halfspaces. It does not address kernels, neural networks or pure
        DP, and from its abstract it does not cite the open problem.
    searches:
    - differentially private margin guarantees efficient algorithm neural networks dimension-independent
    - '"Bassily" "Mohri" "Suresh" open problem differentially private margin follow-up'
    - differentially private learning margin guarantees improved computational efficiency 2023 2024 linear classifiers
      kernel
    - differentially private neural networks margin generalization bound independent of network size private
    - efficient differentially private learning large-margin halfspaces dimension-free 2024 OR 2025 arXiv
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  open-problem-blanc22a:
    title: 'Open Problem: Properly learning decision trees in polynomial time?'
    authors:
    - Guy Blanc
    - Jane Lange
    - Mingda Qiao
    - Li-Yang Tan
    year: 2022
    url: https://proceedings.mlr.press/v178/open-problem-blanc22a.html
    bandits: 'no'
    statement: Give a poly(n, s, 1/ε)-time membership-query algorithm for properly learning size-s decision trees
      over n variables to error ε under the uniform distribution on {±1}^n. The current best is n^{O(log log n)}
      (BLQT21), and before that n^{O(log n)} (Ehrenfeucht–Haussler).
    status: open
    summary: I found no later paper giving a polynomial-time proper learner for the uniform distribution with queries,
      so the n^{O(log log n)} algorithm of BLQT21 is still the best known. Later work by Koch, Strassle and Tan
      proves hardness only for arbitrary distributions. Assuming randomized ETH, there is no n^{Õ(log log s)}-time
      proper PAC learner from random examples (SODA'23). Proper learning with queries is NP-hard (FOCS'23), and
      it stays NP-hard to within any constant factor of the optimal size (COLT'24). None of these results applies
      to the uniform-distribution question, which remains open.
    papers:
    - title: Properly Learning Decision Trees with Queries Is NP-Hard
      year: 2023
      arxiv_id: '2307.04093'
      claim: Proper PAC learning of decision trees with membership queries is NP-hard when the distribution is arbitrary,
        even with constant error allowed. The paper contrasts this with the uniform-distribution n^{O(log log n)}
        algorithm and does not settle the uniform case.
    - title: Superpolynomial Lower Bounds for Decision Tree Learning and Testing
      year: 2022
      arxiv_id: '2210.06375'
      claim: Assuming randomized ETH, size-s decision trees cannot be properly PAC learned in time n^{Õ(log log
        s)}. Under a Set-Cover conjecture the bound is n^{Ω(log s)}. These are distribution-free lower bounds for
        random examples.
    - title: Superconstant Inapproximability of Decision Tree Learning
      year: 2024
      arxiv_id: null
      claim: Proper learning of decision trees stays NP-hard even if the hypothesis may be any constant factor larger
        than optimal. This is again a distribution-free hardness result.
