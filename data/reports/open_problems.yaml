      year: 2020
      arxiv_id: '2005.00527'
      claim: 'Refutes the Jiang–Agarwal conjecture: with total reward normalized to [0,1], tabular episodic RL has
        sample complexity only logarithmic in the horizon H (using an epsilon-net over policies and Online Trajectory
        Synthesis).'
    - title: Settling the Horizon-Dependence of Sample Complexity in Reinforcement Learning
      year: 2021
      arxiv_id: '2111.00633'
      claim: Gives an algorithm that finds an O(1)-optimal policy with O(1) episodes, with no dependence on H, completely
        settling the horizon dependence of RL sample complexity.
