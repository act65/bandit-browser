    - claude-haiku-5-5
  feldman19b:
    title: 'Open Problem: How fast can a multiclass test set be overfit?'
    authors:
    - Vitaly Feldman
    - Roy Frostig
    - Moritz Hardt
    year: 2019
    url: https://proceedings.mlr.press/v99/feldman19b.html
    bandits: adjacent
    statement: Suppose you have a multiclass benchmark with m classes and n test examples. If you may make k adaptive
      queries, each revealing a classifier's accuracy on the test set, how much bias (overfitting) can you achieve?
      Equivalently, how many queries do you need for a given amount of overfitting, and how does that number depend
      on m? Earlier bounds left a gap in the exponent of m.
    status: resolved
    summary: 'This problem appears to be resolved. Acharya and Suresh, "Optimal multiclass overfitting by sequence
      reconstruction from Hamming queries" (arXiv 1908.03156, 2019), give computationally efficient attacks that
      achieve bias Θ̃(max{√(k/(mn)), k/n}). They say this matches the known upper bounds, and their abstract states:
      "We resolve this problem." I checked the abstract only, not the proofs. A secondary summary site (pith.science)
      adds that their attacks don''t need adaptivity: all queries can be fixed in advance. The earlier paper by
      Feldman, Frostig and Hardt (ICML 2019) had proved an upper bound of about √(k/(nm)), but its attacks did not
      match that bound in m. Xu and Liu (NeurIPS 2023) later extended this kind of analysis to robust accuracy queries.'
