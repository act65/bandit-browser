    - title: Label optimal regret bounds for online local learning
      year: 2015
      arxiv_id: '1503.02193'
      claim: Tighter analysis shows Christiano's SDP algorithm achieves O(√(nLT)) regret; a polynomial-time algorithm
        with lower regret would give a polynomial-time algorithm for planted clique (similar hardness under a planted
