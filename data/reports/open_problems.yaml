    bandits: 'yes'
    statement: Can the online (adaptive/sequential design) confidence intervals for RKHS elements used in kernelized
      bandits (width scaling with sqrt(gamma_T) times RKHS norm/noise terms) be tightened, e.g. removing the extra
      sqrt(gamma_T) factor relative to the non-adaptive case? Doing so would yield tighter, possibly order-optimal,
      regret bounds for GP-UCB, GP-TS and related algorithms.
    status: partially_resolved
    summary: Lattimore (COLT 2023) proved that the Abbasi-Yadkori-style self-normalized bounds for adaptive linear/kernel
      regression cannot be improved in general. The paper explicitly says this settles the continuous-time version
      of the Vakili et al. open problem. For discrete time it gives only experimental evidence that improvement
      is impossible. Whitehouse, Ramdas & Wu (NeurIPS 2023) showed that GP-UCB gets nearly optimal, sublinear regret
      for Matérn kernels when regularisation is scaled to the kernel's smoothness. This removes the 'may not be
      sublinear' concern but does not tighten the confidence intervals. The discrete-time question and the order-optimality
      of GP-UCB/GP-TS appear formally unresolved. Only search-result summaries were seen, not full texts, and no
