    summary: 'Resolved negatively, by inference. Mathiasen, Larsen and Grønlund (ICML 2019) give SparsiBoost, which
      reaches a margin gap v with T = O(log(n v²)/v²) hypotheses, against O(log n / v²) for AdaBoostV. Their abstract
      says this refutes the conjecture of Nie et al. (JMLR''13) that AdaBoostV''s trade-off is optimal, and they
      prove a matching lower bound. In terms of t, the achievable gap is about √(log(n/t)/t), which is O(1/√t) when
      t is a constant fraction of n. So no matrix, Hadamard or otherwise, can force the conjectured Ω(√(log n/t))
      gap over that range, and the tight rate there is √(log(n/t)/t). Caveat: the paper''s abstract cites the JMLR
      conjecture, not this COLT problem, and does not mention Hadamard matrices. I could not read the full PDF,
      so I have not checked their lower-bound construction or the range of t it covers.'
    papers:
    - title: Optimal Minimal Margin Maximization with Boosting
      year: 2019
      arxiv_id: '1901.10789'
      claim: Gives SparsiBoost, which reaches margin gap v with T = O(log(n v^2)/v^2) hypotheses, better than AdaBoostV's
        O(log n / v^2). The abstract says this refutes the Nie et al. conjecture that AdaBoostV is optimal, and
        the paper proves a matching lower bound. By my inference this rules out the conjectured √(log n/t) gap for
        t up to a fraction of n.
    searches:
    - lower bound boosting Hadamard matrices game value sub-matrix columns open problem Nie Warmuth
    - margin maximization boosting lower bound number of iterations sqrt(log n / t) game value Hadamard conjecture
      resolved
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  Seldin13:
    title: 'Open Problem: Adversarial Multiarmed Bandits with Limited Advice'
    authors:
    - Yevgeny Seldin
    - Koby Crammer
    - Peter Bartlett
    year: 2013
    url: https://proceedings.mlr.press/v30/Seldin13.html
    bandits: 'yes'
    statement: In adversarial multi-armed bandits with expert advice (K arms, N experts, T rounds), what regret
      is achievable if the learner may observe the advice of only M experts per round, 1 < M < N? This interpolates
      between O(sqrt(KT ln N)) for full advice and O(sqrt(NT)) for advice from one expert.
    status: resolved
    summary: Kale (COLT 2014, arXiv:1306.4653) solved the problem explicitly. An algorithm achieves regret Õ(sqrt(min{K,M}
      N T / M)), refined via PolyINF to 4 sqrt(min{K,M} N log(8M/min{K,M}) T / M). A lower bound of Ω̃(sqrt(min{K,M}
      N T / M)) shows this is tight up to log factors. The arXiv introduction states the lower bound with a min{K,
      M/log K} term, so the exact log factor should be checked in the paper. The bounds match both endpoint cases.
    papers:
    - title: Multiarmed Bandits With Limited Expert Advice
      year: 2014
      arxiv_id: '1306.4653'
      claim: Upper bound Õ(sqrt(min{K,M} N T / M)) and nearly matching lower bound Ω̃(sqrt(min{K,M} N T / M)) for
        bandits with M of N experts queried per round. This resolves the Seldin et al. COLT 2013 open problem.
    - title: Prediction with Limited Advice and Multiarmed Bandits with Paid Observations
      year: 2014
      arxiv_id: null
      claim: Related work by the open problem's authors (ICML 2014), apparently on prediction with limited advice
        (full-information) and bandits with paid observations. Seen only in search results, not opened. Not the
        direct resolution.
