    - title: Online Sparse Linear Regression
      year: 2016
      arxiv_id: '1603.02250'
      claim: Gives an inefficient Õ(√T)-regret algorithm and shows that unless NP ⊆ BPP, no algorithm running in
        polynomial time per round gets O(T^{1-δ}) regret, even with a logarithmic factor more feature access. This
        explicitly resolves Kale's COLT 2014 open problem.
    - title: 'Adaptive Feature Selection: Computationally Efficient Online Sparse Linear Regression under RIP'
