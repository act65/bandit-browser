    - claude-haiku-5-5
  frongillo16:
    title: 'Open Problem: Property Elicitation and Elicitation Complexity'
    authors:
    - Rafael Frongillo
    - Ian Kash
    - Stephen Becker
    year: 2016
    url: https://proceedings.mlr.press/v49/frongillo16.html
    bandits: 'no'
    statement: 'Characterize which statistics (properties) are elicitable, i.e. computable via ERM, especially vector-valued
      ones. Characterize which loss functions elicit them (e.g. convex ones). Determine elicitation complexity:
      how many ERM parameters are needed to compute a given statistic.'
    status: partially_resolved
    summary: Several concrete sub-questions have been answered. Finocchiaro & Frongillo (NeurIPS 2018) show that
      essentially every elicitable continuous real-valued property over a finite outcome space is convex-elicitable,
      with a constructive loss. Dearborn & Frongillo (AISM 2020) show that the mode and modal interval have infinite
      identifiable elicitation complexity. Finocchiaro, Frongillo & Waggoner (NeurIPS 2021) introduce d-flats, which
      give lower bounds on convex prediction dimension for variance, CVaR and other risk measures; the abstract
      says this resolves a question from Frongillo & Kash (2015). Frongillo & Kash (Biometrika 2021) give tight
      complexity bounds for Bayes risks. However, the general characterization of elicitable vector-valued properties,
      and of the losses that elicit them, still appears to be open. I found no 2020–2026 paper claiming it, though
      the search focused on Frongillo and co-authors.
    papers:
    - title: Convex Elicitation of Continuous Properties
      year: 2018
      arxiv_id: null
      claim: For continuous real-valued properties over a finite outcome space, essentially every elicitable property
        admits a convex eliciting loss; the proof constructs the loss.
    - title: On the Indirect Elicitability of the Mode and Modal Interval
      year: 2020
      arxiv_id: '1804.07742'
      claim: The mode has infinite elicitation complexity with respect to identifiable functionals; neither the
        mode nor a modal interval is indirectly elicitable.
    - title: Unifying Lower Bounds on Prediction Dimension of Convex Surrogates
      year: 2021
      arxiv_id: '2102.08218'
      claim: Introduces d-flats to lower-bound convex consistency dimension; gives new bounds for risk measures
        (variance, CVaR); the abstract says this resolves a question of Frongillo & Kash (2015).
    - title: Elicitation Complexity of Statistical Properties
      year: 2021
      arxiv_id: '1506.07212'
      claim: Journal version (Biometrika) with tight elicitation-complexity bounds for Bayes risks, including spectral
        risk measures; still describes the general vector-valued characterization as open.
    searches:
    - elicitation complexity characterization elicitable properties Frongillo Kash open problem progress
    - Finocchiaro Frongillo convex elicitation continuous properties; elicitation complexity lower bounds identifiable
    - mode infinite elicitation complexity Annals Institute Statistical Mathematics
    - characterization of elicitable vector-valued properties multivariate elicitability open problem 2020..2025
    - Finocchiaro Frongillo Waggoner unifying lower bounds prediction dimension convex surrogates elicitation
    checked: '2026-10-23'
