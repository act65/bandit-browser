  open-problem-fountoulakis22a:
    title: 'Open Problem: Running time complexity of accelerated $\ell_1$-regularized PageRank'
    authors:
    - Kimon Fountoulakis
    - Shenghao Yang
    year: 2022
    url: https://proceedings.mlr.press/v178/open-problem-fountoulakis22a.html
    bandits: 'no'
    statement: Can an accelerated proximal-gradient method (or another accelerated algorithm) compute the ℓ1-regularized
      Personalized PageRank vector in Õ((√α ρ)^{-1}) total running time? The time must not depend on the graph size,
      and the target bound improves on ISTA's Õ((αρ)^{-1}). The paper also asks whether the standard accelerated
      method could be worse than ISTA in the worst case.
    status: resolved
    summary: 'The question looks answered, but the main evidence comes from two September 2026 arXiv preprints whose
      proofs I have not checked.


      **Earlier partial progress**

      - **2023:** Martínez-Rubio, Wirth and Pokutta (COLT 2023) gave the first accelerated sparse method. It gets
      the 1/√α dependence, but a 2026 paper says its dependence on 1/ρ is larger than the target.

      - **2025:** Huang et al. (NeurIPS 2025) gave accelerated evolving-set methods with Õ(R²/(√α ε²)) time. That
      is a different accuracy-based setting, not the ℓ1-regularized formulation.


      **The "worse in the worst case" sub-question (answered)**

      Fountoulakis and Martínez-Rubio (arXiv 2602.21138, 2026) built instances where standard FISTA is asymptotically
      worse than ISTA. So the answer for classical acceleration is yes, it can be worse. For a slightly over-regularized
      objective, under a confinement condition, they prove an accelerated bound of (ρ√α)^{-1} log(α/ε) plus an extra
      boundary term.


      **The main question (claimed resolved)**

      - "Accelerating the Local Push Primitive for PageRank Computation" (arXiv 2609.12076) says in its abstract
      that its method solves ℓ1-regularized PageRank in Õ(1/(√α ρ)) time, giving "a positive answer to the open
      problem posed by Fountoulakis and Yang (COLT 2022)". The abstract leaves it unclear whether this ℓ1 guarantee
      is deterministic or holds only with high probability.

      - "Accelerated Local Algorithms for Personalized and Regularized PageRank" (arXiv 2609.14918) claims a deterministic
      Õ(1/(ρ√α)) local-work bound for regularized PPR. Its abstract does not name the ℓ1 norm or mention the open
      problem.


      I''m calling this resolved based on what these abstracts claim.'
    papers:
    - title: Accelerated and Sparse Algorithms for Approximate Personalized PageRank and Beyond
      year: 2023
      arxiv_id: '2303.12875'
      claim: An accelerated algorithm with sparse updates for ℓ1-regularized PPR. Per the 2602.21138 abstract, it
        gets the 1/√α dependence but a worse dependence on 1/ρ (partial answer).
    - title: Accelerated Evolving Set Processes for Local PageRank Computation
      year: 2025
      arxiv_id: '2510.08010'
      claim: Local PPR approximation in Õ(R²/(√α ε²)) time, independent of graph size. This is a related accelerated
        result in an accuracy-based setting.
    - title: Complexity of Classical Acceleration for ℓ1-Regularized PageRank
      year: 2026
      arxiv_id: '2602.21138'
      claim: Builds instances where standard FISTA is asymptotically worse than ISTA. Gives an accelerated bound
        plus a boundary overhead under a confinement condition.
    - title: Accelerating the Local Push Primitive for PageRank Computation
      year: 2026
      arxiv_id: '2609.12076'
      claim: Claims Õ(1/(√α ρ)) running time for ℓ1-regularized PageRank, explicitly a positive answer to the Fountoulakis–Yang
        COLT 2022 open problem.
    - title: Accelerated Local Algorithms for Personalized and Regularized PageRank
      year: 2026
      arxiv_id: '2609.14918'
      claim: A deterministic algorithm for regularized PPR with Õ(1/(ρ√α)) local work; accuracy enters only polylogarithmically.
    searches:
    - accelerated l1-regularized PageRank running time open problem Fountoulakis solved
    - accelerated local personalized PageRank complexity O(1/(sqrt(alpha) rho)) 2025
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  open-problem-marinov22a:
    title: 'Open Problem: Finite-Time Instance Dependent Optimality for Stochastic Online Learning with Feedback
      Graphs'
    authors:
    - Teodor Vanislavov Marinov
    - Mehryar Mohri
    - Julian Zimmert
    year: 2022
    url: https://proceedings.mlr.press/v178/open-problem-marinov22a.html
    bandits: 'yes'
    statement: 'The setting is stochastic online learning with feedback graphs, where playing an arm also reveals
      the losses of its neighbours. Asymptotically optimal instance-dependent regret is already known for this setting.
      The problem asks for two things: (1) a characterization of the optimal finite-time, instance-dependent regret;
      (2) a characterization of the graphs for which finite-time regret can be bounded by the asymptotically optimal
      rate (c*) at reasonable time horizons.'
    status: open
    summary: I found no later paper that answers either question. The most relevant work is the same authors' NeurIPS
      2022 paper (arXiv 2206.10022), which came out at the same time as the open problem. It shows that optimal
      finite-time regret has no unique definition and can be decoupled from the asymptotic rate. It also gives an
      instance where a different quantity, d*, dominates the asymptotic constant c* for every T up to exp(K^{1/8}).
      For one chosen notion of finite-time optimality, it gives an algorithm that is close to optimal both in finite
      time and asymptotically. These results are the motivation for the open problem, not a full characterization.
      Later work I found only deals with asymptotic optimality, such as the 2025 paper on Gaussian bandits with
      side observations, or with different objectives, such as pure exploration with feedback graphs (arXiv 2503.07824).
      Neither describes the finite-time optimal regret or the class of graphs where finite-time regret matches the
      asymptotic rate. I ran only three searches, so I may have missed a follow-up.
    papers:
    - title: 'Stochastic Online Learning with Feedback Graphs: Finite-Time and Asymptotic Optimality'
      year: 2022
      arxiv_id: '2206.10022'
      claim: Published at the same time as the open problem, by the same authors. Shows the finite-time optimality
        notion is not uniquely defined and is decoupled from the asymptotic rate, and gives an instance where d*
        >> c* dominates for T up to exp(K^{1/8}). Proposes one finite-time optimality notion with an algorithm that
        is close to optimal both in finite time and asymptotically. Partial progress only, not a characterization.
    - title: Asymptotically-Optimal Gaussian Bandits with Side Observations
      year: 2025
      arxiv_id: '2505.10698'
      claim: Gives an asymptotically optimal algorithm for Gaussian bandits with general side observations. The
        abstract mentions only asymptotic guarantees, not finite-time optimality.
    searches:
    - finite-time instance dependent regret stochastic feedback graphs optimal
    - feedback graphs stochastic instance-optimal finite-time regret characterization 2024 2025
    - stochastic bandits feedback graph instance-dependent regret asymptotically optimal finite-time Marinov open
      problem follow-up
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  open-problem-qin22a:
    title: 'Open Problem: Optimal Best Arm Identification with Fixed-Budget'
    authors:
    - Chao Qin
    year: 2022
    url: https://proceedings.mlr.press/v178/open-problem-qin22a.html
    bandits: 'yes'
    statement: Characterize the instance-dependent asymptotic complexity of fixed-budget best arm identification.
      Specifically, is there an algorithm that attains the conjectured optimal error exponent, given by the static
      oracle allocation, on every instance? In other words, does fixed-budget BAI admit a complexity, as the fixed-confidence
      setting does?
    status: resolved
    summary: 'The answer is negative. Degenne (COLT 2023) formalized the question and showed that any complexity,
      if it exists, must be the one set by the best static (non-adaptive) allocation. He also showed that no complexity
      exists in some cases, such as two-arm Bernoulli BAI. A July 2026 preprint by Goldberger (arXiv 2607.11635)
      covers K ≥ 3 arms with one-parameter exponential-family rewards. It shows that every algorithm has an instance
      where its error decays at most (1 + log K/8)^-1 times as fast as the static oracle''s. The paper states that
      this answers Qin''s open question: fixed-budget BAI does not admit a complexity. The preprint does not appear
      to be peer reviewed yet.'
    papers:
    - title: On the Existence of a Complexity in Fixed Budget Bandit Identification
      year: 2023
      arxiv_id: '2303.09468'
      claim: Formalizes Qin's question. Shows that any complexity, if it exists, is the one set by the best non-adaptive
        allocation, and that no complexity exists for some tasks, including two-arm Bernoulli BAI.
    - title: Fundamental Limitations of Fixed-Budget Best-Arm Identification
      year: 2026
      arxiv_id: '2607.11635'
      claim: 'For K>=3 arms and any one-parameter exponential family, every algorithm has an instance where its
        error rate is at most (1+log(K)/8)^-1 times the static oracle''s. States that this answers Qin (2022): fixed-budget
        BAI admits no complexity.'
    searches:
    - fixed budget best arm identification complexity Qin conjecture answered
    - On the Existence of a Complexity in Fixed Budget Bandit Identification Degenne
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  open-problem-sanyal22a:
    title: 'Open Problem: Do you pay for Privacy in Online learning?'
    authors:
    - Amartya Sanyal
    - Giorgia Ramponi
    year: 2022
    url: https://proceedings.mlr.press/v178/open-problem-sanyal22a.html
    bandits: adjacent
    statement: 'In the mistake-bound online learning model, is differentially private online learnability equivalent
      to non-private online learnability? Put another way, is privacy free: can a private learner get the same mistake
      bounds (independent of T) that non-private learners get for Littlestone classes?'
    status: resolved
    summary: 'The problem has been answered negatively: privacy is not free. Golowich and Livni had already shown
      that Littlestone classes can be learned privately with O(log T) mistakes. Non-private learners, by contrast,
      make a number of mistakes that does not depend on T. Dmitriev, Szabó and Sanyal (COLT 2024) proved an Ω(log
      T) lower bound on the expected mistakes of a broad class of (ε,δ)-DP online learners, provided log T is O(1/δ).
      This matches the upper bound and shows that mistakes must grow with T, even for simple classes. Li, Wang and
      Ye (arXiv 2411.05483, 2024/25) removed the restriction to specific algorithms. They showed that, for almost
      every hypothesis class, any private online learner makes an unbounded number of mistakes, and they gave an
      Ω(LD(H) log T) lower bound. They also found a class that is online learnable under approximate DP but not
      under pure DP against adaptive adversaries. On the upper-bound side, Lyu (2025) brought the private mistake
      bound down to Õ(d^9.5 log T), which is polynomially close to the lower bound. These results answer the quantitative
      question posed: you pay at least a log T factor. Some finer questions remain open, such as the exact dependence
      on the Littlestone dimension and what happens against adaptive adversaries. I verified the Li–Wang–Ye abstract
      myself; the other claims come from search snippets.'
    papers:
    - title: 'On the Growth of Mistakes in Differentially Private Online Learning: A Lower Bound Perspective'
      year: 2024
      arxiv_id: '2402.16778'
      claim: Proves an Ω(log T) lower bound on the expected mistakes of a broad class of (ε,δ)-DP online learners,
        provided log T is O(1/δ). This matches the Golowich–Livni upper bound and separates private from non-private
        online learning (COLT 2024).
    - title: The Limits of Differential Privacy in Online Learning
      year: 2024
      arxiv_id: '2411.05483'
      claim: Shows that private online learners make unboundedly many mistakes for almost every hypothesis class,
        with an Ω(LD(H) log T) lower bound. Also gives a separation between pure and approximate DP against adaptive
        adversaries.
    - title: Private Learning of Littlestone Classes, Revisited
      year: 2025
      arxiv_id: null
      claim: Gives a realizable private mistake bound of Õ(d^9.5 log T) under approximate DP, polynomially close
        to the lower bound.
    searches:
    - differentially private online learning mistake bound lower bound log T Littlestone thresholds
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  open-problem-vakili22a:
    title: 'Open Problem: Regret Bounds for Noise-Free Kernel-Based Bandits'
    authors:
    - Sattar Vakili
    year: 2022
    url: https://proceedings.mlr.press/v178/open-problem-vakili22a.html
    bandits: 'yes'
    statement: For kernel-based (GP) bandits where the reward function lies in a known RKHS and observations have
      no noise, what is the order-optimal cumulative regret? Vakili conjectured a rate (for Matérn-type kernels,
      roughly matching the known lower bounds of Bull and Tuo & Wang), and also an upper bound on the sum of posterior
      standard deviations Σ_T, which would imply it.
    status: resolved
    summary: 'The main question has been answered, up to logarithmic factors. Salgia, Vakili & Zhao (arXiv 2310.15351,
      ICML 2024) propose REDS (Random Exploration with Domain Shrinking). In the noise-free case it gets cumulative
      regret Õ(max{T^((3−β)/2), 1}), which matches the lower bound of Tuo & Wang (2020). The arXiv abstract says
      this "resolves" the COLT open problem. The OpenReview version is more careful: it says "partially resolves",
      under a mild assumption on the function.


      Two papers by Iwazaki in 2025 build on this:

      - With Takeno (ICML 2025, arXiv 2502.06363), refined MVR and phased-elimination algorithms get nearly optimal
      noiseless regret.

      - On its own (NeurIPS 2025, arXiv 2502.19006), it shows that plain GP-UCB, an adaptive algorithm, is also
      nearly optimal without noise. This includes constant cumulative regret for the SE kernel and for Matérn kernels
      with enough smoothness.


      A smaller sub-question may still be open. A cascaded-bandits follow-up (arXiv 2211.05430) says Salgia et al.
      left open both the separate conjecture on Σ_T and whether GP-UCB gets the same rate. The 2025 GP-UCB paper
      appears to answer the GP-UCB part. I did not check whether the Σ_T bound itself has been proved. Overall,
      the order-optimal regret question as posed counts as resolved, up to log factors.'
    papers:
    - title: 'Random Exploration in Bayesian Optimization: Order-Optimal Regret and Computational Efficiency'
      year: 2024
      arxiv_id: '2310.15351'
      claim: REDS reaches noise-free cumulative regret Õ(max{T^((3−β)/2),1}), matching the Tuo & Wang lower bound.
        The arXiv abstract says it resolves the COLT open problem; the OpenReview version says it partially resolves
        it under a mild assumption.
    - title: 'Improved Regret Analysis in Gaussian Process Bandits: Optimality for Noiseless Reward, RKHS norm,
        and Non-Stationary Variance'
      year: 2025
      arxiv_id: '2502.06363'
      claim: Refined MVR and phased-elimination algorithms get nearly optimal regret upper bounds in the noiseless
        setting (ICML 2025).
    - title: Gaussian Process Upper Confidence Bound Achieves Nearly-Optimal Regret in Noise-Free Gaussian Process
        Bandits
      year: 2025
      arxiv_id: '2502.19006'
      claim: Plain GP-UCB is nearly optimal in noise-free GP bandits, with constant cumulative regret for the SE
        kernel and for Matérn kernels with enough smoothness (NeurIPS 2025).
    - title: Regret Bounds for Noise-Free Cascaded Kernelized Bandits
      year: 2022
      arxiv_id: '2211.05430'
      claim: Says Salgia et al. reach the conjectured cumulative regret but leave open the Σ_T conjecture and whether
        GP-UCB gets the same rate.
    searches:
    - noise-free kernel bandits optimal regret bound conjecture Vakili
    - Iwazaki noiseless Gaussian process bandits regret optimality upper confidence bound
    - Salgia Vakili Zhao random exploration noise-free kernel bandits regret 2023
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  open-problem-agarwal21b:
    title: 'Open Problem: Are all VC-classes CPAC learnable?'
    authors:
    - Sushant Agarwal
    - Nivasini Ananthakrishnan
    - Shai Ben-David
    - Tosca Lechner
    - Ruth Urner
    year: 2021
    url: https://proceedings.mlr.press/v134/open-problem-agarwal21b.html
    bandits: 'no'
    statement: Does there exist a decidable/computable concept class of computable classifiers with finite VC dimension
      that is not (improperly) CPAC learnable by any computable learner? Additionally, find combinatorial characterizations
      of learnability with computable learners.
    status: resolved
    summary: 'The answer to the main question is negative: not all VC classes are CPAC learnable. Sterkenburg (COLT
      2022) explicitly gave a negative answer to this open problem, with a decidable class of VC dimension 1 that
      is not improperly CPAC learnable. He also characterized the related notion of strong CPAC learnability, but
      left open whether CPAC and strong CPAC learnability coincide. Delle Rose, Kozachinskiy, Rojas and Steifer
      (COLT 2023) strengthened this with a decidable class of finite Littlestone dimension that is not improperly
      CPAC learnable. They also showed that every improperly CPAC learnable class is contained in a properly CPAC
      learnable class with polynomial sample complexity, confirming a conjecture by Agarwal et al. (COLT 2021).
      The authors say these results complete the picture of CPAC learnability. Whether the characterization sub-question
      is fully closed was not confirmed in this session.'
    papers:
    - title: On characterizations of learnability with computable learners
      year: 2022
      arxiv_id: '2202.05041'
      claim: 'Gives a negative answer to the Agarwal et al. (2021) COLT open problem: there is a decidable class
        of finite VC dimension (VC dimension 1) that is not improperly CPAC learnable. Also characterizes strong
        CPAC learnability.'
    - title: 'Find a witness or shatter: the landscape of computable PAC learning'
      year: 2023
      arxiv_id: '2302.04731'
      claim: Constructs a decidable class of finite Littlestone dimension that is not improperly CPAC learnable,
        strengthening Sterkenburg. Shows every improperly CPAC learnable class is contained in a properly CPAC learnable
        class with polynomial sample complexity, confirming a conjecture by Agarwal et al. (COLT 2021). Shows a
        decidable class can be properly CPAC learnable only with uncomputably growing sample complexity, answering
        a question from Sterkenburg.
