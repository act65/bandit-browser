      is a statistical guarantee for a close variant of priming.


      That guarantee is in a later paper by the same authors with Kotłowski and Jones: "Noise misleads rotation
      invariant algorithms on sparse targets" (arXiv 2403.02697). It proves, in a batch setting with Gaussian noise
      and a sparse target, an expected-loss upper bound for priming that matches its bound for the spindly network.
      Its version of priming uses tuned ridge regression as the second step, not plain least squares, and the proof
      is in Appendix G, which I could not read. That paper mentions online regret only for EG±, not for priming.
      Its open-problems section does not cover priming''s online regret, and it does not say that question is settled.


      I found no other work giving online regret bounds for priming. So the statistical version of the question
      is answered, and the online regret question as posed is still unresolved.'
