# COLT open problems and their status (pipeline/open_problems.py). LLM web search, not human-verified.
problems:
  arvanitakis26a:
    title: 'Open Problem: How much overparametrization is needed for ALS in tensor decomposition?'
    authors:
    - Dionysis Arvanitakis
    - Vaidehi Srinivas
    - Aravindan Vijayaraghavan
    year: 2026
    url: https://proceedings.mlr.press/v336/arvanitakis26a.html
    bandits: 'no'
    statement: For a rank-r third-order n×n×n tensor (r ≪ n), prove that ALS or gradient descent with random initialization
      converges globally when the overparameterized rank is k = o(r²). Alternatively, show that k = Ω(r^{1+c}) is
      necessary for some absolute constant c > 0.
    status: open
    summary: The best known result is the authors' own NeurIPS 2025 paper, which gets k = O(r²) for ALS. Before
      that, Wang et al. (2020) needed k = O(r^7.5 log n) for a gradient-descent variant. Searches found no later
      paper proving convergence with k = o(r²) or a lower bound of k = Ω(r^{1+c}). The problem appears to be open
      as of October 2026.
    papers:
    - title: Guarantees for Alternating Least Squares in Overparameterized Tensor Decompositions
      year: 2025
      arxiv_id: null
      claim: ALS with random initialization and overparameterized rank k=O(r^2) converges to a global optimum with
        high probability for rank-r n×n×n tensors (the baseline the open problem asks to improve).
    - title: Beyond Lazy Training for Over-parameterized Tensor Decomposition
      year: 2020
      arxiv_id: '2010.11356'
      claim: A variant of gradient descent converges globally with overparameterization k=O(r^{7.5} log n) for third-order
        tensors.
    searches:
    - overparameterized alternating least squares tensor decomposition rank o(r^2) convergence
    - overparameterized tensor decomposition gradient descent lower bound overparametrization rank r^{1+c} 2026
    - '"alternating least squares" overparameterized tensor decomposition near-linear rank global convergence random
      initialization'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  lau26a:
    title: 'Open Problem: Is Interaction Necessary for Order-Optimal 1-bit Mean Estimation?'
    authors:
    - Ivan Lau
    - Jonathan Scarlett
    year: 2026
    url: https://proceedings.mlr.press/v336/lau26a.html
    bandits: 'no'
    statement: Can fully non-adaptive arbitrary 1-bit quantizers match the order-optimal adaptive 1-bit minimax
      rate for mean estimation over nonparametric finite-moment classes? Or is one adaptive transition (two stages)
      necessary?
    status: resolved
    summary: 'Resolved positively: interaction is not necessary. Miao (arXiv 2607.24358, July 2026) gives a fully
      non-adaptive public-coin protocol with arbitrary measurable 1-bit queries. Its abstract says it answers the
      Lau–Scarlett open problem in the affirmative for finite k-th central moments, k>1. Lau & Scarlett (arXiv 2609.08564,
      Sept 2026) independently show that for every k>1 a non-adaptive protocol attains the adaptive 1-bit minimax
      rate. They also characterize the tradeoff between sample complexity and the number of intervals per query,
      and they mention other concurrent works reaching the same conclusion. Based on the abstracts only; the proofs
      were not checked.'
    papers:
    - title: 'Universal Refinement without Interaction: Order-Optimal 1-Bit Mean Estimation'
      year: 2026
      arxiv_id: '2607.24358'
      claim: A fully non-adaptive public-coin protocol with arbitrary measurable 1-bit queries reaches the order-optimal
        rate. The abstract says this answers the Lau–Scarlett open problem in the affirmative.
    - title: 'Non-Adaptive 1-Bit Mean Estimation: Minimax Rates and the Sample-Interval Tradeoff'
      year: 2026
      arxiv_id: '2609.08564'
      claim: For every k>1, a non-adaptive protocol attains the adaptive 1-bit minimax rate. The paper also gives
        the sample-interval tradeoff, with an added term of order (λσ/(sε²))·log(1/δ) when each query uses at most
        s intervals.
    searches:
    - non-adaptive 1-bit mean estimation arbitrary quantizers minimax rate finite moment
    - Lau Scarlett 1-bit mean estimation adaptive two-stage
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  froese25b:
    title: 'Open Problem: Fixed-Parameter Tractability of Zonotope Problems'
    authors:
    - Vincent Froese
    - Moritz Grillo
    - Christoph Hertrich
    - Martin Skutella
    year: 2025
    url: https://proceedings.mlr.press/v291/froese25b.html
    statement: Are zonotope problems that come from 1-hidden-layer ReLU networks fixed-parameter tractable in the
      input dimension d, i.e. solvable in f(d)·n^{O(1)} time? The problems are zonotope (non-)containment, which
      is equivalent to deciding whether the network attains a positive output, and norm maximization over a zonotope,
      which is tied to computing the network's Lipschitz constant. They are known to be NP-hard in general and polynomial-time
      solvable for constant d.
    status: resolved
    bandits: 'no'
    summary: 'The answer is negative: these problems are not FPT in the input dimension unless FPT = W[1].


      **Containment and positivity.** Froese, Grillo, Hertrich and Stargalla (arXiv 2509.22849, ICLR 2026) show
      that deciding positivity of a ReLU network with ℓ ≥ 2 layers is W[ℓ−1]-hard when parameterized by the input
      dimension d. The ℓ = 2 case means zonotope (non-)containment is W[1]-hard in d. Their abstract says this resolves
      the open problem posed by Froese et al. at COLT 2025.


      **Maximum and Lipschitz constant.** The same paper shows that approximating the maximum to any multiplicative
      factor, and computing the L_p-Lipschitz constant for p in (0,∞], are NP-hard and W[1]-hard in d for 2-layer
      networks.


      **Norm maximization over zonotopes.** A follow-up by Das et al. (arXiv 2608.24865) covers the remaining case.
      For every fixed rational p in (1,∞), maximizing the L_p-norm over a zonotope in R^d is W[1]-hard in d. Equivalently,
      computing L_p-Lipschitz constants of 2-layer input-convex networks is W[1]-hard. L_1 maximization was already
      known to be FPT and L_∞ maximization polynomial-time.


      Both papers say that, under the Exponential Time Hypothesis, brute-force enumeration is essentially optimal.
      Small gaps remain: irrational p is not covered, and membership in W[1] is not addressed. The question as posed
      is still answered.'
    papers:
    - title: Parameterized Hardness of Zonotope Containment and Neural Network Verification
      year: 2025
      arxiv_id: '2509.22849'
      claim: Positivity of 2-layer ReLU networks, and therefore zonotope non-containment, is W[1]-hard in input
        dimension d. Approximating the maximum and computing L_p-Lipschitz constants (p in (0,∞]) are NP-hard and
        W[1]-hard in d. The abstract says this resolves the COLT'25 open problem. Published at ICLR 2026.
    - title: Parameterized Complexity of L_p-Lipschitz Constants for Input Convex Neural Networks and L_p-Norm Maximization
        over Zonotopes
      year: 2026
      arxiv_id: '2608.24865'
      claim: For every fixed rational p in (1,∞), L_p-norm maximization over a zonotope is W[1]-hard in dimension
        d, as is the equivalent problem of computing Lipschitz constants of 2-layer ICNNs. L_1 maximization was
        already known to be FPT and L_∞ maximization polynomial-time.
    searches:
    - parameterized hardness zonotope containment W[1]-hard dimension ReLU Lipschitz
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  genalti25a:
    title: 'Open Problem: Regret Minimization in Heavy-Tailed Bandits with Unknown Distributional Parameters'
    authors:
    - Gianmarco Genalti
    - Alberto Maria Metelli
    year: 2025
    url: https://proceedings.mlr.press/v291/genalti25a.html
    bandits: 'yes'
    statement: 'In heavy-tailed multi-armed bandits, rewards have bounded raw moments of order 1+ε, with bound u.
      When ε and u are unknown and no extra assumptions are made, what is the best regret an algorithm can achieve,
      and which algorithms achieve it? A further question: what is the weakest additional assumption under which
      the rates achievable with known parameters can be recovered?'
    status: partially_resolved
    summary: 'The same authors (Genalti & Metelli) posted "Parameter-Free Heavy-Tailed Bandits" (arXiv 2607.29460,
      July 2026), which I could only find as a preprint. They say it settles the first two of the open problem''s
      three questions: the best rates achievable without assumptions, and algorithms that reach them.


      **Unknown u:** They prove a sharp trade-off between distribution-dependent and distribution-free regret for
      any algorithm that does not know u. A scheduled-exploration algorithm matches this trade-off up to log factors.


      **Unknown ε:** The same algorithm, with its schedule tuned for ε=1, gets sublinear regret for every fixed
      ε>0. No algorithm can guarantee sublinear regret uniformly over all ε in (0,1]. The authors also note that
      this algorithm is not minimax-optimal at every ε.


      **Still open, by the authors'' own account:** the third question, finding the weakest extra assumption under
      which the known-parameter rates can be recovered, and an anytime version of their algorithm.


      Related earlier work: the (ε,u)-adaptive heavy-tailed bandits paper (arXiv 2310.02975) and a 2025 heavy-tailed
      linear bandits paper (arXiv 2508.13679).'
    papers:
    - title: Parameter-Free Heavy-Tailed Bandits
      year: 2026
      arxiv_id: '2607.29460'
      claim: For unknown u, proves a trade-off between distribution-dependent and distribution-free regret for algorithms
        that do not know u, and gives a scheduled-exploration algorithm matching it up to log factors. For unknown
        ε, gets sublinear regret for each fixed ε and shows uniform sublinear regret over ε in (0,1] is impossible.
        The authors say this resolves the first two questions of the COLT 2025 open problem and leaves the third
        (the weakest extra assumption) open.
    searches:
    - heavy-tailed bandits unknown epsilon u adaptive regret 2025 2026
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  gu25b:
    title: 'Open Problem: Structure-Agnostic Minimax Risk for Partial Linear Model'
    authors:
    - Yihong Gu
    year: 2025
    url: https://proceedings.mlr.press/v291/gu25b.html
    bandits: 'no'
    statement: Determine the structure-agnostic minimax risk for estimating the linear coefficient in the partial
      linear model with black-box nuisance estimators. In particular, is double machine learning optimal, given
      the role of variance that earlier lower bounds do not address?
    status: resolved
    summary: 'Hu & Simchi-Levi (arXiv 2609.07997, 2026) derive the sharp structure-agnostic minimax risk for the
      partial linear coefficient, with separate black-box learners for the outcome and treatment nuisances. The
      rate is 1 ∧ {1/n + (a_μ a_π + min{a_π s_μ + s_π², a_μ s_π + s_μ²})²}, where the a terms are approximation-error
      budgets and the s terms are stochastic-error budgets. It matches the upper bound of Gu (2026), which is probably
      Gu, Yin, Cai & Fan (arXiv 2606.06368); that paper gives an estimator sharper than DML plus a matching lower
      bound. Hu & Simchi-Levi''s abstract explicitly claims to resolve Gu''s (2025) open problem; I have not checked
      the proofs. The answer is that standard DML can overstate the difficulty, so it is not optimal in general.
      Related work: arXiv 2507.02275 shows DML is optimal under Gaussian treatment noise but suboptimal under independent
      non-Gaussian noise.'
    papers:
    - title: Sharp Structure-Agnostic Minimax Risk for Partial Linear Models
      year: 2026
      arxiv_id: '2609.07997'
      claim: Derives the sharp structure-agnostic minimax rate for the partial linear coefficient with two separate
        black-box nuisance learners, using a lower bound built from four finite-mixture testing experiments. The
        rate matches Gu (2026)'s upper bound, and the abstract explicitly claims to resolve Gu (2025)'s open problem.
    - title: Optimally taming biases in black-box models for efficient semiparametric estimation
      year: 2026
      arxiv_id: '2606.06368'
      claim: Proposes an estimator for the structure-agnostic partial linear model with a sharper error rate than
        standard DML, and claims a matching lower bound showing it is optimal. The abstract does not use the words
        'minimax' or 'open problem'; this is probably the 'Gu (2026)' upper bound, but that is unconfirmed.
    - title: 'It''s Hard to Be Normal: The Impact of Noise on Structure-agnostic Estimation'
      year: 2025
      arxiv_id: '2507.02275'
      claim: DML is minimax rate-optimal under Gaussian treatment noise but suboptimal under independent non-Gaussian
        treatment noise.
    - title: Sharp Structure-Agnostic Lower Bounds for General Functional Estimation
      year: 2025
      arxiv_id: '2512.17341'
      claim: Structure-agnostic lower bounds for general functionals; in a mixed-bias regime, DML's doubly robust
        rate is minimax-optimal.
    searches:
    - structure-agnostic minimax lower bound partial linear model double machine learning variance optimal
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  hanneke25e:
    title: 'Open Problem: Data Selection for Regression Tasks'
    authors:
    - Steve Hanneke
    - Shay Moran
    - Alexander Shlimovich
    - Amir Yehudayoff
    year: 2025
    url: https://proceedings.mlr.press/v291/hanneke25e.html
    bandits: 'no'
    statement: Given a natural learning rule A (e.g., ERM / least squares / empirical mean) and a selection budget
      n, how well can A perform when trained on n examples selected from a larger dataset of N examples? The note
      poses concrete questions for mean estimation and linear regression, e.g. exact selection profiles and recovery
      thresholds, including vector-valued regression with weighted selection.
    status: partially_resolved
    summary: 'The companion paper "Data Selection for ERMs" (arXiv 2504.14572) proves optimal bounds for mean estimation
      and scalar linear regression. Leftover open pieces include exact bounds for budgets between d and 2d and exact
      constants for mean estimation in fixed dimension. A 2026 preprint by Guangjian Zhang (arXiv 2608.30254) says
      it resolves the threshold part of Question 4: in vector-valued linear regression (d inputs, m outputs, minimum-Frobenius-norm
      least squares), exactly (m+1)d weighted examples are needed to reproduce the full-data loss on every dataset.
      It also determines the selection profile at budgets d and (m+1)d-1. For d=2, m=2 it only gives bounds and
      reduces the conjectured values to a finite moment problem. Its claims were read on a third-party summary page,
      not arXiv, and its date and review status were not confirmed. A second 2026 paper (Inane et al., arXiv 2610.30442)
      studies whether a selector can find a good subset, not whether one exists. In the ~100,000 of ~157,000 characters
      read, it does not claim to settle the note''s questions. Other sub-questions appear open.'
    papers:
    - title: Data Selection for ERMs
      year: 2025
      arxiv_id: '2504.14572'
      claim: Companion paper by the same authors. Proves optimal data-selection bounds for mean estimation, linear
        classification and linear regression, and lists open questions such as exact bounds for budgets between
        d and 2d and exact constants for mean estimation in fixed dimension.
    - title: Exact Recovery Thresholds for Weighted Data Selection in Vector-Valued Linear Regression
      year: 2026
      arxiv_id: '2608.30254'
      claim: 'Says it resolves the threshold part of Question 4 of the COLT 2025 open problem: the minimal weighted-selection
        budget for exact recovery in vector-valued linear regression is (m+1)d. Also gives profile values d+1 at
        budget d and 1+1/(dm^2) at budget (m+1)d-1. For (d,m)=(2,2) it only gives bounds. Claims read from a third-party
        summary page, not arXiv; date and review status unconfirmed.'
    - title: 'Towards Faithful Data Selection: Statistical Limits and Scalable Algorithms'
      year: 2026
      arxiv_id: '2610.30442'
      claim: Builds on Hanneke et al. but asks whether a data selector can find a good subset, not whether one exists.
        Gives a lower bound showing selection can be statistically hard without a large validation set. In the ~100,000
        of ~157,000 characters read, it does not claim to resolve the open problems.
    searches:
    - data selection regression mean estimation linear regression selected subset learning rule Hanneke Moran Yehudayoff
    - '"data selection" open problem COLT 2025 regression solved mean estimation least squares subset selection
      budget'
    - '"data selection" "Hanneke" open problem mean estimation weighted selection profile preprint 2026 arXiv'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  maiti25b:
    title: 'Open Problem: Optimal Instance-Dependent Sample Complexity for finding Nash Equilibrium in Two Player
      Zero-Sum Matrix games'
    authors:
    - Arnab Maiti
    year: 2025
    url: https://proceedings.mlr.press/v291/maiti25b.html
    bandits: 'yes'
    statement: Find the optimal instance-dependent sample complexity for finding an approximate Nash equilibrium
      in a two-player zero-sum matrix game, where the payoff matrix can only be accessed through noisy samples.
      This generalises instance-dependent best-arm identification in multi-armed bandits.
    status: open
    summary: 'Before the open problem was posed, earlier work by Maiti, Jamieson and Ratliff (AISTATS 2023) had
      fully characterised 2×2 games and given partial results for n×2 games. Separate work by Maiti, Boczar, Jamieson
      and Ratliff found near-optimal results for the case of pure-strategy equilibria. The only later work I found
      is by Jiang and Zhang (NeurIPS 2025; arXiv 2602.12513, Feb 2026). They use a linear-programming method in
      two stages: first identify which actions are played at equilibrium, then solve for the equilibrium on those
      actions. For general m1×m2 games this needs O(m1·m2/(ε·min{δ², σ0², σ³})·log(m1·m2/ε)) samples. Here δ, σ0
      and σ are constants that depend on the particular game. The abstract only gives an upper bound: it doesn''t
      give a matching lower bound or claim to be optimal, and it doesn''t cite the open problem. So the optimal
      instance-dependent sample complexity for general games still seems to be unknown. Caveat: my search was limited,
      and I only checked the arXiv abstract page, not the full paper.'
    papers:
    - title: 'Instance-dependent Sample Complexity for Bilinear Saddle-Point Optimization with Noisy Feedback: An
        LP-Based Approach (arXiv version: An LP-Based Approach for Bilinear Saddle Point Problem with Instance-dependent
        Guarantee and Noisy Feedback)'
      year: 2026
      arxiv_id: '2602.12513'
      claim: Gives the first instance-dependent upper bound on samples for finding an equilibrium with ε bias in
        general m1×m2 zero-sum matrix games with noisy feedback, O(m1 m2/(ε min{δ²,σ0²,σ³}) log(m1 m2/ε)). The abstract
        claims no matching lower bound or optimality.
    - title: Instance-dependent Sample Complexity Bounds for Zero-sum Matrix Games
      year: 2023
      arxiv_id: '2303.10565'
      claim: Predates the open problem. Fully characterises instance-dependent sample complexity for 2×2 games and
        gives partial results for n×2 games.
    - title: 'Near-Optimal Pure Exploration in Matrix Games: A Generalization of Stochastic Bandits & Dueling Bandits'
      year: 2023
      arxiv_id: '2310.16252'
      claim: Predates the open problem. Gives near-optimal instance-dependent sample complexity, matching the lower
        bound up to log factors, for identifying a pure-strategy Nash equilibrium.
    searches:
    - instance-dependent sample complexity Nash equilibrium zero-sum matrix games noisy samples
    - Maiti open problem optimal instance-dependent sample complexity Nash equilibrium matrix games 2025 2026 arXiv
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  asilis24b:
    title: 'Open Problem: Can Local Regularization Learn All Multiclass Problems?'
    authors:
    - Julian Asilis
    - Siddartha Devic
    - Shaddin Dughmi
    - Vatsal Sharan
    - Shang-Hua Teng
    year: 2024
    url: https://proceedings.mlr.press/v247/asilis24b.html
    bandits: 'no'
    statement: Is local regularization (Asilis et al. 2024) expressive enough to learn every learnable multiclass
      problem, i.e., does it characterize multiclass (PAC) learnability the way ERM does for binary classification?
    status: resolved
    summary: 'Resolved negatively, but only by a preprint that has not been peer reviewed. First, Jafar, Asilis
      & Dughmi (COLT 2025) built a multiclass class that is learnable both transductively and in the PAC model,
      but that no local regularizer learns transductively. They left the PAC case open. Eric Hou (arXiv 2607.23449,
      July 2026) says this answers the Asilis et al. question in the negative for PAC learning. The class is countable,
      has DS dimension at most 2 and O((1/ε)log(1/δ)) realizable sample complexity, yet no local regularizer learns
      it. It uses edges of complete graphs as hypotheses and tournaments as instances. This rests on the arXiv abstract
      only: the PDF text would not extract, the proof is unchecked, and I found no peer-reviewed version.'
    papers:
    - title: Local Regularizers Are Not Transductive Learners
      year: 2025
      arxiv_id: '2502.07187'
      claim: Builds a multiclass problem that is learnable both transductively and in the PAC model, but that no
        local regularizer learns transductively. The construction uses cryptographic secret sharing. The PAC case
        is left open (COLT 2025).
    - title: Local Regularization Does Not Characterize Multiclass PAC Learnability
      year: 2026
      arxiv_id: '2607.23449'
      claim: Says it gives a negative answer to the Asilis et al. question for PAC learning. Builds a countable
        class with DS dimension at most 2 and O((1/ε)log(1/δ)) realizable sample complexity that no local regularizer
        learns. Not peer reviewed; claim taken from the arXiv abstract only.
    searches:
    - local regularization multiclass learnability open problem resolved
    - local regularizers PAC learning multiclass separation 2025 2026 Dughmi
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  azize24a:
    title: 'Open Problem: What is the Complexity of Joint Differential Privacy in Linear Contextual Bandits?'
    authors:
    - Achraf Azize
    - Debabrota Basu
    year: 2024
    url: https://proceedings.mlr.press/v247/azize24a.html
    bandits: 'yes'
    statement: Find the minimax regret of linear contextual bandits under (ε,δ)-joint differential privacy with
      adversarial contexts. The best known upper bound is O(d√T log T + d^{3/4}√(T log(1/δ))/√ε). The best known
      lower bound is Ω(√(dT log K) + d/(ε+δ)). The question is whether the privacy cost must grow with √T, or whether
      it can be an additive term that does not depend on T. A second gap is the √d factor in the non-private term.
    status: open
    summary: 'I found no later work that closes the gap for dense linear contextual bandits with adversarial contexts
      under joint DP (JDP).


      - **Sarmasarkar (arXiv 2602.00417, 2026):** gives a JDP algorithm for generalized linear contextual bandits
      with adversarial contexts. Its regret is Õ(d√T log T + d^{3/4}√(T/ε)·polylog). This carries the known linear-case
      upper bound over to GLMs, and the privacy term still grows with √T. The abstract does not mention a matching
      lower bound.

      - **FLIPHAT (Roy et al., AISTATS 2025):** settles a related sparse high-dimensional JDP setting up to sparsity
      and log factors. That is a different setting, not the problem as posed.

      - **Stochastic contexts:** according to the FLIPHAT paper, Hanna et al. (2024) achieve Õ(d√T + d²/ε). That
      is an additive privacy cost, but only under stochastic rather than adversarial contexts, which the open problem
      already covers.


      The adversarial-context question remains open. My searches may not have caught very recent preprints.'
    papers:
    - title: Shuffle and Joint Differential Privacy for Generalized Linear Contextual Bandits
      year: 2026
      arxiv_id: '2602.00417'
      claim: A JDP algorithm for generalized linear contextual bandits with adversarial contexts, with regret Õ(d√T
        log T + d^{3/4}√(T/ε)(log T)(d+log T)^{1/4}). This matches the known linear-case upper bound but does not
        close the gap to the lower bound.
    - title: 'FLIPHAT: Joint Differential Privacy for High Dimensional Sparse Linear Bandits'
      year: 2024
      arxiv_id: '2405.14038'
      claim: JDP lower bound and a near-matching upper bound for sparse high-dimensional linear bandits, optimal
        up to a linear factor in sparsity and log factors. It shows a phase transition in hardness depending on
        the privacy level, similar to Azize and Basu (2024). This is a related setting, not the dense adversarial
        problem.
    searches:
    - joint differential privacy linear contextual bandits regret optimal lower bound 2025
    - joint differential privacy linear contextual bandits closing gap improved regret d sqrt(T) privacy cost arXiv
    - Azize Basu lower bound joint differential privacy contextual bandits regret 2025 2026
    - '"joint differential privacy" linear bandits "lower bound" adversarial contexts sqrt(T) privacy term tight
      2025'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  canonne24a:
    title: 'Open Problem: Tight Characterization of Instance-Optimal Identity Testing'
    authors:
    - Clément Canonne
    year: 2024
    url: https://proceedings.mlr.press/v247/canonne24a.html
    bandits: 'no'
    statement: Find the right functional Phi(q) such that the sample complexity of instance-optimal identity testing
      (distinguish p=q from TV(p,q)>eps, given q explicitly) is Theta(Phi(q, eps)) up to constant factors for every
      reference q. This would close the gap between Valiant–Valiant's upper and lower bounds, which are stated via
      the ℓ_{2/3} norm of a truncated q.
    status: open
    summary: Three searches found no later paper giving a characterization of instance-optimal identity testing
      that is tight up to constants for every reference q. Valiant–Valiant's bounds match only up to a factor of
      16 in eps and constant factors in the number of samples. Diakonikolas–Kane and Blais–Canonne–Gur gave alternative
      characterizations through other functionals of q, but none is a single functional tight up to constants for
      every q. The closest recent work (arXiv 2508.02637, 2025) studies uniformity testing with instance-optimality
      in the unknown p, up to polylog factors, which is a different problem, and its abstract does not mention Canonne's
      question. "Open" is a judgement from finding nothing, not from a paper saying the problem is still open.
    papers:
    - title: Instance-Optimal Uniformity Testing and Tracking
      year: 2025
      arxiv_id: '2508.02637'
      claim: Studies instance-optimality with respect to the unknown p, with the reference fixed to uniform, up
        to polylog factors. This is related to but does not resolve the identity-testing question about the reference
        q.
    searches:
    - instance-optimal identity testing tight characterization sample complexity 2025
    - Canonne open problem instance-optimal identity testing ℓ2/3 norm functional resolved
    - identity testing reference distribution sample complexity tight up to constant factors every q new functional
      arXiv 2025 2026
    checked: '2026-10-23'
    models:
