      achieves O(√(nLT)) regret. They also proved that any polynomial-time algorithm with lower regret would solve
      planted clique (with a similar result under a planted dense subgraph conjecture). This settles how efficient
      regret depends on the number of labels. The broader question of how general the 'local prediction is easy
      despite hard global inference' phenomenon is remains open-ended, and I found no full answer to it.
