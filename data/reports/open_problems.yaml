  daniely19a:
    title: 'Open Problem: Is Margin Sufficient for Non-Interactive Private Distributed Learning?'
    authors:
    - Amit Daniely
    - Vitaly Feldman
    year: 2019
    url: https://proceedings.mlr.press/v99/daniely19a.html
    bandits: 'no'
    statement: Can every class of Boolean functions with polynomial margin complexity be PAC learned efficiently
      by a non-interactive locally differentially private algorithm? Being efficient means polynomial sample complexity,
      without the interactive access to unlabeled data that the earlier Daniely–Feldman upper bound needed.
    status: resolved
    summary: 'The answer appears to be no. Daniely and Feldman (NeurIPS 2019, arXiv:1809.09165) showed that margin
      complexity is a lower bound for non-interactive LDP PAC learning. They also gave a learner whose cost is polynomial
      in the margin complexity. That learner is non-interactive on labeled samples but needs interactive access
      to unlabeled samples. This gap is what the open problem asks about.


      Dagan and Feldman, "Interaction is necessary for distributed learning with privacy or communication constraints"
      (arXiv:1911.04014, STOC 2020), prove an exponential lower bound on the number of samples a non-interactive
      LDP algorithm needs to learn large-margin linear separators. The abstract says this answers the questions
      posed in the cited earlier work, which includes Daniely–Feldman. Large-margin halfspaces have small margin
      complexity, so they give a counterexample: polynomial margin complexity is not enough for efficient non-interactive
      LDP learning. The result extends to the setting where each user''s communication is limited.


      Caveats:

      - I only read the Dagan–Feldman abstract, not the full paper. The abstract does not name the COLT 2019 open
      problem specifically.

      - I did not confirm from the paper that the exact parameter dependence is super-polynomial when the margin
      is 1/poly(d). This rests on my recollection that the bound is roughly exp(min(d, 1/γ)^c) for some c > 0.


      Related work:

      - Edmonds, Nikolov and Ullman (STOC 2020) characterised non-interactive LDP query answering and agnostic learning
      by γ2 factorization norms. Their abstract says nothing about margin complexity. The tie to margin complexity
      is my own reading.

      - Work such as Su et al. (ACML 2022) gets around the lower bound by using public unlabeled data.'
    papers:
    - title: Interaction is necessary for distributed learning with privacy or communication constraints
      year: 2020
      arxiv_id: '1911.04014'
      claim: Proves an exponential lower bound on the sample complexity of non-interactive LDP learning of large-margin
        linear separators. Says it answers questions posed in earlier work, including Daniely–Feldman. This negatively
        resolves whether polynomial margin complexity is enough.
    - title: Locally Private Learning without Interaction Requires Separation
      year: 2019
      arxiv_id: '1809.09165'
      claim: Margin complexity lower-bounds non-interactive LDP PAC learning. The matching upper bound needs interactive
        access to unlabeled samples, which is the gap behind the open problem.
    - title: The Power of Factorization Mechanisms in Local and Central Differential Privacy
      year: 2020
      arxiv_id: '1911.08339'
      claim: Approximately characterises non-interactive LDP query answering and agnostic learning by factorization
        (γ2) norms.
    - title: On PAC Learning Halfspaces in Non-interactive Local Privacy Model with Public Unlabeled Data
      year: 2022
      arxiv_id: '2209.08319'
      claim: Cites the exponential lower bound for large-margin halfspaces in the non-interactive LDP model, and
        gets around it by using public unlabeled data.
    searches:
    - non-interactive locally private learning margin complexity characterization Daniely Feldman open problem resolved
    - Edmonds Nikolov Ullman factorization mechanisms local differential privacy non-interactive learning margin
      complexity
    - '"margin complexity" non-interactive local differential privacy PAC learning realizable open problem Daniely
      Feldman 2020 2021 2022'
    - non-interactive locally private PAC learning large margin halfspaces without interactive unlabeled samples
