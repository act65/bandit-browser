  chen24e:
    title: 'Open Problem: Black-Box Reductions and Adaptive Gradient Methods for Nonconvex Optimization'
    authors:
    - Xinyi Chen
    - Elad Hazan
    year: 2024
    url: https://proceedings.mlr.press/v247/chen24e.html
    bandits: adjacent
    statement: Find a black-box reduction from offline stochastic nonconvex optimization (finding approximate stationary
      points of smooth nonconvex functions) to static regret minimization in online convex optimization. The reduction
      should let regret bounds of adaptive OCO methods such as AdaGrad, which can depend on the preconditioner,
      carry over to faster convergence in nonconvex optimization. The aim is to help explain why adaptive gradient
      methods work in deep learning. A $500 prize is offered.
    status: resolved
    summary: 'Hu and Simchi-Levi posted a preprint in July 2026, revised to v3 in September 2026: arXiv 2607.17607,
      "Optimizing the Preconditioner: A Black-box Online-to-Nonconvex Conversion with Static Regret Minimization
      Oracles". It says it resolves the open problem posed by Chen and Hazan (2024).


      Their method keeps a gradient tracker, and a black-box online learner picks the preconditioner that turns
      the tracker into an update direction. They assume β-smoothness, a range bounded by M, and unbiased gradients
      with variance σ². Under these assumptions the expected average squared gradient norm is O(σ√(Mβ/T) + √(Mβ)·Reg_T/T
      + Mβ/T), where Reg_T is the online learner''s static regret. So any OCO learner with O(√T) regret gives the
      classical O(1/√T) rate, and adaptive regret bounds pass directly into the nonconvex guarantee. The paper also
      extends the approach to nonsmooth objectives using Goldstein stationarity.


      There was earlier related work. Cutkosky, Mehta and Orabona (2023) converted online learning to nonsmooth
      nonconvex optimization, but that came before the open problem and used dynamic or shifting regret rather than
      plain static regret.


      I marked the status as resolved because the preprint claims a direct answer. However, it has not been peer
      reviewed, and I did not check whether it meets the exact form of the conjecture.'
    papers:
    - title: 'Optimizing the Preconditioner: A Black-box Online-to-Nonconvex Conversion with Static Regret Minimization
        Oracles'
      year: 2026
      arxiv_id: '2607.17607'
      claim: Gives a black-box reduction from stochastic smooth nonconvex optimization to static regret minimization
        in OCO, in which the online learner selects a preconditioner. The convergence bound depends on Reg_T, so
        an O(√T)-regret learner gives the O(1/√T) rate. The abstract says this resolves the open problem posed by
        Chen and Hazan (2024).
    - title: Optimal Stochastic Non-smooth Non-convex Optimization through Online-to-Non-convex Conversion
      year: 2023
      arxiv_id: '2302.03775'
      claim: Earlier related work that converts online learning to nonsmooth nonconvex optimization (Goldstein stationarity);
        it predates the open problem.
    searches:
    - Chen Hazan open problem black-box reduction nonconvex optimization online convex optimization adaptive gradient
      methods solved
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
