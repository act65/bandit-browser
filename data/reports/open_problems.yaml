  perotto19a:
    title: 'Open Problem: Risk of Ruin in Multiarmed Bandits'
    authors:
    - Filipo S. Perotto
    - Mathieu Bourgais
    - Bruno C. Silva
    - Laurent Vercouter
    year: 2019
    url: https://proceedings.mlr.press/v99/perotto19a.html
    bandits: 'yes'
    statement: 'For survival multi-armed bandits, where the budget evolves with possibly negative rewards and ruin
      occurs when it goes negative: (a) how should regret be defined, (b) can the problem be reduced to risk-averse
      or budgeted MABs, and (c) what strategy optimally solves it?'
    status: resolved
    summary: Riou, Honda and Sugiyama ("The Survival Bandit Problem", arXiv 2206.03019, TMLR 2024) say in their
      abstract that they answer the Perotto et al. COLT 2019 open problem. They define survival regret, which splits
      into the regret given no ruin plus the probability of ruin. They show that no policy can achieve sublinear
      survival regret, so they seek Pareto-optimal policies instead. They prove tight lower bounds on the probability
      of ruin and give policies that match them. A doubling trick then yields a Pareto-optimal policy. This answers
      questions (a) and (c). A search-result summary says the sublinear-regret construction holds at least for integer
      rewards with a known horizon; the abstract does not confirm that restriction. I could not confirm that the
      reduction question (b) is addressed directly, though the impossibility result suggests standard guarantees
      do not simply transfer. Earlier, Perotto et al. (AAMAS 2021) studied the ±1-reward (gambler's ruin) case and
      proposed a regret that adds the expected loss from ruin.
    papers:
    - title: The Survival Bandit Problem
      year: 2024
      arxiv_id: '2206.03019'
      claim: Defines survival regret and shows no policy achieves sublinear survival regret. Gives tight lower bounds
        on the probability of ruin with matching policies, and uses a doubling trick to get a Pareto-optimal policy.
        The abstract says this answers the Perotto et al. COLT 2019 open problem.
    - title: Gambler Bandits and the Regret of Being Ruined
      year: 2021
      arxiv_id: null
      claim: Studies the ±1-reward survival bandit as a multi-armed gambler's ruin, analyses the probability of
        ruin, and proposes a regret that combines classic regret with the expected loss from ruin.
