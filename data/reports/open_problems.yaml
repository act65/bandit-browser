  li12:
    title: 'Open Problem: Regret Bounds for Thompson Sampling'
    authors:
    - Lihong Li
    - Olivier Chapelle
    year: 2012
    url: https://proceedings.mlr.press/v23/li12.html
    bandits: 'yes'
    statement: Prove finite-time regret bounds for Thompson sampling, in both the standard stochastic multi-armed
      bandit and contextual (e.g. linear-payoff) bandits. Ideally the bounds should be near-optimal, for example
      matching the Lai–Robbins lower bound. Before this, Thompson sampling worked well empirically but had almost
      no theoretical guarantees.
    status: resolved
    summary: "This open problem is resolved: papers from 2012–2013 answered it as posed.\n\n**Multi-armed bandit:**\n\
      - Kaufmann, Korda & Munos (ALT 2012) gave the first finite-time analysis of Thompson sampling for Bernoulli\
      \ bandits that matches the Lai–Robbins asymptotic lower bound. This makes the algorithm asymptotically optimal.\n\
      - Agrawal & Goyal (\"Further Optimal Regret Bounds\", 2012/AISTATS 2013) proved:\n  - an optimal problem-dependent\
      \ bound;\n  - a near-optimal problem-independent bound of O(√(NT ln T)).\n\n**Contextual setting:** Agrawal\
      \ & Goyal (ICML 2013) gave the first guarantees for contextual Thompson sampling with linear payoffs. Their\
      \ high-probability regret bound is Õ(d^{3/2}√T).\n\n**Remaining gap:** for linear Thompson sampling, the frequentist\
      \ bound is d^{3/2}√T versus the d√T minimax rate. This is a separate refinement, not the question as posed.\n\
      \n**Not verified this session:** Agrawal & Goyal's COLT 2012 paper (\"Analysis of Thompson Sampling for the\
      \ multi-armed bandit problem\"), which gave an O(log T) regret bound, is described here only from secondhand\
      \ mentions in search results. I did not find the paper itself, so it is not listed."
    papers:
    - title: 'Thompson Sampling: An Asymptotically Optimal Finite-Time Analysis'
      year: 2012
      arxiv_id: '1205.4217'
      claim: First finite-time analysis of Thompson sampling for Bernoulli bandits that matches the Lai–Robbins
        asymptotic lower bound, so the algorithm is asymptotically optimal.
    - title: Further Optimal Regret Bounds for Thompson Sampling
      year: 2012
      arxiv_id: '1209.3353'
      claim: Optimal problem-dependent regret bound and a near-optimal problem-independent bound of O(√(NT ln T))
        for Thompson sampling in multi-armed bandits.
    - title: Thompson Sampling for Contextual Bandits with Linear Payoffs
      year: 2013
      arxiv_id: '1209.3352'
      claim: 'First theoretical guarantees for contextual Thompson sampling: a high-probability regret bound of
        Õ(d^{3/2}√T) for linear payoffs, with contexts chosen by an adaptive adversary.'
    searches:
    - Thompson sampling asymptotically optimal finite-time analysis Kaufmann Korda Munos; Agrawal Goyal analysis
      of Thompson sampling
    - 'Li Chapelle "Open Problem: Regret Bounds for Thompson Sampling" COLT 2012'
    - Agrawal Goyal "Thompson Sampling for Contextual Bandits with Linear Payoffs" arXiv; "Analysis of Thompson
      Sampling for the multi-armed bandit problem"
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  mcmahan12:
    title: 'Open Problem: Better Bounds for Online Logistic Regression'
    authors:
    - H. Brendan McMahan
    - Matthew Streeter
    year: 2012
    url: https://proceedings.mlr.press/v23/mcmahan12.html
    bandits: adjacent
    statement: Is it possible to achieve regret O(poly(D) log T) for online logistic regression over a feasible
      set of L2 diameter D (improving on the known e^D log T), or at least a bound reducing to O(sqrt(D)+log T)
      in the 1-d binary case?
    status: resolved
    summary: 'Resolved, with the answer depending on whether the learner must be proper (predict with a point from
      the feasible set). Hazan, Koren and Levy (COLT 2014) say they resolve the McMahan–Streeter problem: their
      polynomial lower bound shows that while T is sub-exponential in D, logistic loss gives no advantage over non-smooth
      losses, so poly(D)·log T regret is impossible for proper algorithms. Foster, Kale, Luo, Mohri and Sridharan
      (COLT 2018) give a positive resolution of a variant of the problem that allows improper learning. Their efficient
      learner uses the 1-mixability of the logistic loss, improves the dependence on D doubly exponentially, and
      is near-optimal (the d·log(DT) form of the bound is recalled, not confirmed by the search).'
    papers:
    - title: 'Logistic Regression: Tight Bounds for Stochastic and Online Optimization'
      year: 2014
      arxiv_id: '1405.3843'
      claim: 'Proves a polynomial lower bound on the rate, in terms of D and the number of rounds: logistic loss
        gives no advantage over non-smooth losses when T is sub-exponential in D. This rules out poly(D) log T regret
        for proper algorithms in that range. Gives an O(D^3 T^{1/3}) algorithm in 1-d and says it resolves the McMahan-Streeter
        COLT 2012 open problem.'
    - title: 'Logistic Regression: The Importance of Being Improper'
      year: 2018
      arxiv_id: '1803.09349'
      claim: Says it gives a positive resolution of a variant of the McMahan-Streeter problem that allows improper
        learning. Its efficient learner, based on 1-mixability, improves the dependence on the predictor norm doubly
        exponentially and is near-optimal.
    searches:
    - 'Logistic Regression: The Importance of Being Improper Foster Kale Luo Mohri Sridharan McMahan Streeter open
      problem'
    - 'Hazan Koren Levy Logistic Regression: Tight Bounds for Stochastic and Online Optimization McMahan Streeter'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  ramon12:
    title: 'Open Problem: Learning Dynamic Network Models from a Static Snapshot'
    authors:
    - Jan Ramon
    - Constantin Comendant
    year: 2012
    url: https://proceedings.mlr.press/v23/ramon12.html
    bandits: 'no'
    statement: 'Given a single snapshot of a growing graph of sufficient size, can one learn the (repeatable) generating
      process that produced it? Two instances are studied: variants of the Erdős–Rényi and Barabási–Albert (preferential
      attachment) growth models.'
    status: partially_resolved
    summary: Later statistics papers partly answer the problem. For linear preferential attachment, the closest
      match to the Barabási–Albert instance, arXiv 1703.03095 (2017) estimates the parameters from the single snapshot
      G(n); I saw only excerpts, not its consistency results. PAFit-oneshot (2021) estimates a nonparametric attachment
      function from one snapshot. A 2025 paper recovers link formation times from static structure, but its abstract
      states no theoretical guarantees. I found no learning-theoretic treatment of the general problem with identifiability
      or sample-complexity guarantees, nothing on the Erdős–Rényi variant, and no paper citing the open problem
      directly. I couldn't read the open-problem PDF itself, so the exact sub-questions are unchecked.
    papers:
    - title: Fitting the Linear Preferential Attachment Model
      year: 2017
      arxiv_id: '1703.03095'
      claim: Proposes a parameter estimation procedure for the linear preferential attachment model using only the
        single snapshot G(n), with sufficient statistics computable from the snapshot and approximations of unobserved
        step-type counts for large n.
    - title: Nonparametric estimation of the preferential attachment function from one network snapshot
      year: 2021
      arxiv_id: '2103.01750'
      claim: 'PAFit-oneshot: nonparametric estimation of the attachment function from a single snapshot, correcting
        the bias that arises when estimating attachment only for degrees seen in the snapshot; earlier methods needed
        at least two time points.'
    - title: Restoring Network Evolution from Static Structure
      year: 2025
      arxiv_id: '2512.08209'
      claim: Infers network evolutionary trajectories (link formation times) solely from present topology; the abstract
        states no theoretical guarantees.
