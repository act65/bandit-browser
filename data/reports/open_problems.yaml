  rudin12:
    title: 'Open Problem: Does AdaBoost Always Cycle?'
    authors:
    - Cynthia Rudin
    - Robert E. Schapire
    - Ingrid Daubechies
    year: 2012
    url: https://proceedings.mlr.press/v23/rudin12.html
    bandits: 'no'
    statement: For exhaustive (optimal) AdaBoost, where each round picks the weak classifier with the smallest weighted
      error, do the weight distributions over the training examples always end up converging to a finite cycle?
    status: resolved
    summary: 'An April 2026 arXiv preprint claims to settle the question negatively: Erik Y. Wang, "AdaBoost Does
      Not Always Cycle: A Computer-Assisted Counterexample" (arXiv:2604.07055, revised to v2 on 17 Apr 2026).


      The construction is a "block-product gadget" built from two factors. The two factors share an exact period-2
      orbit, but the dominant eigenvalues of their linearised return maps have an irrational log-ratio. That forces
      the sequence of winning weak classifiers to settle at an irrational long-run frequency, which rules out eventual
      periodicity. According to the abstract, every step is checked in exact rational arithmetic, and the work was
      done with help from GPT-5.4 Pro and Claude Opus 4.6.


      I have only read the arXiv landing page, not the full paper. From that, I can''t tell whether the result depends
      on a particular tie-breaking rule. I also found no peer-reviewed version and no independent check of the proof.


      Earlier work had pointed the other way. Belanich and Ortiz (2012, arXiv:1212.1108) proved ergodic-type convergence
      properties for Optimal AdaBoost and said their results gave fairly strong evidence that AdaBoost does cycle.
      Rudin, Daubechies and Schapire (JMLR 2004) had shown cycling only in special cases.


      I''ve marked the problem resolved because the preprint answers the question as posed, but that verdict is
      provisional until the proof is independently confirmed.'
    papers:
    - title: 'AdaBoost Does Not Always Cycle: A Computer-Assisted Counterexample'
      year: 2026
      arxiv_id: '2604.07055'
      claim: Gives a computer-assisted counterexample, certified in exact rational arithmetic, showing that exhaustive
        AdaBoost does not always converge to a finite cycle. The winning-classifier sequence has an irrational asymptotic
        frequency, so it cannot become periodic. This answers the COLT 2012 question negatively.
    - title: On the convergence properties of optimal AdaBoost
      year: 2012
      arxiv_id: '1212.1108'
      claim: Proves ergodic-type convergence results for Optimal AdaBoost and says these give reasonably strong
        evidence for the cycling conjecture. This is partial progress pointing in the opposite direction, not a
        resolution.
    - title: 'The Dynamics of AdaBoost: Cyclic Behavior and Convergence of Margins'
      year: 2004
      arxiv_id: null
      claim: The earlier work behind the question. It shows cycling occurs in special cases, and that AdaBoost does
        not always converge to a maximum-margin classifier.
    searches:
    - AdaBoost always cycle open problem Rudin Schapire Daubechies resolved counterexample
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  shamir12:
    title: 'Open Problem: Is Averaging Needed for Strongly Convex Stochastic Gradient Descent?'
    authors:
    - Ohad Shamir
    year: 2012
    url: https://proceedings.mlr.press/v23/shamir12.html
    bandits: adjacent
    statement: For strongly convex stochastic optimization, can SGD reach the optimal O(1/T) rate without averaging,
      by returning the last iterate, or is some form of averaging needed?
    status: resolved
    summary: The answer depends on the step size. Shamir & Zhang (2013) showed that the last iterate reaches O(log
      T/T); this one is cited from memory and was not checked in this session. Harvey, Liaw, Plan & Randhawa (COLT
      2019) showed this bound is tight (Ω(log T/T)) for standard ~1/(μt) steps, so averaging (e.g. suffix averaging)
      is needed with those steps. Jain, Nagaraj & Netrapalli (COLT 2019) gave a step-size modification under which
      the last iterate matches the averaged-iterate guarantee, with high probability. The search snippet only stated
      the general convex result; that it also covers the strongly convex O(1/T) rate is from recollection and was
      not re-checked here. So, given suitable step sizes, averaging is not needed.
    papers:
    - title: Tight Analyses for Non-Smooth Stochastic Gradient Descent
      year: 2019
      arxiv_id: '1812.05217'
      claim: 'For strongly convex Lipschitz functions, the last iterate of SGD with standard step sizes has error
        Θ(log T/T): O(log T/T) with high probability, plus a matching lower bound even for deterministic GD. Suffix
        averaging reaches O(1/T) with high probability. So averaging is needed with standard step sizes.'
    - title: Making the Last Iterate of SGD Information Theoretically Optimal
      year: 2019
      arxiv_id: '1904.12443'
      claim: A step-size modification scheme makes the last iterate of SGD/GD match the guarantee of the averaged
        iterate under the original schedule, with high probability. The search snippet stated this for the general
        convex case; that it also gives the optimal O(1/T) rate in the strongly convex case is from recollection
        and was not re-checked in this session. This would mean averaging is not needed.
    searches:
    - Making the last iterate of SGD information theoretically optimal strongly convex O(1/T)
    - Tight analyses for non-smooth stochastic gradient descent Harvey Liaw Plan Randhawa last iterate log T / T
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
