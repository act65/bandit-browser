  azizzadenesheli16b:
    title: 'Open Problem: Approximate Planning of POMDPs in the class of Memoryless Policies'
    authors:
    - Kamyar Azizzadenesheli
    - Alessandro Lazaric
    - Animashree Anandkumar
    year: 2016
    url: https://proceedings.mlr.press/v49/azizzadenesheli16b.html
    bandits: adjacent
    statement: Find an efficient method, exact or approximate, for computing an optimal stochastic memoryless (stationary,
      observation-based) policy for a POMDP. The optimisation problem is non-convex and computationally intractable
      in general.
    status: partially_resolved
    summary: 'Some parts of this have been answered since 2016, but there is still no general efficient algorithm
      with guarantees. That is unlikely to change, because earlier work cited in this literature (Papadimitriou
      & Tsitsiklis 1987; Lusena et al. 1998) shows that optimal stationary policies are NP-hard to compute. It also
      shows that a provably good polynomial-time approximation would imply P=NP.


      Later papers give exact or structured methods that can be slow in the worst case:

      - **Müller & Montúfar (ICLR 2022):** they show the reward is a rational function of the policy, with degree
      set by how partially observable the problem is. This turns the problem into a linear program over state-action
      frequencies with polynomial constraints, so polynomial-optimisation tools apply. They also bound the number
      of critical points and show there can be several local optima.

      - **Müller & Montúfar (follow-up, 2022):** a second paper builds on this to solve infinite-horizon POMDPs
      with memoryless stochastic policies in state-action space. I only saw this one through a search listing.

      - **Cohen & Parmentier (2022):** they compute optimal memoryless policies with mixed-integer linear programming.
      A relaxation of their program, with added inequalities, gives strong upper bounds on the best history-dependent
      policy.

      - **van Zuijlen & Antunes (2025, from search snippets only):** a rolling-horizon version of the MILP approach.
      Its policy came within 20% of the optimal POMDP value on 60% of the test problems.


      Golowich, Moitra and Rohatgi (2022) give quasipolynomial-time planning for observable POMDPs. That result
      is about general policies rather than memoryless ones, so it is related but does not address this question
      directly.


      In short, there are exact formulations and heuristics that work in practice. However, nothing I found gives
      a general polynomial-time algorithm or approximation guarantee for this policy class, and the hardness results
      make one unlikely. I did not open any of the papers; everything here comes from search-result summaries.'
    papers:
    - title: The Geometry of Memoryless Stochastic Policy Optimization in Infinite-Horizon POMDPs
      year: 2022
      arxiv_id: '2110.07409'
      claim: Shows the reward is a rational function of the memoryless stochastic policy. Recasts the problem as
        a linear program over state-action frequencies with explicit polynomial constraints, which allows polynomial-optimisation
        methods. Also bounds the number of critical points and solves a grid-world navigation task.
    - title: Solving infinite-horizon POMDPs with memoryless stochastic policies in state-action space
      year: 2022
      arxiv_id: '2205.14098'
      claim: Follow-up by Müller & Montúfar that solves infinite-horizon POMDPs with memoryless stochastic policies
        in state-action space. Seen only through a search-result listing.
    - title: Future memories are not needed for large classes of POMDPs
      year: 2022
      arxiv_id: '2205.02580'
      claim: Computes optimal memoryless policies with mixed-integer linear programming. Its linear relaxation,
        with added valid inequalities, gives high-quality upper bounds on the value of the best history-dependent
        policy.
    - title: Planning in Observable POMDPs in Quasipolynomial Time
      year: 2022
      arxiv_id: '2201.04735'
      claim: Gives quasipolynomial-time approximate planning for observable POMDPs, over general rather than memoryless
        policies. Related work, not a direct answer.
    searches:
    - optimal stochastic memoryless policy POMDP algorithm hardness approximation
    - Müller Montúfar geometry of memoryless stochastic policy optimization infinite-horizon POMDPs
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  chen16b:
    title: 'Open Problem: Best Arm Identification: Almost Instance-Wise Optimality and the Gap Entropy Conjecture'
    authors:
    - Lijie Chen
    - Jian Li
    year: 2016
    url: https://proceedings.mlr.press/v49/chen16b.html
    bandits: 'yes'
    statement: For best-arm identification (Best-1-Arm), there is an algorithm that is instance-wise optimal up
      to an additive Δ_2^{-2} ln ln Δ_2^{-1} term. The gap-entropy conjecture says the instance-wise lower bound
      is Θ(H(I)(ln δ^{-1} + Ent(I))), where H(I) = Σ Δ_i^{-2} and Ent(I) is the entropy of the normalised complexities
      of the dyadic gap groups.
    status: resolved
    summary: Chen, Li and Qiao (COLT 2017) made major partial progress on the conjecture. Their algorithm matches
      H(I)(ln δ^{-1} + Ent(I)), but the additive two-arm term carries an extra polylog(n, δ^{-1}) factor. Their
      lower bound applies only to Gaussian instances whose gaps are powers of 2, and only to "monotone" algorithms.
      A September 2026 arXiv preprint by Yao, Zhao and Zhou (2609.13703) says it resolves both conjectures for unit-variance
      Gaussian arms with means in [0,1]. It claims an order-oblivious lower bound of Ω(H(I)[log(1/δ) + Ent(I)])
      for every δ < 0.1, with no dyadic-gap or monotonicity restriction. It also claims a single δ-correct algorithm
      that matches this bound up to an additive two-arm term of order Δ_2^{-2} log log Δ_2^{-1}. The authors say
      the main theorems are formalised in Lean 4. The status is "resolved" only on the strength of this very recent
      v1 preprint, which does not appear to be peer-reviewed yet. If the preprint does not hold up, the status falls
      back to partially_resolved, based on the 2017 paper.
    papers:
    - title: Towards Instance Optimal Bounds for Best Arm Identification
      year: 2017
      arxiv_id: '1608.06031'
      claim: An algorithm achieving O(Δ_2^{-2} ln ln Δ_2^{-1} · polylog(n, δ^{-1}) + H(I)(ln δ^{-1} + Ent(I))).
        A matching gap-entropy lower bound only for Gaussian instances with dyadic (2^{-k}) gaps and monotone algorithms.
        Significant partial progress on the conjecture.
    - title: Gap Entropy and Almost Instance-Wise Optimal Best-Arm Identification
      year: 2026
      arxiv_id: '2609.13703'
      claim: Claims to resolve both Chen–Li conjectures for unit-variance Gaussian arms. Gives an instance-wise
        lower bound of Ω(H(I)[log(1/δ) + Ent(I)]) for δ < 0.1 without the dyadic or monotonicity restrictions, and
        an algorithm that matches it up to an additive two-arm term D log log D with D = Δ_2^{-2}. Main theorems
        are formalised in Lean 4. This is a v1 preprint and has not been peer-reviewed.
    searches:
    - arxiv 1608.06031 abstract fetch
    - gap entropy conjecture best arm identification resolved lower bound
    - arxiv 2609.13703 abstract fetch
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  feragen16:
    title: 'Open Problem: Kernel methods on manifolds and metric spaces. What is the probability of a positive definite
      geodesic exponential kernel?'
    authors:
    - Aasa Feragen
    - Søren Hauberg
    year: 2016
    url: https://proceedings.mlr.press/v49/feragen16.html
    bandits: 'no'
    statement: Geodesic exponential (Gaussian and Laplacian) kernels on curved manifolds or metric spaces are not
      positive definite for every bandwidth. The open problem asks for the probability that the kernel matrix of
      a finite random sample is positive definite, as a function of the bandwidth, the geometry of the space (for
      example curvature) and the spread of the sample. The authors conjecture that there are large bandwidth intervals
      where this probability is high and the kernel still has real predictive power.
    status: open
    summary: 'I found no later paper that proves or disproves the finite-sample probability conjectures. The follow-up
      work answers a related deterministic question instead: is the geodesic Gaussian kernel positive definite on
      the whole space for a fixed bandwidth? Da Costa, Mostajeran and Ortega (2023) showed it is never positive
      definite on the circle, for any bandwidth. That failure carries over to any space with an isometrically embedded
      circle, such as spheres, projective spaces and Grassmannians. Li (2023) extended the result to all non-simply-connected
      closed Riemannian manifolds, for every metric and every bandwidth. Li also conjectured that positive definiteness
      holds at coarse scales and fails at fine scales on compact manifolds. Da Costa, Mostajeran, Ortega and Said
      (2023) then treated compact and non-compact symmetric spaces. These results strengthen the background negative
      result, but they say nothing about the probability that the kernel matrix of a random finite sample is positive
      definite. That is the question the open problem asks, so I consider it still open. This is based on standard
      and extended searches; I did not do a full citation crawl.'
    papers:
    - title: The Gaussian kernel on the circle and spaces that admit isometric embeddings of the circle
      year: 2023
      arxiv_id: '2302.10623'
      claim: Shows the geodesic Gaussian kernel is never positive definite on the circle for any bandwidth. Hence
        it also fails on spheres, projective spaces and Grassmannians. This is a related deterministic result, not
        the finite-sample probability.
    - title: Gaussian kernels on non-simply-connected closed Riemannian manifolds are never positive definite
      year: 2023
      arxiv_id: '2303.06558'
      claim: Shows that exp(-λ d_g^2) is not positive definite for any λ>0 on any non-simply-connected closed Riemannian
        manifold. Conjectures that positive definiteness holds at coarse scales and is lost at fine scales on compact
        manifolds.
    - title: 'Geodesic Exponential Kernels: When Curvature and Linearity Conflict'
      year: 2015
      arxiv_id: '1411.0296'
      claim: 'The earlier work behind the open problem: the geodesic Gaussian kernel is positive definite for all
        bandwidths only on flat or Euclidean spaces.'
    searches:
    - probability positive definite geodesic exponential kernel finite sample manifold conjecture Feragen Hauberg
    - geodesic Gaussian kernel positive definite with high probability small bandwidth sphere random sample
    - Gaussian kernels on Riemannian manifolds never positive definite bandwidth geodesic distance 2023
    - '"positive definite" geodesic Gaussian kernel finite sample probability bandwidth conjecture Feragen proof'
    - Da Costa Mostajeran Ortega Gaussian kernel on the circle positive definite
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  freund16:
    title: 'Open Problem: Second order regret bounds based on scaling time'
    authors:
    - Yoav Freund
    year: 2016
    url: https://proceedings.mlr.press/v49/freund16.html
    bandits: adjacent
    statement: Freund argues that second-order bounds which add up each action's squared losses separately (Cesa-Bianchi
      et al. 2006) are loose. He proposes a different second-order regret bound for prediction with expert advice,
      based on scaling time and on the variance of instantaneous regret under the learner's distribution, and conjectures
      that NormalHedge (Chaudhuri, Freund, Hsu 2009) satisfies it.
    status: partially_resolved
    summary: A February 2026 arXiv preprint co-written by Freund ("A second order regret bound for NormalHedge",
      arXiv:2602.08151) shows that a variant of NormalHedge achieves an ε-quantile regret bound of O(sqrt(V_T log(V_T/ε)))
      when V_T > log N. Here V_T is the cumulative second moment of each expert's instantaneous regret, averaged
      under a distribution the algorithm chooses. That is essentially the conjectured kind of bound. However, it
      is for a modified NormalHedge rather than the original, has an extra log V_T factor, needs V_T > log N, and
      is an unrefereed v1 preprint. Its abstract also doesn't explicitly mention the 2016 open problem. So I mark
      it partially resolved; it could be upgraded to resolved if the full paper presents this as the intended answer.
    papers:
    - title: A second order regret bound for NormalHedge
      year: 2026
      arxiv_id: '2602.08151'
      claim: Shows that a variant of NormalHedge achieves a second-order ε-quantile regret bound O(sqrt(V_T log(V_T/ε)))
        when V_T > log N, where V_T is the cumulative second moment of each expert's instantaneous regret averaged
        under the algorithm's own distribution. The analysis is motivated by an SDE continuous-time limit and uses
        self-concordance. Co-written by Freund; it essentially addresses the conjecture, but for a variant of NormalHedge
        and with extra conditions.
    searches:
    - Freund open problem second order regret bounds scaling time NormalHedge solved
    checked: '2026-10-23'
    models:
