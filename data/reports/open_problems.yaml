  open-problem-yun21a:
    title: 'Open Problem: Can Single-Shuffle SGD be Better than Reshuffling SGD and GD?'
    authors:
    - Chulhee Yun
    - Suvrit Sra
    - Ali Jadbabaie
    year: 2021
    url: https://proceedings.mlr.press/v134/open-problem-yun21a.html
    bandits: 'no'
    statement: For positive definite matrices with small condition numbers, do means of matrix products satisfy
      a chain of spectral-norm inequalities? These would extend the Recht–Ré noncommutative AM-GM conjecture. The
      chain would imply that, in special cases (e.g., quadratics), single-shuffle SGD converges faster than random-reshuffle
      SGD, which in turn converges faster than with-replacement SGD and GD.
    status: open
    summary: 'I found no later paper that proves or disproves the conjectured inequalities in general.


      **The authors'' own results.** Their companion paper (arXiv 2103.07079, published at the same time as the
      open problem) proves several special cases.


      **Related work that does not settle it:**

      - **Recht–Ré conjecture.** The original Recht–Ré conjecture, for general PSD matrices, was shown false before
      this open problem (Lai & Lim 2020; De Sa 2020). That is why the problem restricts attention to well-conditioned
      positive definite matrices.

      - **Worst-case lower bounds.** Safran & Shamir show that single-shuffle is worse than random reshuffling in
      the worst case for general strongly convex quadratics. Cha, Lee & Yun (2023) tighten the lower bounds for
      shuffling SGD. Neither addresses the specific conjectured matrix inequalities.

      - **Ill-conditioned problems.** Rajput et al. (NeurIPS 2021) study when random shuffling beats SGD on ill-conditioned
      problems. This does not settle the single-shuffle comparison either.


      I searched with standard and extended web searches only, not Google Scholar citation lists, so a later resolution
      could have been missed. Given that, the problem appears to remain open.'
    papers:
    - title: Can Single-Shuffle SGD be Better than Reshuffling SGD and GD?
      year: 2021
      arxiv_id: '2103.07079'
      claim: The authors' companion paper. It proves several special cases that support the conjectured inequalities,
        but not the general conjecture.
    - title: Recht–Ré Noncommutative Arithmetic-Geometric Mean Conjecture is False
      year: 2020
      arxiv_id: '2006.01510'
      claim: Shows that the original Recht–Ré AM-GM conjecture is false for general PSD matrices. This motivates
        the open problem's restriction to well-conditioned positive definite matrices.
    - title: 'Tighter Lower Bounds for Shuffling SGD: Random Permutations and Beyond'
      year: 2023
      arxiv_id: '2303.07160'
      claim: Gives tighter lower bounds for shuffling SGD (random reshuffling and other permutation schemes). Related
        to this problem, but it does not resolve the conjectured single-shuffle matrix inequalities.
    - title: Random Shuffling Beats SGD Only After Many Epochs on Ill-Conditioned Problems
      year: 2021
      arxiv_id: '2106.06880'
      claim: Gives tight bounds for quadratics with commuting terms, comparing with-replacement SGD and shuffling.
        This is related context and does not resolve the conjecture.
    searches:
    - single-shuffle SGD faster than random reshuffling conjecture Yun Sra Jadbabaie matrix AM-GM resolved
    - single shuffle versus random reshuffling lower bound quadratic "single shuffle" SGD 2023 2024 conjecture Yun
    - noncommutative arithmetic-geometric mean inequality single shuffle without-replacement conjecture counterexample
      proof matrix products spectral norm
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  foster20a:
    title: 'Open Problem: Model Selection for Contextual Bandits'
    authors:
    - Dylan J. Foster
    - Akshay Krishnamurthy
    - Haipeng Luo
    year: 2020
    url: https://proceedings.mlr.press/v125/foster20a.html
    bandits: 'yes'
    statement: The question is whether a contextual bandit algorithm, given a nested sequence of policy or regressor
      classes F_1 ⊂ F_2 ⊂ ..., can get regret that adapts to the unknown smallest class m* containing the optimal
      policy. The target is something like Õ(√(T·log|F_{m*}|)) or Õ(√(T·d_{m*})), the rate you would get if m* were
      known in advance. More weakly, it asks for any rate T^α·comp(F_{m*})^{1−α} with α < 1, rather than paying
      for the complexity of the largest class.
    status: resolved
    summary: The question has been answered, and the answer is no. Marinov & Zimmert (NeurIPS 2021, arXiv 2110.13282)
      show that the hoped-for guarantees cannot be achieved for general nested policy classes, even when the data
      are purely stochastic. They also give matching upper and lower bounds, up to log factors, that trace out the
      exact tradeoff (the Pareto frontier) between regret against small and large classes. One consequence is that
      a cost depending on ln|Π_m| that does not shrink with T cannot be avoided. The paper explicitly says it addresses
      the COLT 2020 open problem. For the linear special case, where the unknown is the dimension d*, Zhu & Nowak
      (AISTATS 2022) independently show that no algorithm gets O(√(d*·T)) for every d* at once. They also give an
      algorithm that matches this lower bound under a mild assumption on the action set.
    papers:
    - title: The Pareto Frontier of model selection for general Contextual Bandits
      year: 2021
      arxiv_id: '2110.13282'
      claim: 'Answers the COLT 2020 open problem in the negative: the desired model-selection guarantees cannot
        be achieved for nested policy classes, even in the stochastic setting. Gives a Pareto frontier with matching
        upper and lower bounds up to log factors, and shows a ln|Π_m| complexity term that does not shrink with
        T is unavoidable.'
    - title: Pareto Optimal Model Selection in Linear Bandits
      year: 2022
      arxiv_id: '2102.06593'
      claim: In linear bandits, even with a fixed action set, no algorithm achieves O(√(d*·T)) regret for all d*
        simultaneously. Gives a Pareto-optimal algorithm matching this lower bound under a mild assumption on the
        action set.
    searches:
    - Pareto frontier of model selection for general contextual bandits Marinov Zimmert
    - Pareto optimal model selection in linear bandits Zhu Nowak
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  koren20a:
    title: 'Open Problem: Tight Convergence of SGD in Constant Dimension'
    authors:
    - Tomer Koren
    - Shahar Segal
    year: 2020
    url: https://proceedings.mlr.press/v125/koren20a.html
    bandits: adjacent
    statement: For SGD on convex Lipschitz functions with the standard step size, what is the expected suboptimality
      of the last iterate when the dimension d is a constant independent of T? Known bounds are O(log T/√T) from
      above (Shamir–Zhang) and Ω(log T/√T) from below (Harvey et al.), but the lower bound needs d = T. The gap
      is open even for d = 1. The conjecture is that the rate is Θ(1/√T) in any constant dimension.
    status: partially_resolved
    summary: "The problem looks partially resolved. I found no paper that settles the stochastic (SGD) version as\
      \ stated.\n\n- **Liu & Lu (arXiv 2106.14588):** They prove last-iterate lower bounds of Ω(log d/√T) for Lipschitz\
      \ convex functions and Ω(log d/T) for strongly convex ones, for any d ≤ T. They describe this as partly resolving\
      \ the Koren–Segal question. They also prove a tight O(1/√T) upper bound, but only for special one-dimensional\
      \ cases, which are more general than Koren–Segal's evidence.\n- **Beretta, Cesari, Colomboni & Paudice (arXiv\
      \ 2607.15980, July 2026):** For the projected subgradient method with constant step size of order 1/√n, they\
      \ prove the last iterate has error O(d/√n), with a matching lower bound. So the sharp worst-case rate is of\
      \ order min{d, log n}/√n, which means Θ(1/√n) in any fixed dimension. They say this resolves the Koren–Segal\
      \ open problem and that the correct dimension dependence is linear, not logarithmic.\n  - **Limitation:**\
      \ their result covers only deterministic subgradients. The paper itself says it \"completely resolved the\
      \ deterministic fixed-dimensional last-iterate problem.\" It frames Koren–Segal's dimension-dependent conjecture\
      \ for SGD as the \"corresponding stochastic problem,\" which it does not address.\n\nThe open-problem paper's\
      \ title and abstract concern SGD's expected suboptimality. So the stochastic constant-dimension case, including\
      \ d = 1 in general, still appears open."
    papers:
    - title: 'The Convergence Rate of SGD''s Final Iterate: Analysis on Dimension Dependence'
      year: 2021
      arxiv_id: '2106.14588'
      claim: Proves Ω(log d/√T) (Lipschitz convex) and Ω(log d/T) (strongly convex) last-iterate lower bounds for
        any d ≤ T, described as partially resolving the Koren–Segal COLT open question. Also gives a tight O(1/√T)
        upper bound for special one-dimensional cases more general than Koren–Segal's.
    - title: Sharp Dimension Dependence for the Last Iterate of the SubGradient Method
      year: 2026
      arxiv_id: '2607.15980'
      claim: For the deterministic projected subgradient method with step size of order 1/√n, the last iterate has
        error O(d/√n), with a matching lower bound. The sharp worst-case rate is of order min{d, log n}/√n. The
        paper claims to resolve the Koren–Segal 2020 COLT open problem in the deterministic setting and does not
        cover the stochastic case.
    searches:
    - last iterate SGD constant dimension one-dimensional tight rate 1/sqrt(T) Koren Segal open problem resolved
    - '"Koren and Segal" last iterate SGD one dimension lower bound log T constant dimension 2023 2024 2025'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  luo20a:
    title: 'Open Problem: Average-Case Hardness of Hypergraphic Planted Clique Detection'
    authors:
    - Yuetian Luo
    - Anru R Zhang
    year: 2020
    url: https://proceedings.mlr.press/v125/luo20a.html
    bandits: 'no'
    statement: 'Find more evidence that detecting a planted clique in a random hypergraph (HPC) is computationally
      hard. The main conjecture is that HPC detection is exactly as hard as ordinary graph planted clique (PC) detection.
      One direction is already known: HPC is no harder than PC, because fixing all but two indices of the adjacency
      tensor gives a PC instance. The open part is the other direction: a reduction showing that HPC is at least
      as hard as PC.'
    status: open
    summary: 'I found no paper that proves the equivalence. In particular, I found no average-case reduction from
      graph planted clique to hypergraph planted clique.


      **Related work:**

      - **Hirahara and Shimizu (STOC 2024)** show that most variants of the planted clique conjecture are equivalent
      to each other. As far as I could tell from search results, their results cover ordinary graphs only.

      - **Brennan and Bresler (secret leakage paper)** assume hardness of a k-partite hypergraph version of planted
      clique. They treat it as a stronger hypothesis to build on, not something they derive from graph planted clique.

      - **Dhawan, Mao and Wein (2023)** show that a broad class of simple tests (polynomials of degree n^{o(1)})
      fails at detecting dense planted subhypergraphs. This adds restricted-model evidence for hypergraph hardness,
      but it is not a reduction.

      - **A 2026 paper on semirandom hypergraphs** gives a reduction from a related hypergraph problem (with r=1)
      to graph planted clique. That is the easy direction again.


      These are partial forms of "more evidence", but the central conjecture (that HPC is as hard as PC) appears
      to be still open. I didn''t read the full texts, so this is based on abstracts and search snippets.'
    papers:
    - title: Detection of Dense Subhypergraphs by Low-Degree Polynomials
      year: 2023
      arxiv_id: '2304.08135'
      claim: Finds where low-degree polynomial tests stop working for detecting planted dense subhypergraphs in
        random hypergraphs. This is restricted-model evidence of hardness, not a reduction from PC.
    - title: Planted Clique Conjectures Are Equivalent
      year: 2024
      arxiv_id: null
      claim: Shows that most variants of the planted clique conjecture are equivalent (STOC 2024). As far as the
        search results show, it covers graphs only and does not settle the hypergraph equivalence.
    - title: Reducibility and Statistical-Computational Gaps from Secret Leakage
      year: 2020
      arxiv_id: '2005.08099'
      claim: Assumes a k-partite hypergraph variant of planted clique is hard and uses it as the strongest hypothesis
        behind its lower bounds. It does not derive that hardness from graph PC.
    - title: Improved Certificates for Independence Number in Semirandom Hypergraphs
      year: 2026
      arxiv_id: '2603.08693'
      claim: Notes a reduction from a related hypergraph planted-structure problem (r=1) to graph planted clique,
        so that problem is no harder than graph PC. This is the easy direction.
    searches:
    - hypergraph planted clique equivalent to planted clique reduction hardness
    - low-degree hardness planted dense subhypergraph detection Dhawan Mao Wein
    - Hirahara Shimizu planted clique conjectures are equivalent hypergraph
    - '"hypergraph planted clique" hardness reduction from planted clique 2024 OR 2025'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  steinke20b:
    title: 'Open Problem: Information Complexity of VC Learning'
    authors:
    - Thomas Steinke
    - Lydia Zakynthinou
    year: 2020
    url: https://proceedings.mlr.press/v125/steinke20b.html
    bandits: 'no'
    statement: Does every VC class of dimension d have a learner whose conditional mutual information (CMI) is O(d),
      rather than the known d log n + 2 for ERM? That would make CMI-based generalization bounds recover the uniform-convergence
      rates exactly, with no log n factor. The conjecture was posed for proper learners in both the realizable and
      agnostic settings.
    status: partially_resolved
    summary: 'The proper-learner conjecture was disproved in the realizable case. Haghifam, Dziugaite, Moran and
      Roy (arXiv 2011.02970; also in their NeurIPS 2021 paper, arXiv 2111.05275) showed that the d log n + 2 bound
      cannot be improved to O(d). They also gave VC classes where no proper learner''s CMI can be bounded by any
      function of the VC dimension alone. Both papers describe this as a negative resolution of the Steinke–Zakynthinou
      open problem.


      Positive results exist only for variants. The NeurIPS 2021 paper shows that stable compression schemes of
      size k have CMI O(k), which gives the optimal risk bound for SVMs learning halfspaces. Later, Haghifam et
      al.''s leave-one-out CMI paper (arXiv 2206.14800) says its framework gives the optimal risk bound for every
      VC class in the realizable setting. It also says that chaining CMI gives the optimal O(√(d/n)) rate for agnostic
      ERM. These results change the information measure (leave-one-out CMI, chaining) or allow improper learners,
      so they don''t answer the original question directly.


      I found no paper that settles the original agnostic question, or whether an improper learner can have standard
      CMI of O(d), in either direction. So the problem is partially resolved: the proper, realizable case is answered
      negatively, and the variants above give positive results.'
    papers:
    - title: On the Information Complexity of Proper Learners for VC Classes in the Realizable Case
      year: 2020
      arxiv_id: '2011.02970'
      claim: Shows that the CMI bound d log n + 2 for proper learners of VC classes cannot be improved to O(d) in
        the realizable case. Also gives VC classes where no proper learner's CMI can be bounded by any function
        of d alone. This is a negative resolution of the Steinke–Zakynthinou conjecture.
    - title: Towards a Unified Information-Theoretic Framework for Generalization
      year: 2021
      arxiv_id: '2111.05275'
      claim: 'States that it implies a negative resolution of the Steinke–Zakynthinou (2020) open problem: proper
        learning of VC classes has an inherent limitation that rules out constant CMI. Also shows that stable compression
        schemes of size k have CMI O(k), giving the optimal risk bound for SVMs on halfspaces.'
    - title: Understanding Generalization via Leave-One-Out Conditional Mutual Information
      year: 2022
      arxiv_id: '2206.14800'
      claim: Says its leave-one-out CMI framework gives the optimal risk bound for every VC class in the realizable
        setting, and that chaining CMI gives the optimal O(√(d/n)) rate for agnostic ERM on VC classes.
    searches:
    - conditional mutual information VC classes open problem Steinke Zakynthinou resolved agnostic
    - agnostic learning VC classes conditional mutual information optimal rate sqrt(d/n) without log factor information-theoretic
      generalization
    - '"conditional mutual information" improper learner VC dimension O(d) agnostic optimal generalization bound
      open problem 2023 2024'
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
