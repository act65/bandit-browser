      the Lovitz–Petrov condition. That condition is implied by Kruskal's and can be checked in polynomial time.
      The paper says this affirmatively answers the question posed by Bhaskara et al., including the $100 prize
      question. The result is for exact input only; no robust or noisy version up to the threshold was found. Earlier,
      Bhargava, Schulman & Sivan (ECCC 2026, ICALP 2026) gave an algorithm running in time n^O(k), where k is the
      smallest Kruskal rank, which is polynomial only when that rank is bounded.
