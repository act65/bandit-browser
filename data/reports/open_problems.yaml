  kale14b:
    title: 'Open Problem: Efficient Online Sparse Regression'
    authors:
    - Satyen Kale
    year: 2014
    url: https://proceedings.mlr.press/v35/kale14b.html
    bandits: adjacent
    statement: 'Online sparse regression with squared loss and limited feature access: in each round the learner
      may observe only k (or a few more) of the d features of the current example, then predicts. Can a polynomial-time
      algorithm (polynomial in d, k, T) get sublinear regret against the best k-sparse linear regressor?'
    status: resolved
    summary: This problem is resolved, and the answer is negative. In "Online Sparse Linear Regression" (COLT 2016),
      Foster, Kale and Karloff give an inefficient algorithm with Õ(√T) regret. They also prove that unless NP ⊆
      BPP, no algorithm that runs in polynomial time per round can get regret O(T^{1-δ}) for any constant δ > 0.
      This holds even if the algorithm may look at more features than the best sparse regressor uses, up to a logarithmic
      factor in the dimension. The paper says explicitly that this answers Kale's COLT 2014 open problem, which
      was also posed by Zolghadr et al. (2013). Positive results are only possible with extra assumptions on the
      data. For example, Kale, Karnin, Liang and Pál (ICML 2017) give efficient algorithms with sublinear regret
      when the data satisfies the restricted isometry property (RIP). This problem is close to bandits (adjacent)
      because it is online learning with partial observation of the features.
