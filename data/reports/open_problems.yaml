  hu24a:
    title: 'Open Problem: Optimal Rates for Stochastic Decision-Theoretic Online Learning Under Differentially Privacy'
    authors:
    - Bingshan Hu
    - Nishant A. Mehta
    year: 2024
    url: https://proceedings.mlr.press/v247/hu24a.html
    bandits: adjacent
    statement: For stochastic decision-theoretic online learning (prediction with expert advice, i.i.d. losses)
      with K actions, T rounds and minimum gap Δ_min, the non-private optimal pseudo-regret is Θ(log K/Δ_min). The
      question is what the optimal gap-dependent pseudo-regret rate is under ε-differential privacy.
    status: resolved
    summary: 'The problem looks resolved, up to constant factors, by a May 2026 arXiv preprint that has not been
      peer-reviewed. The known lower bound is Ω(log K/Δ_min + log K/ε), which is the same as log K/min{Δ_min, ε}
      up to constants. At the time the problem was posed, the best upper bound was O(log K/Δ_min + log K·log T/ε).


      - **Partial progress (2025):** Wu and Wang (arXiv:2502.10997) removed the dependence on T, giving O(log K/Δ_min
      + log² K/ε). They also proved a matching Θ(log K/ε) rate for a weaker setting where losses are deterministic.
      They describe their own result as a partial resolution.

      - **Closing the gap (2026):** arXiv:2605.29148 proves an upper bound of 1000·(log K/Δ_min + log K/ε) for every
      horizon T under pure ε-DP. It uses a randomized-prefix private Follow-the-Leader over dyadic blocks, with
      the exponential mechanism applied to a randomly chosen prefix of cumulative losses. This matches the lower
      bound up to a constant, which the authors say they did not optimize.


      So the optimal rate is Θ(log K/Δ_min + log K/ε), but only up to universal constants, and the result rests
      on that one unreviewed preprint.


      I read the abstracts of both papers but not the proofs. One aggregator listed the 2026 paper''s authors as
      Cesari and Colomboni, but I did not check that on arXiv.'
    papers:
    - title: Improved Regret in Stochastic Decision-Theoretic Online Learning under Differential Privacy
      year: 2025
      arxiv_id: '2502.10997'
      claim: Proves an upper bound of O(log K/Δ_min + log² K/ε) with no dependence on T. Also proves a matching
        Θ(log K/ε) rate when losses are deterministic. The authors call this a partial resolution of the Hu–Mehta
        open problem.
    - title: Optimal Gap-Dependent Regret for Private Stochastic Decision-Theoretic Online Learning
      year: 2026
      arxiv_id: '2605.29148'
      claim: Gives a horizon-free pure ε-DP algorithm with regret at most 1000·(log K/Δ_min + log K/ε). This matches
        the known lower bound of log K/min{Δ_min, ε} up to constants.
    searches:
    - differentially private stochastic decision-theoretic online learning optimal gap-dependent regret experts
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  kornowski24a:
    title: 'Open Problem: Anytime Convergence Rate of Gradient Descent'
    authors:
    - Guy Kornowski
    - Ohad Shamir
    year: 2024
    url: https://proceedings.mlr.press/v247/kornowski24a.html
    bandits: adjacent
    statement: Is there a stepsize schedule for vanilla gradient descent on smooth convex functions that beats the
      classic O(1/T) rate at every stopping time T (an anytime guarantee), not just at a horizon chosen in advance?
    status: resolved
    summary: Answered yes by Zhang, Lee, Du and Chen, "Anytime Acceleration of Gradient Descent" (arXiv 2411.17668,
      COLT 2025). Their stepsize schedule is fixed in advance without knowing the stopping time and achieves O(T^{-1.119})
      at every T for smooth convex functions. The exponent is 2log2(ρ)/(1+log2(ρ)), where ρ = 1+√2 is the silver
      ratio. For smooth strongly convex functions the rate is exp(-Ω(T/κ^{0.893})). The first arXiv version reported
      weaker exponents (T^{-1.03} and κ^{0.97}). Nobody has shown whether the optimal T^{-2} rate can be reached
      at every stopping time, and no improvement on 1.119 was found, but the question as posed is answered.
    papers:
    - title: Anytime Acceleration of Gradient Descent
      year: 2024
      arxiv_id: '2411.17668'
      claim: Gives a stepsize schedule that does not need the stopping time and achieves O(T^{-1.119}) at every
        T for smooth convex GD (T^{-1.03} in v1), plus exp(-Ω(T/κ^{0.893})) in the strongly convex case. This explicitly
        answers the Kornowski–Shamir open problem. Published at COLT 2025.
