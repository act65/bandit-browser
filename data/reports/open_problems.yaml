  chae23a:
    title: 'Open Problem: Is There a First-Order Method that Only Converges to Local Minimax Optima?'
    authors:
    - Jiseok Chae
    - Kyuwon Kim
    - Donghwan Kim
    year: 2023
    url: https://proceedings.mlr.press/v195/chae23a.html
    bandits: adjacent
    statement: Is there a first-order method for nonconvex-nonconcave minimax optimisation that converges only to
      local minimax optima, including non-strict ones and not just strict ones? Such a method would behave like
      gradient descent, which converges to local minima. The paper also asks what the right notion of local minimax
      optimum should be.
    status: partially_resolved
    summary: 'I rate this partially resolved because later work only answers weaker versions of the question.


      **What has been shown:**

      - **Chae, Kim & Kim (ICLR 2024, arXiv 2305.16242):** two-timescale extragradient converges to points that
      satisfy the second-order necessary condition for local minimax points. It works in cases where two-timescale
      gradient descent ascent fails, and it drops the assumption that the Hessian in the maximisation variable is
      nondegenerate.

      - **Kim & Kim (ICML 2024):** extragradient with a double-step alternating update and an increasing timescale
      separation converges to some non-strict local minimax points that all earlier two-timescale methods miss.

      - **Daskalakis et al. (COLT 2023, STON''R):** guaranteed convergence to a local min-max equilibrium. The search
      summary describes it as a second-order method, so it does not count as the first-order method the question
      asks for.


      **What is still missing:** I found no paper that gives a first-order method that converges only to local minimax
      optima, meaning it provably avoids all other stationary points in general. Searches for 2025 work also turned
      up nothing that closes the question. The question as posed appears to remain open.'
    papers:
    - title: Two-timescale Extragradient for Finding Local Minimax Points
      year: 2024
      arxiv_id: '2305.16242'
      claim: Two-timescale extragradient converges to points that satisfy the second-order necessary condition for
        local minimax points, in cases where two-timescale GDA fails. It removes the assumption that the Hessian
        in the maximisation variable is nondegenerate.
    - title: Kim & Kim, ICML 2024 (PMLR v235, kim24m)
      year: 2024
      arxiv_id: null
      claim: Extragradient with a double-step alternating update and increasing timescale separation converges to
        some non-strict local minimax points that all existing two-timescale methods fail to converge to.
    - title: 'STay-ON-the-Ridge: Guaranteed Convergence to Local Minimax Equilibrium in Nonconvex-Nonconcave Games'
      year: 2023
      arxiv_id: null
      claim: Guaranteed convergence to a local min-max equilibrium for smooth nonconvex-nonconcave objectives. The
        search summary describes it as a second-order method, so it does not answer the first-order question.
    searches:
    - first-order method converges only to local minimax optima nonconvex-nonconcave
    - Chae Kim two-timescale extragradient non-strict local minimax optima
    - first-order method avoids non-local-minimax points converges almost surely local minimax 2025
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  cohen23b:
    title: 'Open problem: log(n) factor in "Local Glivenko-Cantelli"'
    authors:
    - Doron Cohen
    - Aryeh Kontorovich
    year: 2023
    url: https://proceedings.mlr.press/v195/cohen23b.html
    bandits: 'no'
    statement: Can the log(n) factor in the Cohen–Kontorovich (COLT 2023) upper bound on the expected maximal deviation
      of the empirical mean for Bernoulli product measures on {0,1}^N be removed?
    status: resolved
    summary: The answer is negative. Blanchard and Voráček (ALT 2024) say directly that they answer this COLT 2023
      open problem. Their Theorem 2 shows that any bound of the form C√(S(p)/n) + (T(p)/n)ψ(n) that holds for all
      large n and all product distributions needs ψ(n) ≥ c·ln n. So the ln(n) factor cannot be dropped while the
      bound uses only S(p) and T(p). They also give tight non-asymptotic bounds for product distributions, which
      shows the looseness comes from using only those two quantities. Later work by Cohen, Kontorovich and Weiss
      (2024) shows the empirical mean is minimax optimal in this setting, unless an estimator exploits certain infinite-dimensional
      pathologies. The theorem statement comes from an ar5iv rendering that the tool only partly read.
    papers:
    - title: Tight Bounds for Local Glivenko-Cantelli
      year: 2023
      arxiv_id: '2308.01896'
      claim: Shows the ln(n) factor is necessary for any bound of the form C√(S/n) + (T/n)ψ(n) using only S(p) and
        T(p), answering the COLT 2023 open problem negatively. Also gives tight non-asymptotic bounds for product
        distributions.
    - title: The Empirical Mean is Minimax Optimal for Local Glivenko-Cantelli
      year: 2024
      arxiv_id: '2410.02835'
      claim: Shows no estimator can learn a larger class of measures or achieve faster risk decay than the empirical
        mean, unless it exploits infinite-dimensional pathologies. The abstract does not mention the log factor.
    searches:
    - Local Glivenko-Cantelli log factor removed Bernoulli mean estimation infinite-dimensional
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
  criscitiello23b:
    title: 'Open Problem: Polynomial linearly-convergent method for g-convex optimization?'
    authors:
    - Christopher Criscitiello
    - David Martínez-Rubio
    - Nicolas Boumal
    year: 2023
    url: https://proceedings.mlr.press/v195/criscitiello23b.html
    bandits: 'no'
    statement: For a Lipschitz, geodesically convex f on a d-dimensional Riemannian manifold, is there a deterministic
      first-order method that uses O(poly(d) log(1/ε)) subgradient queries and O(poly(d)) arithmetic per query?
      In other words, is there an ellipsoid-method analogue for general Riemannian manifolds?
    status: open
    summary: 'The general question still looks open. The open-problem paper itself already answered the constant-curvature
      case (hemisphere and hyperbolic space) with an ellipsoid-like method: O(d² log²(1/ε)) queries and O(d²) work
      per query.


      One later preprint improves that special case. Zhang, Yang, Zhu and Zhang (arXiv 2605.17540, May 2026) give
      "One-Shot Klein Cutting Planes" for hyperbolic space. Using the Beltrami–Klein model, each Riemannian subgradient
      cut becomes a single Euclidean central cut, so one fixed ellipsoid can track the region that still contains
      the minimiser. This gives about 2d(d+1)·log(…/ε) oracle calls, at O(d²) per step, with the curvature dependence
      added rather than compounded. The authors say explicitly that "the general Hadamard-manifold problem remains
      open". They also argue that manifolds whose curvature varies (but stays bounded) would need a new way to track
      the region under curved cuts.


      Older and related work does not settle it either. Rusciano''s earlier cutting-plane result for Hadamard manifolds
      is non-constructive. Criscitiello and Boumal''s lower bounds and later hyperbolic lower bounds (arXiv 2610.26815,
      only seen as a search snippet) cover the polynomial-in-1/ε regime, not log(1/ε). Work on horospherically convex
      optimization (arXiv 2505.16970) gives subgradient and accelerated methods without curvature dependence, but
      no linear-rate cutting-plane method.


      So far only the constant-curvature special case has been answered, by the original paper and the 2026 preprint.
      I found nothing that resolves the general-manifold question.'
    papers:
    - title: One-Shot Klein Cutting Planes for Lipschitz Geodesically Convex Optimization in Hyperbolic Space
      year: 2026
      arxiv_id: '2605.17540'
      claim: Uses the Klein model to turn each Riemannian subgradient cut on hyperbolic space into one Euclidean
        central cut. Gets about 2d(d+1)·log(…/ε) oracle calls at O(d²) per step, improving the open-problem paper's
        log² bound for the hyperbolic case. Says the general Hadamard-manifold problem remains open.
    - title: 'Open Problem: Polynomial linearly-convergent method for geodesically convex optimization?'
      year: 2023
      arxiv_id: '2307.12743'
      claim: The original open-problem paper. Gives an ellipsoid-like method with O(d² log²(1/ε)) queries for constant-curvature
        manifolds and lists the obstacles for general manifolds.
    searches:
    - ellipsoid method Riemannian manifold geodesically convex linear convergence polynomial dimension cutting plane
    - geodesically convex optimization general Riemannian manifold polynomial query complexity log(1/epsilon) open
      problem Criscitiello
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
