  open-problem-hanneke21b:
    title: 'Open Problem: Is There an Online Learning Algorithm That Learns Whenever Online Learning Is Possible?'
    authors:
    - Steve Hanneke
    year: 2021
    url: https://proceedings.mlr.press/v134/open-problem-hanneke21b.html
    bandits: 'no'
    statement: 'Does there exist an online learning algorithm for binary classification that makes sublinearly many
      mistakes for every target concept on every (possibly random) sequence of points X that admits some such learner
      (i.e. an optimistically universal online learner)? Secondary: does a specific concise condition characterise
      which processes X admit universal online learning?'
    status: resolved
    summary: 'Blanchard (COLT 2022) answers the main question with yes. He gives a new variant of the 1-nearest-neighbour
      rule that is optimistically universal, in both the strong and weak senses, for general input and value spaces
      with bounded losses. He shows that k-nearest neighbours is not optimistically universal. He also fully characterises
      which processes admit universal online learning, and states that the paper closes all of Hanneke''s COLT 2021
      open problems on universal online learning. The arXiv abstract does not list the main and secondary questions
      separately, so resolution of the secondary condition rests on that ''all'' claim. A companion ALT 2022 paper
      by Blanchard, Cosson and Hanneke settles the related unbounded-loss question: there, plain memorisation is
      optimistically universal.'
    papers:
    - title: 'Universal Online Learning: an Optimistically Universal Learning Rule'
      year: 2022
      arxiv_id: '2201.05947'
      claim: Characterises the processes that admit strong and weak universal online learning. Gives a 1NN variant
        that is optimistically universal and shows kNN is not. Abstract states it closes all of Hanneke's COLT 2021
        open problems on universal online learning.
    - title: 'Universal Online Learning with Unbounded Losses: Memory Is All You Need'
      year: 2022
      arxiv_id: '2201.08903'
      claim: 'Answers Hanneke''s related question for unbounded losses: the processes admitting universal learning
        are exactly those with finitely many distinct values almost surely, and memorisation is optimistically universal.'
    searches:
    - Blanchard optimistically universal online learning rule Hanneke open problem solved
    checked: '2026-10-23'
    models:
    - claude-opus-5-5[1m]
    - claude-haiku-5-5
