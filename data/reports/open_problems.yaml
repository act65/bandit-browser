  fish17a:
    title: 'Open Problem: Meeting Times for Learning Random Automata'
    authors:
    - Benjamin Fish
    - Lev Reyzin
    year: 2017
    url: https://proceedings.mlr.press/v65/fish17a.html
    bandits: 'no'
    statement: 'Conjecture: for a random DFA, two random walks from any pair of states that read the same random
      word meet within c·n steps, except with probability at most n^(-b). This would give a learning algorithm for
      random DFAs under the uniform distribution that is faster than brute force. The broader question is whether
      such learning has non-trivial algorithms or lower bounds.'
    status: open
    summary: No paper found proves or disproves the conjecture for walks that read the same word (coupled walks).
      Quattropani & Sau (2022/2023) were inspired by it and study independent walks on random DFAs. There, meeting
      times are roughly geometric with rate 1/n, and this is tight, so the conjectured bound fails for independent
      walks (their Corollary 2.5). They prove nothing for coupled walks; their simulations suggest similar behaviour,
      which is evidence against the conjecture. A 2025 paper proves Statistical Query hardness for learning semiautomata
      under the uniform distribution. Its abstract doesn't mention random DFAs; a search summary says it calls itself
      a first step toward the random-DFA open problems. Neither paper resolves the learning question.
    papers:
    - title: On the meeting of random walks on random DFA
      year: 2022
      arxiv_id: '2204.02827'
      claim: For independent walks on a random DFA (random out-regular graph), with high probability the meeting
        time is stochastically dominated by a geometric variable of rate (1+o(1))/n, and this is typically tight.
        So the Fish–Reyzin bound fails for independent walks. The coupled version is left open; simulations suggest
        it behaves similarly.
    - title: 'On the Statistical Query Complexity of Learning Semiautomata: a Random Walk Approach'
      year: 2025
      arxiv_id: '2510.04115'
      claim: Proves the first Statistical Query hardness result for learning semiautomata under the uniform distribution
