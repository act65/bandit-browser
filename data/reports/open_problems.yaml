  vakili24a:
    title: 'Open Problem: Order Optimal Regret Bounds for Kernel-Based Reinforcement Learning'
    authors:
    - Sattar Vakili
    year: 2024
    url: https://proceedings.mlr.press/v247/vakili24a.html
    bandits: adjacent
    statement: For episodic MDPs whose value functions lie in an RKHS (kernel-based RL), can we design algorithms
      with order-optimal regret, or at least no-regret (sublinear) guarantees, for general kernels? This includes
      non-smooth kernels such as Matérn with small smoothness ν and the Neural Tangent kernel. For these kernels,
      existing analyses of optimistic LSVI-type methods give trivial (superlinear) bounds, and the regret should
      ideally match the known kernel-bandit lower bound Ω(T^((ν+d)/(2ν+d))) for Matérn kernels.
    status: open
    summary: 'I found no later paper that resolves this open problem as posed.


      **Before the open problem.** Vakili & Olkhovskaya (NeurIPS 2023, arXiv 2306.07745) introduced π-KRVI, a domain-partitioning
      variant of kernel optimistic least-squares value iteration. They claimed order-optimal regret for Matérn kernels.
      That claim is now disputed. A May 2026 arXiv paper (2605.23650) says the derivation seems to rely on "a subtle
      issue in the covering argument", so the stated bound does not follow. It credits this analysis to Maran et
      al. (2024b, Appendix F). The search results and abstracts I saw did not identify which Maran et al. paper
      that is, and I did not read that appendix myself. The 2026 paper itself says that whether its own preference-feedback
      algorithm (PROSTO) can be made order-optimal "remains an open question".


      **After the open problem, related progress only:**

      - **Average-reward setting:** a NeurIPS 2024 paper (arXiv 2410.23498) gives the first no-regret guarantee
      for kernel-based average-reward RL, with KUCB-RL achieving Õ(T^((3ν+4d)/(4ν+4d))). This is not order-optimal,
      and the authors say they cannot tell whether it can be improved.

      - **Smooth MDPs:** Maran, Metelli, Papini & Restelli (ICML 2024) get no-regret results in ν-smooth MDPs using
      Legendre-polynomial features. This is a related structure, not the RKHS setting itself.

      - **Kernel smoothing:** a 2026 arXiv paper (2605.07218) on model-based RL with kernel smoothing in Lipschitz
      MDPs improves the dependence on the horizon. It does not state optimality.


      In short, the general episodic kernel-RL question (order-optimal, or even no-regret, for all kernels) appears
      to still be open. The searches also failed to turn up any confirmed optimal result.'
    papers:
    - title: Kernelized Reinforcement Learning with Order Optimal Regret Bounds
      year: 2023
      arxiv_id: '2306.07745'
      claim: π-KRVI, a domain-partitioning version of optimistic LSVI, is claimed to give sublinear regret for general
        kernels and order-optimal regret for Matérn kernels. This predates the open problem, and later work disputes
        it.
    - title: No-Regret Reinforcement Learning in Smooth MDPs
      year: 2024
      arxiv_id: '2402.03792'
      claim: Introduces ν-smooth MDPs, which generalize linear and Lipschitz MDPs. Legendre-Eleanor and Legendre-LSVI
        achieve no-regret in this related (non-RKHS) setting.
    - title: 'Kernel-Based Function Approximation for Average Reward Reinforcement Learning: An Optimist No-Regret
        Algorithm'
      year: 2024
      arxiv_id: '2410.23498'
      claim: KUCB-RL achieves Õ(T^((3ν+4d)/(4ν+4d))) regret in kernel-based average-reward RL. This is the first
        no-regret result in that setting, but it is not shown to be order-optimal.
    - title: Learning Kernel-Based MDPs from Episodic Preferential Feedback
      year: 2026
      arxiv_id: '2605.23650'
      claim: Says the sharper bound claimed by Vakili & Olkhovskaya (2023) seems to rely on a flaw in the covering
        argument, citing Maran et al. (2024b, App. F). Also states that whether its PROSTO regret bound can be made
        order-optimal remains open.
    - title: Improved Model-based Reinforcement Learning with Smooth Kernels
      year: 2026
      arxiv_id: '2605.07218'
      claim: A kernel-smoothing, model-based method with a Bernstein-type exploration bonus for Lipschitz MDPs.
        Improves the state-of-the-art regret in its dependence on the horizon; no optimality claim.
    searches:
    - order optimal regret kernel-based reinforcement learning Matérn 2025
    - Maran Metelli Papini Restelli no-regret reinforcement learning smooth MDPs kernel Vakili Olkhovskaya covering
      issue
    - kernel-based reinforcement learning regret lower bound matching upper bound RKHS Q-function 2025 arXiv
    - kernelized MDP optimal regret "kernel-based reinforcement learning" open problem Vakili 2024 resolved improved
