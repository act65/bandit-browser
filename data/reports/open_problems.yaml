    status: resolved
    summary: Kale, Lee and Pál (NeurIPS 2016, arXiv 1509.03600) directly answer this COLT 2015 open problem, negatively
      but conditionally. They show that sleeping versions of online shortest paths and several other combinatorial
      problems are at least as hard as PAC learning DNF. The other problems are minimum spanning tree, k-subsets,
