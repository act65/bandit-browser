    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: zimmert2021tsallisinf:r1
    op: verify
    reason: >
      Confirmed by an author of the paper: Theorem 1 (4 sqrt(KT) + 1) holds against adaptive adversaries, as a bound
