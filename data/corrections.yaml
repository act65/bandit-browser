# Manual corrections to extractions (desiderata D5). Applied by pipeline/resolve.py on top of
# data/extractions/ (which are never edited by hand). Every entry records who made it, why,
# and its review status.
#   target: <paper_id>:<result_id>, or <paper_id>:* for every result of the paper
#   op: set (field, value) | multiply_expression_by (factor) | add_condition (value)
corrections:
  - target: auer2002exp3:r14
    op: multiply_expression_by
    factor: T
    reason: >
      Theorem 9.1 bounds the AVERAGE per-round regret max_j R_i^(j)(T) / T (the extractor's own
      notes say so); multiplying by T states the same claim for total regret. Found by the
      conflict check (upper bound below the sqrt(KT) lower bound).
    by: assistant (Claude), 2026-10-20
    status: pending_human_review
  - target: joseph2016fairness:r6
    op: set
    field: conditions
    value: ["noiseless rewards equal to the conjunction value (ConjunctionBandit model)"]
    reason: >
      The O(k^2 d) bound for ConjunctionBandit (Sec. 6) treats rewards as the deterministic conjunction
      value (see the extractor's own note); without the condition it was carried by finite_K ->
      structured_general to noisy K-armed settings, below the sqrt(KT) lower bound. Found by the
      conflict check after batch 1.
    by: assistant (Claude), 2026-10-21
    status: pending_human_review
  - target: bubeck2017sparsity:r5
    op: set
    field: conditions
    value: ["starved bandit feedback protocol (Bubeck, Cohen & Li 2017, Thm 4)"]
    reason: >
      The n^{1/3} T^{2/3} / 20 lower bound is for the *starved* multi-armed bandit (source line
      "For any strategy for the starved multi-armed bandit ..."), a weaker feedback protocol the
      ontology does not express; it was extracted into the plain adversarial K-armed setting, above
      the sqrt(KT) upper bounds. Found by the conflict check after batch 1.
    by: assistant (Claude), 2026-10-21
    status: pending_human_review
  - target: liu2026quantum:*
    op: add_condition
    value: quantum reward oracle access (stronger than bandit feedback)
    reason: >
      Quantum multi-armed and linear bandits: the learner queries quantum reward oracles, which gives
      K log T regret, below the classical sqrt(KT) lower bound. The ontology has no quantum-access value,
      so the results were extracted into classical settings. Found by the conflict check after batch 1.
    by: assistant (Claude), 2026-10-21
    status: pending_human_review
  - target: shah2018bandit:*
    op: add_condition
    value: "positive externalities: user arrivals depend on past rewards (externality function f)"
    reason: >
      Bandit learning with positive externalities: arrivals depend on past rewards, a different protocol
      from the stochastic K-armed bandit it was extracted into (its log^2 T lower bound sat above the
      UCB1 log T upper bound). Found by the conflict check after batch 1.
    by: assistant (Claude), 2026-10-21
    status: pending_human_review
  - target: cesabianchi2024role:r3
    op: add_condition
    value: "semi-transparent feedback (V_t observed if the auction is won, M_t if lost): a different mechanism from the transparent feedback sharing this setting"
    reason: >
      Semi-transparent and transparent first-price-auction feedback both map to feedback = partial_monitoring
      with unspecified observability, so the T^(2/3) lower bound (semi-transparent, Thm 3) and the
      sqrt(T log T) upper bound (transparent, Thm 4) land in one setting. The ontology cannot yet name the
      mechanism (candidate for the next review). Found by the conflict check after the v0.5 re-extraction.
    by: assistant (Claude), 2026-10-22
    status: pending_human_review
  - target: dai2022incentive:*
    op: add_condition
    value: "incentive-aware recommendation model (two-sided market; regret via expected losses observed by the designer)"
    reason: >
      Incentive-Aware Recommender Systems in Two-Sided Markets: the sqrt(T log K) bounds come from an
      exponential-weights analysis over expected losses the designer can evaluate, i.e. not bandit feedback
      on the K arms; extracted as feedback = bandit they sat below the sqrt(KT) bandit lower bounds.
      Found by the conflict check after the v0.5 re-extraction.
    by: assistant (Claude), 2026-10-22
    status: pending_human_review
  - target: bubeck2013bounded:r7
    op: add_condition
    value: "holds at some gap Delta in (0,1] (sup over Delta), not at every fixed gap: not comparable per instance"
    reason: >
      Theorem 8 bounds max(R_n(nu_0), sup_Delta Delta R_n(nu_Delta)) >= log(n/139)/2: there exists an instance
      with some gap where regret is large, which is not a log T lower bound at a fixed Delta. Read per instance
      it conflicted with Garivier et al.'s bounded regret for known mu_star. Moreover the authors' erratum
      (cited by Garivier, Ménard & Stoltz) says the proof of Theorem 8 is not correct and its truth is unknown.
      Found while drafting outreach (the conflict on setting S-40047484).
    by: assistant (Claude), 2026-10-23
    status: pending_human_review
  - target: cesabianchi2024role:r2
    op: add_condition
    value: "semi-transparent feedback (V_t observed if the auction is won, M_t if lost): a different mechanism from the transparent feedback sharing this setting"
    reason: >
      Theorem 3's T^(2/3) upper bound is for semi-transparent feedback, like the lower bound r3 (corrected
      2026-10-22); it shared the transparent-feedback setting. Found while drafting outreach.
    by: assistant (Claude), 2026-10-23
    status: pending_human_review
  - target: garivier2016etc:r10
    op: set
    field: algorithm_class
    value: other
    reason: >
      The 4 log(T)/Delta lower bound holds only for explore-then-commit strategies (the condition says so:
      "pi is an ETC strategy ... uniformly efficient"); recorded as uniformly_good it set the rate of generic
      Gaussian / sub-Gaussian cells. Found by the inference audit (2026-10-26).
    by: assistant (Claude), 2026-10-26
    status: pending_human_review
  - target: garivier2016etc:r10
    op: set
    field: conditions
    value: ["restricted to explore-then-commit strategies (uniform alternating exploration, then commit)"]
    reason: >
      compare.py admits an algorithm_class-other lower bound whose condition states consistency; the original condition
      ("ETC strategy ... uniformly efficient") matched that rule, so it is replaced by the restriction alone (the
      uniform-efficiency requirement is in the paper's statement).
    by: assistant (Claude), 2026-10-26
    status: pending_human_review
  # ---- conflict review after batch 2 (2026-11-09)
  - target: resler2018adversarial:*
    op: add_condition
    value: observed losses are flipped by random Bernoulli noise (noisy-feedback model of Resler & Mansour)
    reason: >
      Every setting of the paper observes binary losses XORed with Bernoulli((1-eps)/2) noise (constant or variable
      eps); the extractor put this in `unmapped`, so the T^{2/3} lower bounds (Thms 7, 15) reached the plain adversarial
      K-armed and full-information settings and conflicted with sqrt(KT) upper bounds (13 + 8 conflict cells).
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: feng2017learning:*
    op: add_condition
    value: win-only / outcome-based feedback (reward functions observed for all actions given the realized outcome)
    reason: >
      The paper's feedback models reveal r_t(., o_t) for every action and the allocation function: far richer than bandit
      feedback, recorded only as partial_monitoring; bandit sqrt(KT) lower bounds reached it through bandit ⊑
      partial_monitoring and conflicted with its 4 sqrt(T log K) bound.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: lumbreras2025bandits:*
    op: add_condition
    value: quantum state learning with Pauli observables as actions
    reason: Quantum setting (out of scope since v0.5) extracted as a stochastic linear bandit; its sqrt((K-1)T) lower bound conflicted with sqrt(dT log K) linear-bandit upper bounds.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: bubeck2017sparsity:r6
    op: set
    field: conditions
    value: ["starved bandit feedback protocol (Bubeck, Cohen & Li 2017, Thm 4)"]
    reason: The l1-ball lower bound is for the starved linear bandit (quote "The same lower bound holds for the starved linear bandit"), like r5.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: bubeck2012survey:r12
    op: set
    field: bound.expression
    value: sqrt(2*T*K*log(N_exp))
    reason: >
      The statement prints sqrt(2 n N ln K), but its own learning rate eta = sqrt(2 ln N / (n K)) and the proof give
      sqrt(2 n K ln N), the standard Exp4 bound (Auer et al. 2002): a typo in the source. The printed form conflicted
      with the sqrt(KT) expert-advice lower bound (eldowa2023information Thm 8).
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: bubeck2012survey:r13
    op: set
    field: bound.expression
    value: 2*sqrt(T*K*log(N_exp))
    reason: Same typo as r12 (anytime rate eta_t = sqrt(ln N / (t K)) gives 2 sqrt(n K ln N)).
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: eldowa2023information:r7
    op: add_condition
    value: N_exp >= K
    reason: >
      The multi-task construction has N = q^(K/q) >= K experts; stating it lets compare.py see that the bound says
      nothing about K -> infinity at fixed N (it conflicted with min(K, N)-type upper bounds).
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: audibert2011minimax:r20
    op: add_condition
    value: m = d/2
    reason: The d sqrt(n) lower bound is the worst case over action sets; the hard sets have m = d/2 (sqrt(m d n) in general), so it says nothing about d -> infinity at fixed m.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: audibert2011minimax:r21
    op: add_condition
    value: m = d/2
    reason: As r20.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: song2025outcome:r2
    op: add_condition
    value: arms share rewards through a known partition into m outcome groups
    reason: >
      The sqrt(mT log T) bound uses the outcome structure (balanced partition, s_o = K/m arms per outcome); the setting
      key cannot express it, so the bound sat below the sqrt(KT) K-armed lower bounds (conflict since batch 1).
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: suk2024stationary:r9
    op: add_condition
    value: regret against a reference weight chosen after the algorithm (unknown-weight dueling regret)
    reason: A different regret notion from Condorcet/Borda regret; its T/45 lower bound conflicted with Exp3-type dueling upper bounds.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: yanjun2020learning:r8
    op: add_condition
    value: comparator is the best monotone bidding function (not Lipschitz)
    reason: The Omega(T) bound (Thm 6) is against monotone oracles; the paper's sqrt(T) log T bounds are against Lipschitz policies, in the same canonical setting.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: cesabianchi2024role:r8
    op: add_condition
    value: valuations unknown when bidding (revealed only afterwards)
    reason: >
      Thm 8's T/24 is for first-price auctions with unknown valuations; the learner of yanjun2020learning observes its
      value before bidding, so its sqrt(T) log T bound does not apply. The ontology cannot express this yet.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: yu2026practical:r1
    op: add_condition
    value: number of batches grows with T (O(log log T) batches)
    reason: The bound needs log log T batches; inherited into fixed-M batched settings it fell below han2020sequential's fixed-M lower bound.
    by: assistant (Claude), 2026-11-09
    status: pending_human_review
  - target: suk2024stationary:*
    op: add_condition
    value: regret against a reference weight chosen after the algorithm (unknown-weight dueling regret)
    reason: >
      All the paper's bounds measure regret w.r.t. a reference weight w over arms (generalised dueling winners), a
