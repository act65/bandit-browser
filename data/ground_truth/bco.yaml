open_problems:
  - id: "14.i"
    kind: bound_gap
    settings: [S_b_sto, S_b_adv]
    statement: Determine the minimax regret for F_b. The lower bound is Omega(d sqrt(n)); the upper bounds are O_tilde(d^1.5 sqrt(n)) (stochastic) and O_tilde(d^2.5 sqrt(n)) (adversarial).
    known_lower_bound: {S_b_sto: "Omega(d*sqrt(n))", S_b_adv: "Omega(d*sqrt(n))"}
    known_upper_bound: {S_b_sto: "O_tilde(d**(3/2)*sqrt(n))", S_b_adv: "O_tilde(d**(5/2)*sqrt(n))"}
    gap_label: polynomial gap in d (d^0.5 stochastic, d^1.5 adversarial)
    related_results: [L1, X1, U24, U18, U26]
    quote: |-
      The most fundamental problem is to understand the minimax regret for $\cF_\pb$. The lower bound is $\Omega(d \sqrt{n})$ and the upper bound is $\tilde O(d^{1.5} \sqrt{n})$
      in the stochastic setting and $\tilde O(d^{2.5} \sqrt{n})§$ in the adversarial setting.
    notes: The source has a stray "§" after the adversarial bound (typo, kept verbatim).
    confidence: high
  - id: "14.ii"
    kind: algorithmic
    settings: [S_b_sto, S_b_adv]
    statement: Find a simple, practical algorithm that needs little tuning and gets the fast (sqrt(n)) rate for d > 1 without smoothness and strong convexity.
    known_lower_bound: null
    known_upper_bound: null
    quote: |-
      From a practical perspective the situation is still relatively dire for $d > 1$.
      The algorithms that are simple and efficient to implement have slow convergence rates without smoothness and strong convexity.
      Algorithms with fast convergence rates have awkward assumptions. For example, online Newton step learns fast for $\cF_\pb^\ps$ and
      is difficult to tune.
      Is there a simple algorithm that works well in practice without too much tuning and obtains the fast rate?
    confidence: high
  - id: "14.iii"
    kind: computational
    settings: [S_b_sto, S_b_adv]
    statement: Prove or refute that Omega(d^2) memory is needed for O_tilde(poly(d) sqrt(n)) regret without smoothness and strong convexity.
    known_lower_bound: null
    known_upper_bound: "O(d^2) memory (all known poly(d) sqrt(n) algorithms)"
    quote: |-
      Algorithms that manage $\tilde O(\poly(d)\sqrt{n})$ regret without smoothness and strong convexity all estimate some kind of curvature or use continuous exponential weights.
      In particular, they use $\Omega(d^2)$ memory. Can you prove this is necessary?
    confidence: high
  - id: "14.iv"
    kind: analysis
    settings: [S_b_sto]
    statement: >-
      Get regret bounds where the loss range B appears only in a lower-order term, not multiplied with the noise
      scale sigma (naive analyses give a leading factor B + sigma).
    known_lower_bound: null
    known_upper_bound: "O_tilde((B + sigma) d^1.5 sqrt(n)) for online Newton step with K in Lowner's position (naive analysis)"
    symbols: {B: "loss range, f in [0, B]", sigma: "Orlicz (psi_2) norm bound of the noise"}
    quote: |-
      In the stochastic setting both the range of the loss function and the Orlicz norm (or maybe variance) of the noise should appear in the regret. This is hidden throughout because
      in most places we (questionably) opted to fix the range to $[0,1]$ and the Orlicz norm of the noise to $1$.
      If you repeat the analysis naively for most settings you will find that for losses bounded in $[0,B]$ and Orlicz norm bound of $\sigma$, the leading term in the regret is $B + \sigma$.
      For example, for online Newton step with $K$ in L\"owner's position we would have a regret of $\tilde O((B+\sigma) d^{1.5} \sqrt{n})$.
      Really, however, the range of the losses should appear in a lower-order term, since over time an algorithm with sublinear regret will play in a region
      where the range of the losses is small (otherwise
      it would have high regret).
    confidence: high
  - id: "14.v"
    kind: algorithmic
    settings: all
    statement: >-
      Adaptivity: algorithms that adapt to the unknown function class (what does it cost?) and anytime algorithms
      that do not need n in advance (decaying learning rates rather than a doubling trick).
    known_lower_bound: null
    known_upper_bound: null
    quote: |-
      More adaptive algorithms are needed. We have seen a plethora of results for this algorithm or that with such-and-such assumptions. But what if you don't know
      what class the losses lie in. Can you adapt? What is the price? Very few works consider this or have serious limitations. A good place to start is the paper by \cite{LZZ22}.
      We have also assumed that $n$ is known upfront and used this to tune learning rates or other parameters. You can always use a doubling trick \citep{BK18}, but generally speaking you would
      expect better practical performance by using a decaying learning rate.
    confidence: high
  - id: "14.vi"
    kind: modelling
    settings: []
    statement: >-
      Extend the algorithms and analysis to non-convex losses (bounds relative to stationary points), or find global
      minima under weaker assumptions (quasi-convexity, Polyak-Lojasiewicz).
    known_lower_bound: null
    known_upper_bound: null
    quote: |-
      There is scope to refine the algorithms and analysis in this text to the non-convex case;
      of course, proving bounds relative to a stationary point rather than a global minimum.
      Someone should push this program through. Alternatively, one may still focus on finding the global minimum but with weaker assumptions such as quasi-convexity
      or losses that satisfy the Polyak--Lojasiewicz condition \citep{polyak1963gradient,karimi2016linear,akhavan2024gradient}.
      Note that these function classes are not closed under addition and hence are not amenable to the adversarial setting.
    notes: Introduces function classes outside Definition 1.1 (quasi-convex, PL, non-convex) and the observation that classes not closed under addition do not suit the adversarial setting.
    confidence: high
  - id: "14.vii"
    kind: algorithmic
    settings: [S_b_sto, S_b_adv]
    statement: Build an optimistic surrogate from an exponential-weights distribution instead of a Gaussian, to better fit the geometry of the constraint set.
    known_lower_bound: null
    known_upper_bound: null
    quote: |-
      Almost all of the properties we proved for the optimistic surrogate relied on Gaussianity of the exploration distribution.
      Two properties that do not rely on this, however, are optimism and convexity. This leaves hope that something may be possible using an exponential weights distribution
      rather than a Gaussian and this may interact better with the geometry of the constraint set.
    confidence: high
  - id: "14.viii"
    kind: conceptual
    settings: [S_b_sto, S_b_adv]
    statement: Is there a black-box reduction (restart when the adversary moves the minimum) that turns any stochastic-setting algorithm into an adversarial-setting algorithm?
    known_lower_bound: null
    known_upper_bound: null
    quote: |-
      \cite{SRN21} and \cite{BEL16} both handle adversarial problems by some sort of test to see if the adversary is moving the minimum and proving that if this occurs, then
      the regret must be negative and it is safe to restart the algorithm. One might wonder if there is some black-box procedure to implement this program so that any algorithm
      designed for the stochastic setting can be used in the adversarial setting.
    notes: A positive answer would be a new transfer rule (stochastic upper -> adversarial upper), the reverse of TR_sto_adv.
    confidence: high
  - id: "14.ix"
    kind: algorithmic
