    definition_quote: |-
      \item $\dom(f_t) = \R^d$ and the setting is improper so that the learner can play outside of $K$.
      \item $f_t$ is strongly convex and smooth: $x \mapsto f_t(x) - \frac{\alpha}{2} \norm{x}^2$ is convex
