  - id: TR_class_inclusion
    from_setting: {function_class: "F_P (property set P)"}
    to_setting: {function_class: "F_Q with Q subset of P"}
    kind: inclusion
    transfers: lower (from the smaller class F_P to the larger F_Q); upper goes the other way
    order: "F_P ⊑ F_Q iff Q ⊆ P (more properties = smaller class)"
    statement: >-
      Classes are subsets of the convex functions defined by property sets, so more properties give a smaller class.
      Example given by the book: the Omega(d sqrt(n)) lower bound for F_b comes from linear losses.
    quote: |-
      We use the property symbols to define subsets of $\cF$. For example:
      \item $\cF_\pb = \{f \in \cF \colon f(x)  \in[0,1] \text{ for all } x \in K\}$.
      \item $\cF_{\pb,\psm,\psc}$ is the set of bounded convex functions that are smooth and strongly convex.
    supporting_quote: |-
      The best lower bound known when the losses are in $\cF_\pb$
      is that the minimax regret is at least $\Omega(d \sqrt{n})$.
      Interestingly, the lower bound was established using linear losses where the upper bound is $\tilde O(d \sqrt{n})$.
    section: "Section 1.3 (after Definition 1.1); Section 2.4"
    validity_scope: >-
      Parameterised properties (sm with beta, sc with alpha) are monotone in the parameter (larger beta / smaller alpha
      = larger class). Implications such as lin => quad and lin => sm (beta = 0) are not stated in the book as rules,
      but follow from Definition 1.1. "d = 1" is a parameter restriction (special case of general d).
    confidence: high
  - id: TR_linear_in_smooth
