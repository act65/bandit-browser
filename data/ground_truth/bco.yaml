      environment: adversarial
      domain: constrained
      dimension: any
      noise: book_default_conditionally_subgaussian_or_zero
      feedback: bandit_one_point
    ontology_v0_1_mapping: {objective: cumulative_regret, feedback: bandit, environment: adversarial_oblivious, action_space: convex, context: none, noise: not_applicable}
    unmapped:
      - "boundedness f(x) in [0,1] on K (no 'bounded convex' value in v0.1)"
      - adversary obliviousness not specified in the tables
      - noise conditionally subgaussian and possibly action-dependent; many cited adversarial results assume noise-free
    definition_quote: |-
      $\cF_\pb = \{f \in \cF \colon f(x)  \in[0,1] \text{ for all } x \in K\}$.
    used_in: [U2, U3, U13, U14, U16, U18, U26, X1]
