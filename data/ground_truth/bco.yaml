# Ground-truth dataset: Tor Lattimore, "Bandit Convex Optimisation" (arXiv:2402.06535v5).
# Hand-built (LLM-assisted, not yet human-verified) from the arXiv LaTeX source (cvx.tex) and
# cross-checked against the PDF text of the same version. Quotes are verbatim LaTeX from cvx.tex
# unless marked "pdf_text". Provenance tier: extracted (D4 tier 1); verification status: extracted (D5).

source:
  title: Bandit Convex Optimisation
  authors: [Tor Lattimore]
  kind: book (monograph, arXiv preprint)
  arxiv_id: "2402.06535"
  arxiv_version: v5
  arxiv_version_date: "2025-11-12"
  version_evidence: >-
    PDF first page reads "arXiv:2402.06535v5 [math.OC] 12 Nov 2025" and "November 2025";
    e-print tarball (https://arxiv.org/e-print/2402.06535) gzip header dated 2025-11-13, single
    source file cvx.tex + all.bib. Table/section numbers below are as printed in the v5 PDF.
  files_used:
    latex: cvx.tex (from arXiv e-print, v5)
    bib: all.bib
    pdf_text: bco.txt (pdftotext of v5 PDF)
  schema_version: "0.1"
  ontology_version: bandits-0.1
  ontology_extensions_proposed: see data/ground_truth/bco-ontology-notes.md (proposed bandits-0.2 / bco module)
  extraction:
    produced_by: Claude (claude-opus-5-5) acting as a sub-agent, 2026-10-19
    status: extracted
    human_verified: false
  conventions:
    horizon_symbol: >-
      Expressions use the book's symbol `n` for the horizon (number of rounds). It is the
      canonical variable `T` of schema.md (map n -> T).
    dimension_symbol: "`d` = ambient dimension of K (canonical d)."
    diameter_symbol: >-
      `D_K` = diam(K). The book writes D, but canonical `D` in schema.md means delay, so it is renamed.
    other_symbols:
      alpha: strong-convexity parameter (Prop (sc)); known constant
      beta: smoothness parameter (Prop (sm)); known constant
      vartheta: self-concordance parameter of a self-concordant barrier on K (book's \vartheta)
      epsilon: target accuracy for sample-complexity bounds (canonical epsilon)
      delta: failure probability (canonical delta)
    quantity_note: >-
      quantity "regret" (not in the v0.1 vocabulary) means the book's Reg_n, which has the sup over x inside
      (i.e. the expected-regret sense when bounded in expectation, not pseudo-regret), where Table 2.2 does not
      say whether the bound is in expectation or with high probability. Lower bounds are recorded as
      expected_regret, the usual minimax reading (not printed in Table 2.1).
    sympy_note: >-
      `alpha`, `beta` collide with SymPy built-ins; parse expressions with
      local_dict built from each result's `symbols` (all names treated as positive Symbols).
      `Max` is the SymPy maximum. O/Omega/O_tilde wrappers are in bound.notation, not in expression.
      For O_tilde bounds polylog factors are dropped from `expression`.
    regret_definition_quote: |-
      The main performance metric in this book is the regret,\index{regret|textbf} which is
      \begin{align*}
      \Reg_n = \sup_{x \in K} \sum_{t=1}^n (f_t(X_t) - f_t(x))\,.
      \end{align*}
      The regret is a random variable with the randomness coming from both the noise and the learner's decisions.
      Normally the regret will be bounded in expectation or with high probability, depending on what is most convenient.
    simple_regret_definition_quote: |-
      At the end of the interaction the learner is expected to output one last point $\widehat X \in K$ and the simple regret is
      \begin{align*}
      \sReg_n = f(\widehat X) - \inf_{x \in K} f(x) \,.
      \end{align*}
    sample_complexity_definition_quote: |-
      Another standard measure of performance in the stochastic setting is the sample complexity, which is the number of
      interactions needed before the simple regret is at most $\eps > 0$ with high probability.
    horizon_known_quote: |-
      We have also assumed that $n$ is known upfront and used this to tune learning rates or other parameters.
  global_assumptions:
    - id: def_1_1
      number: Definition 1.1
      quote: |-
        Let $\cF$ be the space of convex functions from $K$ to $\R$, and
        with $\norm{\cdot}$ the standard euclidean norm define the following properties of a function $f \in \cF$:
        \item[\texttt{Prop (b)}] $f$ is bounded: $f(x) \in [0,1]$ for all $x \in K$.
        \item[\texttt{Prop (l)}] $f$ is Lipschitz: $f(x) - f(y) \leq \norm{x - y}$ for all $x, y \in K$.
        \item[\texttt{Prop (sm)}] $f$ is $\beta$-smooth: $f(x) - \frac{\beta}{2} \norm{x}^2$ is concave on $K$.
        \item[\texttt{Prop (sc)}] $f$ is $\alpha$-strongly convex: $f(x) - \frac{\alpha}{2} \norm{x}^2$ is convex on $K$.
        \item[\texttt{Prop (lin)}] $f$ is linear: $f(x) = x^\top b + c$.
        \item[\texttt{Prop (quad)}] $f$ is quadratic: $f(x) = x^\top A x + x^\top b + c$.
    - id: def_1_1_params
      number: Section 1.3 (after Definition 1.1)
      quote: |-
        When smoothness and strong convexity are involved, our bounds will depend on the parameters $\alpha > 0$ and $0 \leq \beta < \infty$, which we assume are known constants.
    - id: ass_1_2
      number: Assumption 1.2
      quote: |-
        The constraint set $K \subset \R^d$ is a convex body, which means that:
        \item $K$ is convex;
        \item $K$ has a nonempty interior; and
        \item $K$ is compact.
    - id: ass_1_4
      number: Assumption 1.4
      quote: |-
        The noise random variables $\eps_1,\ldots,\eps_n$ are conditionally subgaussian:
        \E\left[\eps_t \mid X_1,Y_1,\ldots,X_{t-1},Y_{t-1},X_t\right] &= 0\,; \text{ and}
        \E\left[\exp(\eps_t^2) \mid X_1,Y_1,\ldots,X_{t-1},Y_{t-1},X_t\right] &\leq 2\,.
      note: Global; noise may depend on history and on the action (needed for submodular bandits, Ch. 13).
    - id: adversarial_def
      number: Section 1.3 (Adversarial Bandit Convex Optimisation)
      quote: |-
        In the adversarial setting the most common assumption is that the noise $\eps_t = 0$ while the functions $f_1,\ldots,f_n$ are chosen
        in an arbitrary way by the adversary.
        Sometimes the adversary is allowed to choose $f_t$ at the same time as the learner chooses $X_t$, in which case we say the adversary is non-oblivious.
        Perhaps more commonly, however, the adversary is obliged to choose all loss functions $f_1,\ldots,f_n$ before the interaction starts. Adversaries of this kind
        are called oblivious. For our purposes it is convenient to allow nonzero noise even in the adversarial case.
    - id: stochastic_def
      number: Section 1.3 (Stochastic Bandit Convex Optimisation)
      quote: |-
        The stochastic setting is more classical. The loss function is now constant over time: $f_t = f$ for all rounds $t$ and unknown $f$.
    - id: improper_def
      number: Note 1.iii
      quote: |-
        Another situation related to the constraint set that arises often is that the losses are defined on all of $\R^d$ and the learner can query any point in $\R^d$ but is
        only evaluated against the best point in $K$. This setting is sometimes referred to as the \textit{improper} setting. The definition ensures that the improper setting is easier
        than both the constrained setting (the learner has more power) and the unconstrained setting (the adversary has less power).
    - id: unconstrained_def
      number: Note 1.ii
      quote: |-
        But assuming boundedness discards many interesting settings.
        Most fundamentally, it prohibits the \textit{unconstrained} setting where $K = \R^d$. Similarly, $K$ cannot be a half-space or other unbounded subset of $\R^d$.
  table_conventions:
    table_2_1:
      label: tab:lower
      caption: Summary of lower bounds.
      quote: |-
        In the class column we use an \texttt{(s)} superscript to indicate that the lower bound holds in the stochastic setting
        and \texttt{(i)} to show that it holds in the improper setting explained in Note~\ref{note:improper}. In the improper setting, Lipschitzness and
        boundedness only hold inside $K$ while smoothness and strong convexity hold everywhere.
    table_2_2:
      label: tab:upper
      caption: Summary of upper bounds
      quote: |-
        Those bounds that depend on $n$ are regret bounds while those that depend on $\eps$ are sample complexity bounds.
        The superscript \texttt{(s)} in the function classes indicate whether or not the work only considers the
        stochastic setting, while the superscript \texttt{(i)} is used when the algorithm needs to query outside $K$ (the improper setting of Note~\ref{note:improper}).
        In some cases the subscript $d = 1$ in the function class indicates that the algorithm assumes the dimension is one.
        The quantity $\vartheta$ is the parameter associated with a self-concordant barrier on $K$ (see \cref{chap:ftrl}) and $D$ is an abbreviation for the diameter $D = \diam(K)$.
        The \textsc{compute} column gives the per-round complexity of each algorithm, which is $\infty$ in the few cases that the regret bound was established non-constructively.
    semantic_warning: >-
      The superscripts mean slightly different things in the two tables. In Table 2.1 "(s)" means the
      lower bound already holds in the (easier) stochastic setting and "(i)" means it holds in the (easier)
      improper setting, so it transfers to harder settings. In Table 2.2 "(s)" means the work only covers the
      stochastic setting and "(i)" means the algorithm needs to query outside K. A missing "(s)" in Table 2.2
      means the bound holds in the adversarial setting. A missing "(i)" means constrained (plays in K).

# ---------------------------------------------------------------------------------------------
# SETTINGS
# assumption_vector dimensions (proposed; see ontology notes):
#   function_class: set of Definition 1.1 properties (convexity always assumed)
#   environment: stochastic (f_t = f) | adversarial (oblivious or non-oblivious left unspecified by the tables)
#   domain: constrained (play in convex body K, compare to K) | improper (query R^d, compare to K) | unconstrained (K = R^d)
#   dimension: any | d=1
#   noise: book default = conditionally 1-subgaussian (Assumption 1.4); many adversarial results are noise-free
#   feedback: one-point bandit (value of f_t at X_t only, plus noise)
# ---------------------------------------------------------------------------------------------
settings:
