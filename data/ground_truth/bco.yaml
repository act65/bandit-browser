# ---------------------------------------------------------------------------------------------
# TRANSFER RULES (edges). Direction convention follows desiderata D1:
#   from = the setting/quantity the result is proved in; to = where it transfers.
#   transfers: which side of a bound moves along the edge.
# ---------------------------------------------------------------------------------------------
transfer_rules:
  - id: TR_improper_constrained
    from_setting: {domain: improper}
    to_setting: {domain: constrained}
    kind: easier_harder_ordering
    transfers: lower
    reverse_transfers: upper (an upper bound for constrained holds for improper)
    statement: The improper setting is easier than the constrained setting, so lower bounds proved in the improper setting hold in the constrained setting.
    order: "improper ⊑ constrained"
    quote: |-
      The unconstrained (Note~\ref{note:K}) and constrained settings are both harder than the improper setting (Note~\ref{note:improper}).
      Hence, lower bounds that hold in the latter also hold in the unconstrained/constrained settings.
    supporting_quote: |-
      The definition ensures that the improper setting is easier
      than both the constrained setting (the learner has more power) and the unconstrained setting (the adversary has less power).
    section: "Section 2.4 (bullet 1); Note 1.iii"
    validity_scope: >-
      Same function-class labels, but in the improper setting b and l hold only inside K while sm and sc hold on R^d
      (Table 2.1 convention). The parameter map is the identity.
    confidence: high
  - id: TR_improper_unconstrained
    from_setting: {domain: improper}
    to_setting: {domain: unconstrained}
    kind: easier_harder_ordering
    transfers: lower
    reverse_transfers: upper
    statement: The improper setting is easier than the unconstrained setting (the adversary has less power), so improper lower bounds hold in the unconstrained setting.
    order: "improper ⊑ unconstrained"
    quote: |-
      The unconstrained (Note~\ref{note:K}) and constrained settings are both harder than the improper setting (Note~\ref{note:improper}).
      Hence, lower bounds that hold in the latter also hold in the unconstrained/constrained settings.
    section: "Section 2.4 (bullet 1); Note 1.iii"
    validity_scope: Unconstrained means K = R^d, which is outside Assumption 1.2 (convex body).
    confidence: high
  - id: TR_simple_to_cumulative
    from_setting: {environment: stochastic}
    to_setting: {environment: stochastic}
    kind: metric_transfer
    transfers: "upper (cumulative regret -> simple regret, divide by n); lower (simple regret -> cumulative regret, multiply by n)"
    parameter_map: "sReg_n <= Reg_n / n, with X_hat = average iterate"
    statement: >-
      By convexity, outputting the average iterate gives sReg_n <= Reg_n / n. So an upper bound R(n) on cumulative
      regret gives simple regret R(n)/n, and a simple-regret lower bound g(n) gives a cumulative lower bound n g(n).
    quote: |-
      Thanks to convexity, there is a straightforward reduction from cumulative regret to simple regret:
      simply let $\widehat X = \frac{1}{n} \sum_{t=1}^n X_t$. Then by convexity,
      \begin{align}
      \sReg_n \leq \frac{1}{n} \Reg_n\,.
      \label{eq:simple}
      \end{align}
    supporting_quote: |-
      The reduction in \cref{eq:simple} shows that lower bounds on the simple regret imply lower bounds on the cumulative regret.
    section: "Section 1.3, eq. (1.4); Section 2.4 (bullet 2)"
    validity_scope: Stochastic setting only (simple regret is defined for f_t = f). Needs convexity of f.
    non_tightness_witness: >-
      Section 2.4 bullet 6: quadratic sm+sc losses (alpha, beta = Theta(1)), unconstrained/improper: cumulative regret
      Theta(d sqrt(n)) but simple regret O(d^2/n) (result X5). "This shows that the reduction in eq. (1.4) is not guaranteed to be tight."
    converse: "The converse is not true (Section 1.3: 'bounds on the cumulative regret imply bounds on the simple regret and sample complexity. The converse is not true.')"
    confidence: high
  - id: TR_hp_regret_to_sample_complexity
    from_setting: {environment: stochastic}
    to_setting: {environment: stochastic}
    kind: metric_transfer
    transfers: upper (high-probability cumulative regret -> sample complexity)
    parameter_map: "If Reg_n <= R(n) w.p. >= 1-delta, sample complexity <= min{n : R(n)/n <= eps}; for R(n) = A n^p, p in (0,1): <= 1 + (A/eps)^{1/(1-p)}"
    statement: A high-probability regret bound gives a sample-complexity bound via the average iterate.
    quote: |-
      Suppose that with probability at least $1 - \delta$ the regret of some algorithm is bounded by $\Reg_n \leq R(n)$. Then, by the above conversion, the sample complexity can be bounded by
      the smallest $n$ such that $R(n)/n \leq \eps$. Concretely, if $R(n) = A n^{p}$ for $p \in (0,1)$ and $A > 0$, then the sample complexity is at most
      $1 + (A/\eps)^{1/(1-p)}$.
    section: Fact 1.6
    example: "Reg = O_tilde(d^{1.5} sqrt(n)) (U24) -> sample complexity O_tilde(d^3/eps^2)"
    confidence: high
  - id: TR_expected_regret_to_sample_complexity
    from_setting: {environment: stochastic}
    to_setting: {environment: stochastic}
    kind: metric_transfer
    transfers: upper (expected cumulative regret -> high-probability sample complexity)
    parameter_map: "queries O((min{n : R(n)/n <= eps/4} + log(1/delta)/eps^2) log(1/delta))"
    statement: >-
      Restart the algorithm O(log(1/delta)) times, then run best-arm identification on the average iterates
      (Algorithm 1.1). This turns E[Reg_n] <= R(n) into an (eps, delta) sample-complexity bound.
    quote: |-
      Suppose that $\E[\Reg_n] \leq R(n)$. Then
      \item \cref{alg:reduction} queries the loss at most
      O\left(\left(\min\left\{n \colon \frac{R(n)}{n} \leq \frac{\eps}{4}\right\} + \frac{\log(1/\delta)}{\eps^2}\right) \log(1/\delta)\right)
      times; and
      \item With probability at least $1 - \delta$, \cref{alg:reduction} returns an $\widehat X \in K$ such that
      f(\widehat X) \leq \inf_{x \in K} f(x) + \eps \,.
    section: Proposition 1.7 (label prop:conversion)
    validity_scope: Stochastic setting; costs an extra log(1/delta) factor (log_factor_transfer flavour).
    confidence: high
  - id: TR_sto_adv
    from_setting: {environment: stochastic}
    to_setting: {environment: adversarial}
    kind: inclusion
    transfers: lower
    reverse_transfers: upper (adversarial upper bounds hold in the stochastic setting)
    order: "stochastic ⊑ adversarial"
    statement: >-
      With noise allowed in the adversarial setting (as the book defines it), the adversarial setting is strictly
      harder than the stochastic one. All Table 2.1 lower bounds therefore apply to the adversarial setting.
    quote: |-
      The adversarial setting as defined here is strictly harder than the stochastic setting, which means that all the bounds in \cref{tab:lower} also apply to the adversarial setting.
    supporting_quote: |-
      For our purposes it is convenient to allow nonzero noise even in the adversarial case. This is sometimes essential in applications; for example,
      in bandit submodular minimisation (\cref{chap:submod}). And besides, it feels natural that the adversarial setting should generalise the stochastic one.
    section: "Section 2.4 (bullet 4); Section 1.3"
    validity_scope: >-
      Holds only for the book's noisy adversarial model. For noise-free adversarial with bounded losses (common in the
