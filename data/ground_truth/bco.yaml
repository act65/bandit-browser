    parameter_map: "linear = smooth with beta = 0"
    statement: >-
      Linear losses are beta-smooth with beta = 0, so the linear-bandit lower bound Omega(d sqrt(n)) also applies to
      smooth losses. Smoothness alone cannot beat the sqrt(n) barrier; it takes higher-order smoothness plus strong convexity.
    quote: |-
      \item Even when $\beta = 0$, the regret upper bound of \cref{alg:ftrl:basic} is still $\Omega(\sqrt{n})$. Since
      $\beta = 0$ corresponds to linear losses, the lower bounds for linear bandits (\cref{tab:lower}) show that this is not improvable.
      Hence, no amount of smoothness by itself can improve the regret beyond the $\sqrt{n}$ barrier.
    section: Note 6.vi
    confidence: high
