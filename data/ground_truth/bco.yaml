    confidence: high
  - id: TR_scaling_invariance
    from_setting: {constraint_set: K}
    to_setting: {constraint_set: "gamma K"}
    kind: reduction
    transfers: both
    parameter_map: "diam -> gamma diam; gradient -> gradient/gamma; Hessian -> Hessian/gamma^2; invariant: Lipschitz x diameter, alpha/beta"
    statement: Rescaling coordinates should not change achievable regret; bounds must be invariant in Lip x diam and alpha/beta.
    quote: |-
      From this we see that the product of the Lipschitz constant and the diameter is invariant under scaling, as is the ratio of strong convexity and smoothness parameters.
      You should always check that various results are compatible with these scaling results in the sense that the regret bound should be invariant to scale if the assumptions
      permit scaling.
    section: Section 3.3 (Proposition 3.8)
    validity_scope: >-
      The book's classes fix the Lipschitz constant to 1 and the range to [0,1], so scaling moves between parameter values
      of a family. A sanity check for bound expressions rather than an edge between named settings.
    confidence: medium
  - id: TR_bounded_to_lipschitz_interior
    from_setting: {function_class: [bounded], constraint_set: "K_eps = (1-eps)K"}
    to_setting: {function_class: [bounded, lipschitz_1_over_eps_r], constraint_set: K_eps}
    kind: reduction
    transfers: upper (a Lipschitz-class algorithm on K_eps gives an F_b algorithm on K with additive eps n regret)
    parameter_map: "Lipschitz constant 1/(eps r) on K_eps when B_r subset K; approximation cost min_{K_eps} f <= inf_K f + eps"
    statement: >-
      Bounded convex functions are Lipschitz on a shrunk body and nearly minimised there, so restricting play to K_eps
      reduces F_b to a Lipschitz class at an additive cost eps per round.
    quote: |-
      \begin{corollary}\label{cor:lip2}
      Suppose that $f \colon K \to [0,1]$ is convex and $\ball_r \subset K$ and $K_\eps = (1-\eps) K$. Then $\lip_{K_\eps}(f) \leq \frac{1}{\eps r}$.
      \end{corollary}
    supporting_quote: |-
      Then
      \begin{align*}
      \min_{y \in K_\eps} f(y) \leq \inf_{y \in K} f(y) + \eps \,.
      \end{align*}
    section: Corollary 3.12, Proposition 3.13 (Sections 3.4-3.5)
    validity_scope: The Lipschitz constant grows as 1/eps, so it is not an edge to F_{b,l} (Lipschitz constant 1) without rescaling.
    confidence: medium
  - id: TR_lipschitz_extension
    from_setting: {function_class: [lipschitz], domain: constrained}
    to_setting: {function_class: [lipschitz], domain: unconstrained}
    kind: reduction
    transfers: upper (unconstrained algorithms can be run on an extension of the loss)
    parameter_map: "extension e with lip(e) = lip(f), e = f on K"
    statement: Lipschitz convex functions on K extend to R^d with the same Lipschitz constant, which lets algorithms for unconstrained problems be used.
    quote: |-
      One way to mitigate these problems is to use an algorithm designed for unconstrained bandit convex optimisation on an extension of the loss function(s).
    supporting_quote: |-
      When $f$ is Lipschitz on its domain then an extension to $\R^d$ is always possible.
    section: Section 3.7, Proposition 3.18
    validity_scope: >-
      The extension cannot always be evaluated (an evaluable extension is Proposition 3.20). Plays outside K must be
      mapped back to K, so this is a tool, not a black-box setting edge.
    confidence: low
  - id: TR_two_point_feedback
    from_setting: {feedback: two_point}
    to_setting: {feedback: bandit_one_point}
    kind: easier_harder_ordering
    transfers: lower (a two-point lower bound holds for one-point feedback)
    reverse_transfers: upper (a one-point upper bound holds with two-point feedback, ignoring the extra evaluation)
    order: "two_point ⊑ bandit_one_point (more feedback = easier)"
    statement: >-
      Two evaluations per round make the problem behave like full information (directional derivatives can be computed),
      so two-point feedback is much easier than one-point bandit feedback.
    quote: |-
      A number of authors have explored what changes if the learner is allowed to choose
      \textit{two} points $X_{t,1}, X_{t,2} \in K$ and observes $f_t(X_{t,1})$ and $f_t(X_{t,2})$.
      One might believe that such a modification would have only a mild effect but this is not at all the case.
      Having access to two evaluations makes the bandit setup behave more like the full information setting \citep{ADX10,nesterov2017random,duchi2015optimal}.
    section: Note 1.vi
    validity_scope: Stated for the adversarial setting without noise.
    confidence: medium

