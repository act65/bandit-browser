# Ground-truth dataset: Lattimore & Szepesvari, Bandit Algorithms (Cambridge UP 2020), free online PDF.
# Hand-built (LLM-assisted, not human-verified) from pdftotext -layout of the authors' PDF.
# Generated by a build script; quotes were extracted programmatically between anchors.

source:
  title: Bandit Algorithms
  authors:
  - Tor Lattimore
  - Csaba Szepesvári
  year: 2020
  publisher: Cambridge University Press
  url: https://tor-lattimore.com/downloads/book/book.pdf
  accessed: '2026-10-23'
  edition_note: free online edition (PDF metadata CreationDate 2024-08-12, 597 pages); page numbers differ from the print
    edition
  ontology_version: '0.5'
  files_used: corpus/src/lattimore2020bandit/book.pdf -> book.txt (pdftotext -layout), not committed
  conventions:
    page: PDF page index (1-based), not the printed page number
    quote: verbatim from the pdftotext -layout text after collapsing whitespace and dropping control / private-use glyphs;
      math is garbled by pdftotext, so formulas in quotes read as extracted. Multiple excerpts are joined with ' … '.
    symbols: book n -> T, k -> K, m_2 -> S, ||theta||_0 bound m_0 / p -> s_sparse, d_inf -> Kinf_i, c*(nu) (BAI) -> T_star,
      c(A, theta) -> C_lin; other non-canonical names declared per result in `symbols`
    regret: the book's R_n = n mu* - E[sum X_t] is pseudo_regret in ontology terms; adversarial R_n = E[max_i sum x_ti - sum
      X_t] is expected_regret; bounds on the random (pseudo-)regret holding w.p. 1 - delta are high_probability_regret
    notation: constants left unspecified by the book ('universal constant C') -> O / Omega; liminf / limsup expressions are
      the constant c in lim R_T/log(T) (except LS-33.6, see note)
    extra_fields: tuning (algorithm parameter choices), symbols (non-canonical names), comparator (ontology vocabularies.comparator)
      are added where relevant
  extraction:
    produced_by: Claude (claude-opus-5-5) sub-agent, 2026-10-23
    status: extracted
    human_verified: false
