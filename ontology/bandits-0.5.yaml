#   noise_detail.variance: `unspecified_means: homoscedastic` (applied by resolve.py) after the re-extraction showed
#   455 unspecified vs 221 homoscedastic settings for the same standard model, which split core K-armed cells.
#   bandit ⊑ partial_monitoring now `requires_general` a class of games (observability locally / globally / any):
#   specific feedback mechanisms mapped to partial_monitoring (e.g. transparent auctions) are richer than bandit.
#   2026-10-26 (from the inference audit, pipeline/audit_inference.py): stochastic_corrupted ⊑ adversarial_self_bounding
#   requires corruption.regret_reference = corrupted (uncorrupted-mean regret differs by up to C); the reduction
#   finite_K -> linear_finite (d = K) applies only `when` context = none (contextual K-armed bandits with M_ctx
#   contexts need d = K * M_ctx, or are not linear at all under a general function class).
#   The finite_K -> linear_finite reduction also implies action_set.parameter_structure = dense and parameter_set = polytope
#   (theta is the mean vector in [0,1]^K): K-armed instances are not sparse, and not in an l2 ball.
#   action_set.parameter_structure: unstated (unspecified, or not_applicable in a linear action space) means dense, so
#   lower bounds proved for unrestricted parameters no longer reach sparse settings.
